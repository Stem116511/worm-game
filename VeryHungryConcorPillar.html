// Zeichnet den Schmetterling zentriert auf dem Spielfeld (BOARD_PX x BOARD_PX), direkt auf dem
// Canvas (Marcos Entscheidung nach Rueckfrage zur technischen Umsetzung). Wird nur im 'won'-Zustand
// aufgerufen (siehe drawOverlay() weiter unten).
function drawButterfly() {
  const d = BUTTERFLY_DATA;
  // Bestaetigte Bild-Bounding-Box, identisch zur SVG-viewBox der bestaetigten Stilprobe
  const SRC = { x: 8, y: 8, w: 394, h: 347 };
  // Zielbreite so gewaehlt, dass ringsum weiterhin sichtbar gruene Spielfeld-Flaeche bleibt
  // (~15px links/rechts, ~42px oben/unten bei BOARD_PX=480) - von Marco bestaetigt.
  const targetW = 450;
  const scale = targetW / SRC.w;
  const cxSrc = SRC.x + SRC.w / 2;
  const cySrc = SRC.y + SRC.h / 2;
  const offsetX = BOARD_PX / 2 - cxSrc * scale;
  // Um 40px nach oben verschoben (von Marco bestaetigt, 23.09.2026, Stilprobe
  // stilprobe-schmetterling-verzoegerung.html: "Schmetterling etwas hoeher"), damit nach dem
  // Einblenden des Panels (16px Abstand vom unteren Rand statt vorher 64px, siehe CSS oben) mehr
  // vom Schmetterling frei bleibt statt vom Panel verdeckt zu werden.
  const offsetY = BOARD_PX / 2 - cySrc * scale - 40;

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // Aussenkontur (Schatten-/Hintergrundflaeche der Fluegel)
  const outerPath = new Path2D(d.outer_path);
  ctx.fillStyle = bodyFill(204.8, 180.9, 188.6, COLORS.morpho.dark);
  ctx.fill(outerPath);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = COLORS.morpho.outline;
  ctx.lineWidth = 2.4;
  ctx.stroke(outerPath);

  // Fluegel-Innenflaechen (Adernetz-Aussparung), bestaetigtes Tuerkis
  const blueBoxes = [
    { cx: 290.6, cy: 178.3, r: 148.8 },
    { cx: 121.6, cy: 179.2, r: 149.7 },
  ];
  d.blue_paths.forEach(function (bp, i) {
    const p = new Path2D(bp);
    const box = blueBoxes[i];
    ctx.fillStyle = bodyFill(box.cx, box.cy, box.r, COLORS.morpho.teal);
    ctx.fill(p);
    ctx.strokeStyle = COLORS.morpho.teal.lo;
    ctx.lineWidth = 1.8;
    ctx.stroke(p);
  });

  // 38 echte Randpunkte aus dem Referenzfoto
  for (const dot of d.dots) {
    const x = dot[0], y = dot[1], r = dot[2];
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.morpho.dotFill;
    ctx.fill();
    ctx.strokeStyle = COLORS.morpho.teal.lo;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  // Fuehler (Pfad + goldene Spitze)
  const antennae = [[d.ant_l_path, d.ant_l_tip], [d.ant_r_path, d.ant_r_tip]];
  for (const pair of antennae) {
    const antPath = new Path2D(pair[0]);
    const tip = pair[1];
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke(antPath);
    ctx.beginPath();
    ctx.arc(tip[0], tip[1], 5.5, 0, Math.PI * 2);
    ctx.fillStyle = bodyFill(tip[0], tip[1], 5.5, COLORS.morpho.gold);
    ctx.fill();
    ctx.strokeStyle = COLORS.morpho.outline;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Koerper-Kapsel (verjuengt, bestaetigt) + 2 Glanzlicht-Ellipsen
  const bodyPath = new Path2D(d.body_path);
  ctx.fillStyle = bodyFill(202.6, 169.5, 36.8, COLORS.morpho.body);
  ctx.fill(bodyPath);
  ctx.strokeStyle = COLORS.morpho.outline;
  ctx.lineWidth = 1.6;
  ctx.stroke(bodyPath);

  ctx.save();
  ctx.translate(196, 145);
  ctx.rotate(-10 * Math.PI / 180);
  ctx.beginPath();
  ctx.ellipse(0, 0, 4.2, 6.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(199, 172);
  ctx.rotate(-8 * Math.PI / 180);
  ctx.beginPath();
  ctx.ellipse(0, 0, 3.2, 5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();
  ctx.restore();

  // Gesicht: Augen (weiss + dunkle Pupille + Glanzpunkt + Wimpernbogen) - dieselben Farben wie bei
  // der Raupe (COLORS.eyeWhite/eyePupil/lash), statisch platziert (kein Blickrichtungs-Vektor
  // noetig, keine Bewegung auf dem Endbildschirm).
  const EYE_Y = 145, EYE_DX = 9, EYE_R = 6.0, PUPIL_R = 3.2;
  for (const side of [-1, 1]) {
    const ex = 204 + side * EYE_DX, ey = EYE_Y;
    ctx.beginPath(); ctx.arc(ex, ey, EYE_R, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.eyeWhite; ctx.fill();
    ctx.strokeStyle = COLORS.morpho.outline; ctx.lineWidth = 0.8; ctx.stroke();

    ctx.beginPath(); ctx.arc(ex, ey + 0.8, PUPIL_R, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.eyePupil; ctx.fill();

    ctx.beginPath(); ctx.arc(ex - 1.4, ey - 1.4, 1.1, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();

    const lashPath = new Path2D(
      'M ' + (ex - EYE_R * 0.85).toFixed(1) + ',' + (ey - EYE_R * 0.4).toFixed(1) + ' ' +
      'A ' + EYE_R + ' ' + EYE_R + ' 0 0 1 ' + (ex + EYE_R * 0.85).toFixed(1) + ',' + (ey - EYE_R * 0.4).toFixed(1)
    );
    ctx.strokeStyle = COLORS.lash; ctx.lineWidth = 0.9; ctx.lineCap = 'round';
    ctx.stroke(lashPath);
  }

  // Mund: offen, Mundwinkel als hoechster Punkt (Grinsen), helles Rot (bestaetigt)
  const MOUTH_CORNER_Y = 154.5, MOUTH_HALF = 6.5;
  const mouthPath = new Path2D(
    'M ' + (204 - MOUTH_HALF) + ',' + MOUTH_CORNER_Y + ' ' +
    'Q 204,' + (MOUTH_CORNER_Y + 2.5) + ' ' + (204 + MOUTH_HALF) + ',' + MOUTH_CORNER_Y + ' ' +
    'Q 204,' + (MOUTH_CORNER_Y + 11) + ' ' + (204 - MOUTH_HALF) + ',' + MOUTH_CORNER_Y + ' Z'
  );
  ctx.fillStyle = COLORS.morpho.mouth;
  ctx.fill(mouthPath);
  ctx.strokeStyle = COLORS.morpho.outline;
  ctx.lineWidth = 1;
  ctx.stroke(mouthPath);

  ctx.restore();
}

// Auf dem Canvas liegt nur noch der Schmetterling. Alle Texte (Start, Pause, Ende) stehen im
// HTML-Panel (siehe updateButtons()) - der frueher hier gezeichnete Pause-Balken (drawCenteredText)
// ist seit Punkt 6 (23.09.2026) durch das Pause-Panel ersetzt und entfernt.
function drawOverlay() {
  if (state.phase === 'won') {
    drawButterfly();
  }
}

// Raeumliches Tiefengefuehl (Wunsch von Marco): ein Objekt, das WEITER UNTEN im Feld steht (groesserer
// y-Wert = naeher am Betrachter gedacht), wird ueber ein Objekt gezeichnet, das weiter oben steht -
// unabhaengig davon, ob es sich um ein Raupenglied, Futter oder den Boesewicht handelt. Dafuer werden
// alle sichtbaren Objekte in eine gemeinsame Liste gesammelt, nach ihrer Feld-Zeile (y) aufsteigend
// sortiert (kleines y zuerst = "weiter hinten"/wird zuerst gezeichnet, grosses y zuletzt = "weiter
// vorne"/wird zuletzt gezeichnet und liegt damit oben) und erst dann der Reihe nach gezeichnet.
// Frueher wurden Futter/Boesewicht immer VOR der ganzen Raupe gezeichnet, wodurch die Raupe selbst
// beim Vorbeifahren an einem tiefer stehenden Futter-Symbol faelschlich darueber lag.
// Futter/Boesewicht werden VOR den Raupengliedern in die Liste eingefuegt, die Raupenglieder
// selbst vom Schwanz zum Kopf (wie zuvor). Das ist wichtig fuer die Stabilitaet von Array.sort():
// bei GLEICHER Zeile bleibt die Einfuege-Reihenfolge erhalten, d. h. bei einem Gleichstand
// gewinnt IMMER die Raupe (wird zuletzt / obenauf gezeichnet) - so wie Marco es wollte: "wenn
// das Essen und der Kopf auf dem selben Feld sind, dann ist der Kopf wichtiger, das Essen wird ja
// gegessen und verschwindet". Unter den Raupengliedern selbst sorgt dieselbe Stabilitaet dafuer,
// dass bei GLEICHER Zeile (waagrechte Nachbarglieder) die Kopf-naeheren Glieder weiterhin wie
// bisher ueber den schwanz-naeheren liegen.
function draw() {
  // Zuerst die GESAMTE Zeichenflaeche inkl. Rand loeschen/neu zeichnen (nicht nur das Karo-Raster) -
  // sonst wuerden Boesewicht-/Futter-Teile, die letzten Tick in den Rand hineinragten, dort als Spur
  // liegen bleiben, da drawBoard() nur die GRID*CELL-Flaeche neu zeichnet. Statt eines einfarbigen
  // fillRect() wird hier die vorgerenderte Wiese (meadowCache, siehe Abschnitt "5c) Wiese" weiter
  // oben) als fertiges Bild hineinkopiert - ein einzelner drawImage()-Aufruf statt jeden Tick erneut
  // hunderte ueberlappende Grashalme/Blueten zu berechnen.
  ctx.drawImage(meadowCache, 0, 0);

  // Rest der Zeichenroutine bleibt unveraendert und rechnet weiterhin mit Koordinaten von 0 bis
  // BOARD_PX (Zellgrenzen etc.) - der Rand wird stattdessen per Verschiebung des Koordinatenursprungs
  // "aussen herum" gelegt, damit Elemente, die ueber die Feldkante hinausragen (Boesewicht-Hoernchen,
  // Futter-Icons in Randzellen), in diesen Rand hinein statt hart abgeschnitten gezeichnet werden.
  ctx.save();
  ctx.translate(CANVAS_MARGIN, CANVAS_MARGIN);

  drawBoard();

  // Wiese darf unten/links/rechts sichtbar ins Spielfeld hineinreichen (Wunsch von Marco) - drawBoard()
  // hat das Karo gerade VOLL deckend darueber gezeichnet, deshalb hier den entsprechenden Ausschnitt
  // aus meadowCache (der im Spielfeld-Bereich ausserhalb der eigentlichen Randstreifen transparent
  // ist, siehe buildMeadowCache()-Kommentar) noch einmal obendrauf kopieren. Quelle und Ziel sind
  // exakt derselbe Bildausschnitt, nur um CANVAS_MARGIN verschoben (da wir hier bereits im per
  // translate() verschobenen Koordinatensystem sind, meadowCache aber in den urspruenglichen,
  // unverschobenen Canvas-Koordinaten aufgebaut wurde). Die Boesewicht-/Futter-/Raupen-Objekte werden
  // ERST DANACH gezeichnet (siehe drawables unten) - liegen also IMMER ueber der hineinragenden
  // Wiese, auch wenn beide in derselben Feld-Zeile stehen (das war Marcos Vorrang-Wunsch).
  const mo = MEADOW_FIELD_OVERLAP;
  // unten:
  ctx.drawImage(meadowCache,
    0, CANVAS_MARGIN + BOARD_PX - mo, CANVAS_PX, CANVAS_MARGIN + mo,
    -CANVAS_MARGIN, BOARD_PX - mo, CANVAS_PX, CANVAS_MARGIN + mo);
  // links:
  ctx.drawImage(meadowCache,
    0, 0, CANVAS_MARGIN + mo, CANVAS_PX,
    -CANVAS_MARGIN, -CANVAS_MARGIN, CANVAS_MARGIN + mo, CANVAS_PX);
  // rechts:
  ctx.drawImage(meadowCache,
    CANVAS_MARGIN + BOARD_PX - mo, 0, CANVAS_MARGIN + mo, CANVAS_PX,
    BOARD_PX - mo, -CANVAS_MARGIN, CANVAS_MARGIN + mo, CANVAS_PX);

  let drawables = [];
  let puffU = 0;
  if (state.phase === 'cocoon' && state.cocoon) {
    // Verpuppungs-Sequenz: Raupe/Kokon/verpuffender Boesewicht je nach Zeit state.cocoon.t (5e)
    const seq = cocoonDrawables();
    drawables = seq.items;
    puffU = seq.puffU;
  } else if (state.phase !== 'won') {
    // In 'won' (Schmetterling) wird nichts mehr vom Spielfeld gezeichnet: Raupe ist verpuppt, Futter
    // und Boesewicht sind weg - frueher schaute die Raupe an den Fluegel-Luecken unter dem
    // Schmetterling hervor, jetzt waere das wieder die (laengst verpuppte) Raupe.
    if (state.villainEnabled && state.villain) {
      drawables.push({ y: state.villain.y, draw: drawVillain });
    }
    if (state.food) {
      drawables.push({ y: state.food.y, draw: drawFood });
    }
    for (let i = state.snake.length - 1; i >= 0; i--) {
      drawables.push({ y: state.snake[i].y, draw: drawSnakeSegment.bind(null, i) });
    }
  }
  drawables.sort(function (a, b) { return a.y - b.y; });
  for (const item of drawables) item.draw();
  // Rauchwolke des verpuffenden Boesewichts liegt ueber allem (auch ueber dem Kokon)
  if (puffU > 0 && puffU < 1 && state.villain) drawPuff(puffU);

  drawOverlay();
  ctx.restore();
}

// ---------------------------------------------------------------
// 6) Game-Loop
// ---------------------------------------------------------------
// Statt setInterval(step, state.tickMs) (feste Rate, die der Browser nur "ungefaehr" einhaelt -
// je nach Auslastung des Tabs kommt ein Tick mal ein paar Millisekunden zu spaet, was sich als
// gelegentliches kurzes Ruckeln bemerkbar macht) verwenden wir einen SELBSTKORRIGIERENDEN
// setTimeout-Loop: er merkt sich den Zeitpunkt, zu dem der naechste Tick EIGENTLICH faellig waere
// (expectedTickTime), und zieht eine etwaige Verspaetung (drift) von der naechsten Wartezeit ab.
// So bleibt die Raupe im Mittel exakt beim eingestellten Tempo, auch wenn einzelne Ticks durch
// kurze Aussetzer (z. B. Tab kurz im Hintergrund beschaeftigt) etwas zu spaet kommen - sie holt
// die verlorene Zeit beim naechsten Tick wieder auf, statt den Fehler aufzusummieren. Bewusst
// weiterhin EIN einfacher Timer (kein requestAnimationFrame) - das Konzept will hier bewusst das
// einfachere Modell "ein Tick = ein Zeitgeber", nur eben mit Ausgleich statt blindem Vertrauen in
// die Timer-Genauigkeit.
let loopActive = false;
let timeoutId = null;
let expectedTickTime = 0;   // Zeitpunkt (performance.now()), zu dem der naechste Tick faellig ist

// Schmetterling-Verzoegerung (von Marco bestaetigt, 23.09.2026, siehe Stilprobe
// stilprobe-schmetterling-verzoegerung.html): haelt den Timer fest, der das Panel nach
// WON_REVEAL_DELAY_MS automatisch einblendet (siehe updateButtons()/revealWonPanel() weiter unten).
let wonRevealTimer = null;
const WON_REVEAL_DELAY_MS = 1000;

// Blendet das Panel sofort ein (Timer abbrechen, "won-pending"-Klasse entfernen - das CSS-Fade
// (transition: opacity 0.35s, siehe #centerOverlay.phase-won.won-fade-armed .panel weiter oben)
// uebernimmt den sanften Uebergang von selbst, da "won-fade-armed" beim Verstecken bereits gesetzt
// wurde). Wird sowohl vom Timer als auch vom Klick/Tipp-Handler (boardWrap-Listener weiter unten)
// aufgerufen - mehrfacher Aufruf ist unschaedlich (idempotent).
function revealWonPanel() {
  if (wonRevealTimer) { clearTimeout(wonRevealTimer); wonRevealTimer = null; }
  centerOverlay.classList.remove('won-pending');
}

// Live-Score-Zeile (Punkt 6): die Elemente werden EINMAL aufgebaut und danach nur noch mit neuen
// Zahlen befuellt (frueher replaceChildren bei jedem Tick). Nur so kann die Punkt-Animation laufen,
// ohne dass sie bei jedem Tick durch ein neu erzeugtes Element neu startet.
let scoreNumEl = null, bestEl = null, bestNumEl = null;
let shownScore = null, shownBest = null;   // zuletzt angezeigte Werte (null = noch nichts)

function popNum(el) {
  el.classList.remove('pop');
  void el.offsetWidth;   // Reflow, damit die Animation bei jedem neuen Punkt neu startet
  el.classList.add('pop');
}

function updateScore() {
  if (!scoreNumEl) {
    scoreNumEl = document.createElement('span');
    scoreNumEl.className = 'num';
    bestNumEl = document.createElement('span');
    bestNumEl.className = 'num';
    bestEl = document.createElement('span');
    bestEl.className = 'best';
    bestEl.append('Highscore: ', bestNumEl);
    scoreEl.replaceChildren('Score: ', scoreNumEl, ' \u00b7 ', bestEl);
  }
  const score = state.score, best = displayedHighscore();
  scoreNumEl.textContent = score;
  bestNumEl.textContent = best;
  // Pop nur beim ANSTIEG (nicht beim Zuruecksetzen auf 0 nach Neustart, nicht beim ersten Aufbau).
  if (shownScore !== null && score > shownScore) popNum(scoreNumEl);
  if (shownBest !== null && best > shownBest) popNum(bestNumEl);
  shownScore = score;
  shownBest = best;
  // Gold: Rekord wird gerade geknackt (nur wenn es schon einen Highscore gab - sonst waere auf einem
  // frischen Geraet jeder erste Punkt ein "Rekord") ODER die Runde ist mit Rekord beendet
  // (state.newRecord; commitHighscore() hat state.highscore dann schon angehoben).
  bestEl.classList.toggle('record', state.newRecord || (state.highscore > 0 && state.score > state.highscore));
}

function updateInfo() {
  const modeLabel = state.mode === 'goal' ? ('Goal ' + (state.goalTarget !== null ? state.goalTarget : '?')) : 'Endless';
  infoEl.textContent =
    'Phase: ' + state.phase + ' · Tick ' + state.tick + ' · ' + state.tickMs + ' ms/Schritt · Punkte: ' + state.score +
    ' · Mode: ' + modeLabel + (state.villainEnabled ? ' · Villain' : '') +
    (state.overReason ? ' · Reason: ' + state.overReason : '') +
    ' · HS: ' + state.highscore + ' · Storage: ' + (state.storageOk ? 'ok' : 'unavailable');
}

// Zeigt an, welcher Modus aktuell gewaehlt ist (nur auf dem Startbildschirm relevant), und blendet
// das Zielwert-Feld nur im Ziel-Modus ein. Bewusst per style statt classList umgesetzt (einfacher,
// keine zusaetzliche CSS-Klasse noetig).
function updateModeButtons() {
  const isGoal = state.mode === 'goal';
  modeEndlessBtn.style.opacity = isGoal ? '0.55' : '1';
  modeGoalBtn.style.opacity = isGoal ? '1' : '0.55';
  goalInputWrap.style.display = isGoal ? 'flex' : 'none';
}

function setMode(mode) {
  state.mode = mode;
  goalError.textContent = '';
  updateModeButtons();
}

// Setzt Text UND Sichtbarkeit einer Endbildschirm-Zeile in einem Schritt: eine leere Zeile wird
// komplett ausgeblendet (nicht nur textlos), damit der flex-gap zwischen den Zeilen keine
// unschoene Luecke fuer eine ungenutzte Zeile freihaelt.
function setEndLine(el, text) {
  if (text) {
    el.textContent = text;
    el.style.display = 'block';
  } else {
    el.textContent = '';
    el.style.display = 'none';
  }
}

// Waehlt Text und Farbvariante (data-variant, siehe CSS "Endbildschirm-Inhalt") fuer den
// Endbildschirm - abhaengig davon, ob das Ziel erreicht wurde oder woran die Raupe gestorben ist
// (siehe state.overReason). Mit Marco abgestimmt (20.09.2026, Wand/sich selbst getrennt 23.09.2026):
// - Ziel erreicht ('won'): "Look, I am a beautiful butterfly!" plus Score-Zeile.
// - Tod durch den Boesewicht ('villain'): "It was a trap! / There was no food!", UNABHAENGIG von
//   der Punktzahl - auch bei 0 Punkten hat diese Variante Vorrang vor 'starving' (bestaetigt 20.09.2026).
// - Kein Boesewicht-Tod, aber 0 Punkte ('starving'): "Nothing eaten" ohne Score-Pill (waere
//   redundant), nur der Highscore, falls es schon einen gibt.
// - Wand ('wall') bzw. eigener Koerper ('self') mit mindestens 1 Punkt: je eigener Ausruf plus
//   "still hungry", mit Score-Zeile.
function applyEndScreenText() {
  let variant;
  if (state.phase === 'won') {
    variant = 'won';
    setEndLine(endTitle, 'Look, I am a beautiful BUTTERFLY!');
    setEndLine(endLine1, '');
    setEndLine(endLine2, '');
    setEndScoreLine(true);
  } else {
    setEndLine(endTitle, 'Game Over');
    if (state.overReason === 'villain') {
      variant = 'villain';
      setEndLine(endLine1, 'It was a trap!');
      setEndLine(endLine2, 'There was no food!');
      setEndScoreLine(true);
    } else if (state.score === 0) {
      variant = 'starving';
      setEndLine(endLine1, 'ConcorPillar is starving!');
      setEndLine(endLine2, 'Nothing eaten');
      setEndScoreLine(false);
    } else {
      variant = state.overReason === 'self' ? 'self' : 'wall';
      setEndLine(endLine1, variant === 'self' ? 'Oops, that was my own tail!' : 'Bonk! That was a wall.');
      setEndLine(endLine2, 'ConcorPillar is still hungry!');
      setEndScoreLine(true);
    }
  }
  centerOverlay.dataset.variant = variant;
}

// Score-Zeile des Endbildschirms als "Pills" (Stilprobe stilprobe-endbildschirme-inhalt.html):
// [Score X] [Highscore Y], bei neuem Rekord [Score X] [New highscore!] (Gold), ohne Score
// (0 Punkte) nur [Highscore Y], falls schon einer existiert. Aufbau per createElement/textContent
// statt innerHTML - die Zahlen kommen zwar aus dem eigenen state, aber so bleibt es auch bei einem
// manipulierten localStorage-Wert ein reiner Text.
function makePill(label, value, extraClass) {
  const pill = document.createElement('span');
  pill.className = extraClass ? 'pill ' + extraClass : 'pill';
  const lbl = document.createElement('span');
  lbl.className = 'lbl';
  lbl.textContent = label;
  pill.append(lbl);
  if (value !== null) {
    const val = document.createElement('span');
    val.className = 'val';
    val.textContent = String(value);
    pill.append(val);
  }
  return pill;
}

function setEndScoreLine(withScore) {
  endScore.replaceChildren();
  if (withScore) {
    endScore.append(makePill('Score', state.score, ''));
    endScore.append(state.newRecord
      ? makePill('New highscore!', null, 'record')
      : makePill('Highscore', state.highscore, ''));
  } else if (state.highscore > 0) {
    endScore.append(makePill('Highscore', state.highscore, ''));
  }
  endScore.style.display = endScore.childElementCount ? 'flex' : 'none';
}

// Zeigt/versteckt Start- bzw. Endbildschirm-Bereich je nach Spielphase, und setzt die jeweiligen
// Status-Texte/Button-Beschriftungen. Wird ueberall dort aufgerufen, wo sich die Phase aendern
// kann (siehe startLoop/stopLoop/step/resetGame unten).
function updateButtons() {
  const phase = state.phase;
  // Score-Zeile waehrend Verpuppung, Schmetterling UND Game Over weich ausblenden (Punkt 6, in
  // Punkt 10 um 'over' erweitert): der Score steht danach im Panel (Pillen), die Zeile ueber dem
  // Feld wiederholte ihn nur. opacity statt display, daher kein Layout-Sprung. Wieder sichtbar,
  // sobald die Phase verlassen wird (Retry).
  scoreEl.classList.toggle('score-hidden', phase === 'cocoon' || phase === 'won' || phase === 'over');
  // Vor dem Umschalten der phase-won-Klasse pruefen, ob wir GERADE ERST in 'won' wechseln -
  // updateButtons() wird pro 'won'-Aufenthalt mehrfach aufgerufen (u. a. einmal aus stopLoop()
  // heraus und danach nochmal am Ende von step()), die Verzoegerungs-Sequenz (siehe unten) darf
  // aber nur EINMAL starten, sonst wuerde jeder weitere Aufruf den Timer neu aufsetzen.
  const enteringWon = phase === 'won' && !centerOverlay.classList.contains('phase-won');
  const showCenter = phase === 'ready' || phase === 'over' || phase === 'won' || phase === 'paused';
  centerOverlay.style.display = showCenter ? 'flex' : 'none';
  // 'won'-spezifisches CSS (Panel unten statt mittig, groesserer Titel - siehe Schmetterling-CSS
  // weiter oben) nur in genau diesem Zustand aktiv, 'ready'/'over' bleiben unveraendert mittig.
  centerOverlay.classList.toggle('phase-won', phase === 'won');
  if (enteringWon) {
    // Frischer Eintritt in 'won': Panel zunaechst unsichtbar (won-pending), Timer fuer das
    // automatische Einblenden nach 1s starten. "won-fade-armed" wird ERST NACH einem erzwungenen
    // Reflow gesetzt (siehe Kommentar bei der CSS-Regel oben) - so verschwindet das Panel sofort,
    // ohne selbst wegzufaden, und nur das spaetere Einblenden laeuft ueber die 0.35s-Transition.
    centerOverlay.classList.remove('won-fade-armed');
    centerOverlay.classList.add('won-pending');
    void centerOverlay.offsetWidth; // erzwingt Reflow: "opacity:0 ohne Transition" wird fixiert
    centerOverlay.classList.add('won-fade-armed');
    if (wonRevealTimer) clearTimeout(wonRevealTimer);
    wonRevealTimer = setTimeout(revealWonPanel, WON_REVEAL_DELAY_MS);
  } else if (phase !== 'won') {
    // Phase verlassen (z. B. Retry -> zurueck zu 'ready'): Timer/Zustand sauber zuruecksetzen,
    // damit beim naechsten Sieg wieder bei 0 gestartet wird und kein verspaeteter Timer aus der
    // vorherigen Runde etwas auf dem neuen Bildschirm ausloest.
    if (wonRevealTimer) { clearTimeout(wonRevealTimer); wonRevealTimer = null; }
    centerOverlay.classList.remove('won-pending', 'won-fade-armed');
  }
  // 'ready'-spezifisches CSS (breiteres, horizontales Panel - siehe #centerOverlay.phase-ready
  // .panel weiter oben, bestaetigte Stilprobe stilprobe-startbildschirm-horizontal.html) nur auf
  // dem Startbildschirm aktiv - 'over'/'won' behalten das bisherige schmale Panel.
  centerOverlay.classList.toggle('phase-ready', phase === 'ready');
  if (phase !== 'over' && phase !== 'won') centerOverlay.removeAttribute('data-variant');
  readyControls.style.display = phase === 'ready' ? 'flex' : 'none';
  endControls.style.display = (phase === 'over' || phase === 'won') ? 'flex' : 'none';
  pauseControls.style.display = phase === 'paused' ? 'flex' : 'none';

  if (phase === 'ready') {
    overlayStatus.textContent = 'Ready?';
    setEndLine(bestLine, state.highscore > 0 ? 'Highscore: ' + state.highscore : '');
    updateModeButtons();
  } else if (phase === 'over' || phase === 'won') {
    restartBtn.textContent = 'Retry';
    applyEndScreenText();
  }

  // Der Button unter dem Feld erscheint nur waehrend des Spiels; in der Pause liegt "Eat again!"
  // im Panel (resumeBtn, siehe HTML).
  pauseBtn.style.display = phase === 'running' ? 'inline-block' : 'none';
}

function step() {
  update();
  draw();
  updateScore();
  updateInfo();
  updateButtons();
}

// Fuehrt genau einen Tick aus und plant danach - falls der Loop noch laeuft - den naechsten,
// mit einer Wartezeit, die eine etwaige Verspaetung des VORHERIGEN Ticks schon ausgleicht.
function runTick() {
  expectedTickTime += state.tickMs;
  step();
  if (loopActive) scheduleNextTick();
}

function scheduleNextTick() {
  const drift = performance.now() - expectedTickTime;   // > 0, wenn wir bereits im Verzug sind
  const delay = Math.max(0, state.tickMs - drift);
  timeoutId = setTimeout(runTick, delay);
}

function startLoop() {
  if (loopActive) return;
  loopActive = true;
  expectedTickTime = performance.now();
  scheduleNextTick();
  updateInfo();
  updateButtons();
}

function stopLoop() {
  if (!loopActive) return;
  loopActive = false;
  clearTimeout(timeoutId);
  timeoutId = null;
  updateInfo();
  updateButtons();
}

function togglePause() {
  if (state.phase === 'running') {
    state.phase = 'paused';
    stopLoop();
    draw();
  } else if (state.phase === 'paused') {
    state.phase = 'running';
    startLoop();
  }
}

// ---------------------------------------------------------------
// 7) Ereignisse (Tastatur + Swipe + Buttons - alle rufen dieselben Funktionen auf)
// ---------------------------------------------------------------
// Ist das Ziel des Tastendrucks ein Feld, in dem man normalerweise tippt (Zahl-/Textfeld,
// Textbereich, Auswahlliste, editierbarer Bereich)? Checkbox/Radio/Button zaehlen bewusst NICHT
// dazu - dort sollen Pfeiltasten weiter das Spiel steuern.
function isTypingTarget(el) {
  if (!el || el.nodeType !== 1) return false;
  const tag = el.tagName;
  if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
  if (tag === 'INPUT') return !/^(checkbox|radio|button|submit|reset|image|file|color|range)$/i.test(el.type);
  return el.isContentEditable;
}

document.addEventListener('keydown', function (e) {
  // Punkt 10: In einem Eingabefeld gehoert die Tastatur dem Feld (Pfeiltasten: Wert aendern bzw.
  // Cursor bewegen, Buchstaben/Leertaste: tippen) - kein preventDefault, keine Spielsteuerung.
  // Einzige Ausnahme: Enter im Zielwert-Feld startet das Spiel, mit derselben Pruefung wie der
  // Start-Button (ungueltiger Zielwert -> Fehlertext, kein Start). Nach dem Start verliert das Feld
  // den Fokus, damit die folgenden Pfeiltasten das Spiel steuern.
  if (isTypingTarget(e.target)) {
    if ((e.code === 'Enter' || e.code === 'NumpadEnter') && e.target === goalInput
        && !e.repeat && state.phase === 'ready') {
      e.preventDefault();
      handleDirectionInput(state.dir);
      if (state.phase === 'running') goalInput.blur();
    }
    return;
  }

  const dir = DIR_KEYS[e.code];
  const isSpace = e.code === 'Space';
  if (!dir && !isSpace) return;

  // Leertaste auf einem fokussierten Button/Checkbox: den Browser die Bedienung erledigen lassen
  // (Button klicken bzw. Haken setzen), sonst wuerde sie doppelt wirken (Spiel + Element).
  if (isSpace && e.target.closest && e.target.closest('button, input, select, a')) return;

  e.preventDefault();     // verhindert Scrollen der Seite, auch bei Pfeiltasten
  if (e.repeat) return;   // gehaltene Taste soll nicht mehrfach auslösen

  if (dir) {
    handleDirectionInput(dir);
  } else if (state.phase === 'over' || state.phase === 'won') {
    resetGame();
  } else if (state.phase === 'cocoon') {
    finishCocoon();   // Leertaste ueberspringt die Verpuppungs-Sequenz (wie Klick/Tipp aufs Spielfeld)
  } else if (state.phase !== 'ready') {
    togglePause();
  }
});

// Modus-Auswahl: nur auf dem Startbildschirm relevant (waehrend eines laufenden Spiels sind die
// Buttons ohnehin versteckt, siehe updateButtons()).
modeEndlessBtn.addEventListener('click', function () { setMode('endless'); });
modeGoalBtn.addEventListener('click', function () { setMode('goal'); });

// Start-, Neustart- und Pause-Button: dieselben Funktionen wie Tastatur/Swipe, nur ein anderer
// Ausloeser. Die auf dem Startbildschirm gewaehlten Einstellungen (Modus, Zielwert, Boesewicht)
// werden erst beim Start in den state uebernommen (applyStartSettings(), aufgerufen aus
// handleDirectionInput()) - bis dahin kann noch alles geaendert werden, ohne ein laufendes Spiel
// zu beeinflussen.
startBtn.addEventListener('click', function () {
  if (state.phase !== 'ready') return;
  // Einstellungen uebernimmt handleDirectionInput() selbst (applyStartSettings), damit Pfeiltaste
  // und Wischen sie genauso beachten wie dieser Button.
  handleDirectionInput(state.dir);
});
restartBtn.addEventListener('click', function () {
  if (state.phase === 'over' || state.phase === 'won') resetGame();
});
pauseBtn.addEventListener('click', function () {
  togglePause();
});
resumeBtn.addEventListener('click', function () {
  if (state.phase === 'paused') togglePause();
});

// Verstecktes Zuruecksetzen des Highscores (Punkt 10): Titel ca. 2 s gedrueckt halten, nur auf dem
// Startbildschirm. Bewusst ohne sichtbaren Hinweis, damit es nicht versehentlich passiert; eine
// Sicherheitsabfrage (confirm) verhindert ein unbeabsichtigtes Loeschen. Abbruch, wenn der Finger/
// die Maus vorher losgelassen wird, den Titel verlaesst oder sich merklich bewegt.
const RESET_HOLD_MS = 2000;
const RESET_HOLD_TOLERANCE_PX = 12;
const gameTitleEl = document.getElementById('gameTitle');
let resetHoldTimer = null;
let resetHoldStart = null;

function cancelResetHold() {
  if (resetHoldTimer) { clearTimeout(resetHoldTimer); resetHoldTimer = null; }
  resetHoldStart = null;
}

function resetHighscore() {
  try {
    window.localStorage.removeItem(HIGHSCORE_KEY);
  } catch (e) {
    state.storageOk = false;   // Speicher nicht nutzbar: Wert im Speicher wird trotzdem zurueckgesetzt
  }
  state.highscore = 0;
  state.newRecord = false;
  updateScore();
  updateInfo();
  updateButtons();
}

function askResetHighscore() {
  resetHoldTimer = null;
  resetHoldStart = null;
  // Nichts zu tun ohne Highscore; und nur auf dem Startbildschirm (Phase koennte sich geaendert haben).
  if (state.phase !== 'ready' || state.highscore <= 0) return;
  if (window.confirm('Reset your highscore (' + state.highscore + ')?\nThis cannot be undone.')) {
    resetHighscore();
  }
}

gameTitleEl.addEventListener('pointerdown', function (e) {
  if (state.phase !== 'ready') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  cancelResetHold();
  resetHoldStart = { x: e.clientX, y: e.clientY };
  resetHoldTimer = setTimeout(askResetHighscore, RESET_HOLD_MS);
});
gameTitleEl.addEventListener('pointermove', function (e) {
  if (!resetHoldStart) return;
  if (Math.hypot(e.clientX - resetHoldStart.x, e.clientY - resetHoldStart.y) > RESET_HOLD_TOLERANCE_PX) cancelResetHold();
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (type) {
  gameTitleEl.addEventListener(type, cancelResetHold);
});
// Langes Druecken oeffnet auf manchen Geraeten (v. a. Android) das Kontextmenue - hier unerwuenscht.
gameTitleEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });

// Klick/Tipp auf das Spielfeld waehrend der Schmetterling-Wartezeit (won-pending) blendet das Panel
// sofort ein, statt die volle Sekunde abzuwarten (von Marco bestaetigt, 23.09.2026). pointerdown
// statt click: canvas.addEventListener('touchstart', ..., { passive: false }) weiter unten ruft
// e.preventDefault() auf und wuerde damit auf Touch-Geraeten das synthetische 'click'-Ereignis
// unterdruecken - pointerdown feuert zuverlaessig sowohl fuer Maus- als auch fuer Touch-Eingaben.
// Listener sitzt auf boardWrap statt nur auf dem Panel, weil #centerOverlay.won-pending .panel
// bewusst pointer-events:none hat (siehe CSS oben) und Klicks in diesem Zustand daher ohnehin zum
// darunterliegenden Spielfeld durchgereicht werden.
boardWrap.addEventListener('pointerdown', function () {
  if (state.phase === 'cocoon') {
    // Sequenz per Klick/Tipp ueberspringen (Marcos Wunsch): springt direkt zum Schmetterling-Uebergang
    finishCocoon();
  } else if (state.phase === 'won' && centerOverlay.classList.contains('won-pending')) {
    revealWonPanel();
  }
});

// Swipe-Steuerung: Die Richtung wird schon WAEHREND der Bewegung erkannt (touchmove), nicht erst
// beim Loslassen (touchend). Bei hohem Tempo bleibt sonst kaum Zeit zwischen Tick und Reaktion.
// Nach jeder erkannten Richtung wird der Referenzpunkt zurueckgesetzt, damit sich innerhalb
// derselben Beruehrung (ohne loszulassen) noch weitere Richtungswechsel erkennen lassen.
let touchRef = null;          // wird nach jedem erkannten Wisch aktualisiert
let sawSwipeThisTouch = false;

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  touchRef = { x: t.clientX, y: t.clientY };
  sawSwipeThisTouch = false;
}, { passive: false });

canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();   // verhindert Scrollen/Ziehen der Seite waehrend des Wischens
  if (!touchRef || e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - touchRef.x;
  const dy = t.clientY - touchRef.y;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  const threshold = sawSwipeThisTouch ? SWIPE_CONTINUE_PX : SWIPE_MIN_PX;
  if (Math.max(absDx, absDy) < threshold) return;   // noch keine ausreichende Bewegung

  const dir = absDx > absDy
    ? { x: dx > 0 ? 1 : -1, y: 0 }
    : { x: 0, y: dy > 0 ? 1 : -1 };
  handleDirectionInput(dir);
  sawSwipeThisTouch = true;
  touchRef = { x: t.clientX, y: t.clientY };   // ab hier neu messen
}, { passive: false });

canvas.addEventListener('touchend', function (e) {
  e.preventDefault();
  touchRef = null;
  sawSwipeThisTouch = false;
}, { passive: false });

// Tab im Hintergrund oder Bildschirm gesperrt: anhalten, nicht automatisch weiterlaufen.
// Die Phase wird jetzt mitgesetzt (nicht nur der Timer gestoppt), sonst würde eine Eingabe
// nach dem Zurückkommen sofort weiterlaufen, ohne dass "Pause" sichtbar war.
document.addEventListener('visibilitychange', function () {
  if (document.hidden && state.phase === 'running') {
    state.phase = 'paused';
    stopLoop();
  }
  // Falls der Browser die Seite im Hintergrund beendet (v. a. auf Handys), geht ein gerade
  // laufender Rekord nicht verloren. state.highscore bleibt dabei unveraendert, damit "New
  // highscore!" am Rundenende weiterhin korrekt gegen den Wert VOR der Runde verglichen wird.
  if (document.hidden && state.score > state.highscore) {
    persistHighscoreMax(state.score);
  }
});

window.addEventListener('resize', function () {
  setupCanvas();   // Pixeldichte kann sich beim Zoomen ändern
  draw();
});

// ---------------------------------------------------------------
// 8) Start
// ---------------------------------------------------------------
function resetGame() {
  stopLoop();
  cancelCocoon();   // laufende Verpuppungs-Animation (rAF) abbrechen, falls z. B. per Tastatur neu gestartet wird
  state.snake = [
    { x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }, { x: 5, y: 10 }
  ];
  state.dir = { x: 1, y: 0 };
  state.nextDir = { x: 1, y: 0 };
  state.tick = 0;
  state.score = 0;
  state.phase = 'ready';
  state.food = null;
  state.tickMs = START_TICK_MS;
  state.villain = null;
  state.villainCooldown = 0;
  state.overReason = null;
  state.newRecord = false;
  // state.highscore bewusst NICHT zurueckgesetzt - bleibt ueber Runden hinweg erhalten.
  // state.mode/goalTarget/villainEnabled bewusst NICHT zurueckgesetzt: das sind die auf dem
  // Startbildschirm gewaehlten Einstellungen, die beim naechsten Klick auf Start ohnehin frisch
  // aus den Bedienelementen (goalInput/villainCheckbox) uebernommen werden (siehe oben).
  spawnFood();
  draw();
  updateScore();
  updateInfo();
  updateButtons();
}

// init() wartet jetzt zuerst auf preloadFoodImages() (die drei Futter-SVGs werden aus data:-URIs
// geladen), bevor resetGame() zum ersten Mal zeichnet - sonst waere beim allerersten Frame
// moeglicherweise noch kein Bild bereit, falls zufaellig Pizza/Eis/Bier als erstes Futter gewaehlt
// wird. Bei data:-URIs (keine Netzwerk-Anfrage) ist das in der Praxis nahezu sofort fertig, ein
// kurzer Ladezustand ist aber nicht sichtbar dargestellt (kein Spinner) - bewusste, unkritische
// Vereinfachung, da kein Warten spuerbar sein sollte.
async function init() {
  setupCanvas();
  loadHighscore();
  try {
    await preloadFoodImages();
  } catch (e) {
    infoEl.textContent = 'Fehler beim Laden der Futter-Icons: ' + e.message;
  }
  resetGame();
}

init();
</script>
</body>
</html>
