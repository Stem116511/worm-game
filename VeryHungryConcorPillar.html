<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VeryHungryConcorPillar</title>
<style>
  :root {
    --page-bg: #f6f1e7;
    --text: #2f3d2c;
    --board-border: #8fae6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page-bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 { margin: 0; font-size: 1.4rem; }
  #score { margin: 0; font-size: 1rem; font-weight: 600; }
  #board {
    display: block;
    width: min(94vw, 68vh, 560px);
    height: auto;
    aspect-ratio: 1 / 1;
    border: 4px solid var(--board-border);
    border-radius: 12px;
    touch-action: none;
  }
  #hint { margin: 0; font-size: 0.85rem; opacity: 0.75; text-align: center; }
  /* Entwicklerzeile: vor dem Anlass komplett entfernen */
  #info { margin: 0; font: 12px ui-monospace, Consolas, monospace; opacity: 0.55; text-align: center; }
</style>
</head>
<body>
  <h1>Very Hungry ConcorPillar</h1>
  <p id="score"></p>
  <canvas id="board"></canvas>
  <p id="hint">Pfeiltasten/WASD oder Wischen steuern · Leertaste: Pause / Weiter / Neustart · Tippen nach Game Over: Neustart</p>
  <p id="info"></p>

<script>
'use strict';

// ---------------------------------------------------------------
// 1) Konstanten
// ---------------------------------------------------------------
const GRID = 20;               // 20 x 20 Felder
const CELL = 24;               // logische Pixel pro Feld
const BOARD_PX = GRID * CELL;  // 480 x 480 logische Pixel

// Tempo: Startwert, Untergrenze und Beschleunigung pro Futter an einer Stelle.
// Alle drei Werte sind Richtwerte aus dem Konzept und NICHT mit Testpersonen geprueft -
// siehe Testliste. Feinjustierung folgt, sobald ein paar Ungeuebte das Spiel probiert haben.
const START_TICK_MS = 250;     // Dauer eines Schritts beim Spielstart (langsamer als die 150 ms der Woche-1-Demo)
const MIN_TICK_MS = 90;        // schnellste erlaubte Geschwindigkeit (Untergrenze, wird nie unterschritten)
const TICK_MS_STEP = 6;        // um so viel wird ein Schritt pro gefressenem Futter kuerzer

// Mindest-Wischstrecke in echten Pixeln. Die ERSTE Bewegung einer Beruehrung braucht die volle
// Strecke (SWIPE_MIN_PX) - sonst wuerde ein blosses Tippen als Wisch zaehlen. JEDE WEITERE
// Richtungsaenderung, waehrend der Finger noch aufliegt, braucht nur noch SWIPE_CONTINUE_PX -
// das Tipp-Risiko besteht dann nicht mehr, weil schon eine echte Bewegung im Gange ist. Das macht
// schnelle Kehren (z. B. hoch -> links -> runter in einem Zug, ohne loszulassen) deutlich leichter.
const SWIPE_MIN_PX = 18;
const SWIPE_CONTINUE_PX = 9;

// Eigene Farbpalette (Raupen-Thema, helles Blattgrün)
const COLORS = {
  boardA: '#e4edcf',
  boardB: '#d9e5bd',
  bodyA: '#6dbf5a',
  bodyB: '#58ab48',
  head: '#3f8f3a',
  eyeWhite: '#ffffff',
  eyePupil: '#1f2a1c',
  morphoBlue: '#1f5fe0'        // reserviert für den Schmetterling am Ende des Ziel-Modus
};

// Finale Futter-Liste aus dem Konzept. Farben sind Platzhalter, echte Icons folgen in Woche 2.
// Spielmechanisch sind alle Sorten gleichwertig (siehe Konzept) - reine visuelle Abwechslung.
const FOOD = [
  { name: 'Lasagne',      color: '#c8562a' },
  { name: 'Ramen',        color: '#e0a53a' },
  { name: 'Pizza',        color: '#d9382e' },
  { name: 'Banane',       color: '#f4d03f' },
  { name: 'Gummibärchen', color: '#8e44ad' },
  { name: 'Erdbeer-Eis',  color: '#f7a8c0' },
  { name: 'Kuchen',       color: '#8b5a2b' },
  { name: 'Aperol',       color: '#ff7f11' },
  { name: 'Bier',         color: '#f0b323' }
];

// Tastenzuordnung: Pfeiltasten und WASD, unabhängig vom Tastaturlayout (e.code statt e.key)
const DIR_KEYS = {
  ArrowUp: { x: 0, y: -1 },  KeyW: { x: 0, y: -1 },
  ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }
};

// ---------------------------------------------------------------
// 2) Zustand (alles, was sich im Spiel ändert, liegt hier)
// ---------------------------------------------------------------
const state = {
  snake: [],                   // Feld-Koordinaten, Index 0 = Kopf
  dir: { x: 1, y: 0 },         // Richtung, die im aktuellen Tick tatsächlich angewendet wird
  nextDir: { x: 1, y: 0 },     // durch Tastendruck/Wisch vorgemerkte Richtung, wird zu Beginn des nächsten Tick übernommen
  tick: 0,                     // Anzahl bisheriger Spielschritte
  score: 0,                    // Anzahl gefressenes Futter
  phase: 'ready',              // 'ready' | 'running' | 'paused' | 'over'
  food: null,                  // { x, y, type } - type ist der Index in FOOD
  tickMs: START_TICK_MS        // aktuelle Geschwindigkeit (sinkt mit dem Score bis MIN_TICK_MS)
};

// ---------------------------------------------------------------
// 3) Canvas-Setup (scharfe Darstellung auf Handys mit hoher Pixeldichte)
// ---------------------------------------------------------------
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const infoEl = document.getElementById('info');
const scoreEl = document.getElementById('score');

function setupCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = BOARD_PX * dpr;   // setzt die Zeichenfläche zurück ...
  canvas.height = BOARD_PX * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);  // ... daher Skalierung danach setzen
}

// ---------------------------------------------------------------
// 4) Spiellogik (pro Tick genau ein Schritt)
// ---------------------------------------------------------------

function isOpposite(a, b) {
  return a.x === -b.x && a.y === -b.y;
}

// Gemeinsame Richtungseingabe fuer Tastatur UND Swipe (Abschnitt 7 ruft beide Wege hierher).
// Prüft die 180-Grad-Sperre immer gegen die tatsächlich aktive Richtung (state.dir), nie gegen
// eine bereits vorgemerkte state.nextDir - so kann ein zweiter, schneller Steuerbefehl vor dem
// nächsten Tick keine Wende "durchschmuggeln", die in der Summe 180 Grad ergibt.
function handleDirectionInput(dir) {
  if (state.phase === 'over' || state.phase === 'paused') return;
  if (isOpposite(dir, state.dir)) return;
  state.nextDir = dir;
  if (state.phase === 'ready') {
    state.phase = 'running';
    startLoop();
  }
}

function randomFreeCell() {
  let cell;
  do {
    cell = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (state.snake.some(function (s) { return s.x === cell.x && s.y === cell.y; }));
  return cell;
}

function spawnFood() {
  const cell = randomFreeCell();
  state.food = { x: cell.x, y: cell.y, type: Math.floor(Math.random() * FOOD.length) };
}

function gameOver() {
  state.phase = 'over';
  stopLoop();
}

// Nach jedem gefressenen Futter neu berechnen. Aendert sich die Geschwindigkeit tatsaechlich
// und laeuft der Loop gerade, wird er neu gestartet (stopLoop() dann startLoop()) - nie
// laeuft ein zweiter Timer parallel zum ersten.
function applyGrowthSpeedup() {
  const newTickMs = Math.max(MIN_TICK_MS, START_TICK_MS - state.score * TICK_MS_STEP);
  if (newTickMs === state.tickMs) return;
  state.tickMs = newTickMs;
  if (timerId !== null) {
    stopLoop();
    startLoop();
  }
}

function update() {
  state.dir = state.nextDir;   // vorgemerkte Richtung genau einmal pro Tick übernehmen
  const head = state.snake[0];
  const next = { x: head.x + state.dir.x, y: head.y + state.dir.y };

  if (next.x < 0 || next.x >= GRID || next.y < 0 || next.y >= GRID) {
    gameOver();
    return;
  }

  const willGrow = !!state.food && next.x === state.food.x && next.y === state.food.y;

  // Kollisionsregel Schwanzende: Wächst die Raupe in diesem Schritt nicht, rückt der Schwanz
  // nach - das aktuell letzte Feld wird frei und ein Kopf dorthin ist erlaubt. Deshalb wird das
  // letzte Segment nur dann mitgeprüft, wenn die Raupe wächst (Schwanz bleibt liegen).
  const bodyToCheck = willGrow ? state.snake : state.snake.slice(0, -1);
  if (bodyToCheck.some(function (seg) { return seg.x === next.x && seg.y === next.y; })) {
    gameOver();
    return;
  }

  state.snake.unshift(next);
  if (willGrow) {
    state.score++;
    spawnFood();
    applyGrowthSpeedup();
  } else {
    state.snake.pop();
  }
  state.tick++;
}

// ---------------------------------------------------------------
// 5) Zeichnen
// ---------------------------------------------------------------

function drawBoard() {
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? COLORS.boardA : COLORS.boardB;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }
}

function drawFood() {
  if (!state.food) return;
  const food = FOOD[state.food.type];
  const cx = state.food.x * CELL + CELL / 2;
  const cy = state.food.y * CELL + CELL / 2;
  ctx.fillStyle = food.color;
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * 0.34, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';   // kleiner Glanzpunkt
  ctx.beginPath();
  ctx.arc(cx - CELL * 0.11, cy - CELL * 0.11, CELL * 0.08, 0, Math.PI * 2);
  ctx.fill();
}

function drawSnake() {
  // Vom Schwanz zum Kopf zeichnen, damit der Kopf zuoberst liegt
  for (let i = state.snake.length - 1; i >= 0; i--) {
    const s = state.snake[i];
    const cx = s.x * CELL + CELL / 2;
    const cy = s.y * CELL + CELL / 2;
    ctx.fillStyle = i === 0 ? COLORS.head : (i % 2 === 0 ? COLORS.bodyA : COLORS.bodyB);
    ctx.beginPath();
    ctx.arc(cx, cy, i === 0 ? CELL * 0.48 : CELL * 0.44, 0, Math.PI * 2);
    ctx.fill();
  }

  // Augen am Kopf, in Bewegungsrichtung versetzt
  const h = state.snake[0];
  const hx = h.x * CELL + CELL / 2;
  const hy = h.y * CELL + CELL / 2;
  const d = state.dir;
  const px = -d.y, py = d.x;   // Senkrechte zur Blickrichtung
  for (const side of [-1, 1]) {
    const ex = hx + d.x * CELL * 0.16 + px * side * CELL * 0.2;
    const ey = hy + d.y * CELL * 0.16 + py * side * CELL * 0.2;
    ctx.fillStyle = COLORS.eyeWhite;
    ctx.beginPath();
    ctx.arc(ex, ey, CELL * 0.13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.eyePupil;
    ctx.beginPath();
    ctx.arc(ex + d.x * CELL * 0.04, ey + d.y * CELL * 0.04, CELL * 0.065, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCenteredText(text) {
  ctx.save();
  ctx.fillStyle = 'rgba(47, 61, 44, 0.75)';
  ctx.fillRect(0, BOARD_PX / 2 - 26, BOARD_PX, 52);
  ctx.fillStyle = '#f6f1e7';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, BOARD_PX / 2, BOARD_PX / 2);
  ctx.restore();
}

// Sichtbarer Hinweis auf dem Spielfeld selbst (zusätzlich zur Entwicklerzeile), je nach Spielphase.
// Bleibt bewusst schlicht - der Stil wird erst in Woche 2 abgeglichen (siehe Konzept).
function drawOverlay() {
  if (state.phase === 'ready') {
    drawCenteredText('Richtung wählen zum Start');
  } else if (state.phase === 'paused') {
    drawCenteredText('Pause');
  } else if (state.phase === 'over') {
    drawCenteredText('Game Over · ' + state.score + ' Punkte');
  }
}

function draw() {
  drawBoard();
  drawFood();
  drawSnake();
  drawOverlay();
}

// ---------------------------------------------------------------
// 6) Game-Loop (setInterval mit fixer Rate, Rate = state.tickMs)
// ---------------------------------------------------------------
let timerId = null;

function updateScore() {
  scoreEl.textContent = 'Punkte: ' + state.score;
}

function updateInfo() {
  infoEl.textContent =
    'Phase: ' + state.phase + ' · Tick ' + state.tick + ' · ' + state.tickMs + ' ms/Schritt · Punkte: ' + state.score;
}

function step() {
  update();
  draw();
  updateScore();
  updateInfo();
}

function startLoop() {
  if (timerId !== null) return;
  timerId = setInterval(step, state.tickMs);
  updateInfo();
}

function stopLoop() {
  if (timerId === null) return;
  clearInterval(timerId);
  timerId = null;
  updateInfo();
}

function togglePause() {
  if (state.phase === 'running') {
    state.phase = 'paused';
    stopLoop();
    draw();
  } else if (state.phase === 'paused') {
    state.phase = 'running';
    startLoop();
  }
}

// ---------------------------------------------------------------
// 7) Ereignisse (Tastatur + Swipe - beide rufen dieselbe handleDirectionInput())
// ---------------------------------------------------------------
document.addEventListener('keydown', function (e) {
  const dir = DIR_KEYS[e.code];
  const isSpace = e.code === 'Space';
  if (!dir && !isSpace) return;

  e.preventDefault();     // verhindert Scrollen der Seite, auch bei Pfeiltasten
  if (e.repeat) return;   // gehaltene Taste soll nicht mehrfach auslösen

  if (dir) {
    handleDirectionInput(dir);
  } else if (state.phase === 'over') {
    resetGame();
  } else if (state.phase !== 'ready') {
    togglePause();
  }
});

// Swipe-Steuerung: Die Richtung wird schon WAEHREND der Bewegung erkannt (touchmove), nicht erst
// beim Loslassen (touchend). Bei hohem Tempo bleibt sonst kaum Zeit zwischen Tick und Reaktion.
// Nach jeder erkannten Richtung wird der Referenzpunkt zurueckgesetzt, damit sich innerhalb
// derselben Beruehrung (ohne loszulassen) noch weitere Richtungswechsel erkennen lassen.
// Ein kurzes Tippen (Bewegung bleibt unter SWIPE_MIN_PX) zaehlt nicht als Wisch - nach Game Over
// startet es stattdessen neu (vorgezogener Behelf, bis es in Paket 3 einen richtigen Neustart-Button gibt).
let touchStartPoint = null;   // fix ab Beruehrungsbeginn, nur fuer die Tipp-Erkennung am Ende
let touchRef = null;          // wird nach jedem erkannten Wisch aktualisiert
let sawSwipeThisTouch = false;

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  touchStartPoint = { x: t.clientX, y: t.clientY };
  touchRef = { x: t.clientX, y: t.clientY };
  sawSwipeThisTouch = false;
}, { passive: false });

canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();   // verhindert Scrollen/Ziehen der Seite waehrend des Wischens
  if (!touchRef || e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - touchRef.x;
  const dy = t.clientY - touchRef.y;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  const threshold = sawSwipeThisTouch ? SWIPE_CONTINUE_PX : SWIPE_MIN_PX;
  if (Math.max(absDx, absDy) < threshold) return;   // noch keine ausreichende Bewegung

  const dir = absDx > absDy
    ? { x: dx > 0 ? 1 : -1, y: 0 }
    : { x: 0, y: dy > 0 ? 1 : -1 };
  handleDirectionInput(dir);
  sawSwipeThisTouch = true;
  touchRef = { x: t.clientX, y: t.clientY };   // ab hier neu messen
}, { passive: false });

canvas.addEventListener('touchend', function (e) {
  e.preventDefault();
  if (!sawSwipeThisTouch && touchStartPoint) {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartPoint.x;
    const dy = t.clientY - touchStartPoint.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN_PX && state.phase === 'over') {
      resetGame();
    }
  }
  touchStartPoint = null;
  touchRef = null;
  sawSwipeThisTouch = false;
}, { passive: false });

// Tab im Hintergrund oder Bildschirm gesperrt: anhalten, nicht automatisch weiterlaufen.
// Die Phase wird jetzt mitgesetzt (nicht nur der Timer gestoppt), sonst würde eine Eingabe
// nach dem Zurückkommen sofort weiterlaufen, ohne dass "Pause" sichtbar war.
document.addEventListener('visibilitychange', function () {
  if (document.hidden && state.phase === 'running') {
    state.phase = 'paused';
    stopLoop();
  }
});

window.addEventListener('resize', function () {
  setupCanvas();   // Pixeldichte kann sich beim Zoomen ändern
  draw();
});

// ---------------------------------------------------------------
// 8) Start
// ---------------------------------------------------------------
function resetGame() {
  stopLoop();
  state.snake = [
    { x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }, { x: 5, y: 10 }
  ];
  state.dir = { x: 1, y: 0 };
  state.nextDir = { x: 1, y: 0 };
  state.tick = 0;
  state.score = 0;
  state.phase = 'ready';
  state.food = null;
  state.tickMs = START_TICK_MS;
  spawnFood();
  draw();
  updateScore();
  updateInfo();
}

function init() {
  setupCanvas();
  resetGame();
}

init();
</script>
</body>
</html>
