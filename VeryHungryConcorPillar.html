<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Very Hungry ConcorPillar</title>
<style>
  :root {
    --page-bg: #f6f1e7;
    --text: #2f3d2c;
    --board-border: #84ba5f;
    /* Zwei zusaetzliche Konturringe ganz aussen um den Rand (Wunsch: Rand soll gut sichtbar sein) -
       gleiche Breite wie die bestehende gruene Kontur (4px). Violett bewusst identisch mit dem
       Boesewicht-Koerper (COLORS.villain.body.base = #7c3fb0 im Script weiter unten) gewaehlt, statt
       eine neue Farbe zu erfinden - sag Bescheid, falls dir ein anderer Ton lieber waere.       */
    --board-border-outer1: #ffffff;
    --board-border-outer2: #7c3fb0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page-bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 { margin: 0; font-size: 1.7rem; font-weight: 800; -webkit-touch-callout: none; }
  /* Live-Score (Punkt 6, 23.09.2026): tabular-nums haelt die Ziffernbreite konstant (kein Wackeln
     der zentrierten Zeile bei jedem Punkt); die Zeile blendet waehrend Verpuppung/Schmetterling
     weich aus (opacity statt display, damit das Layout nicht springt - siehe updateButtons()). */
  #score { margin: 0; font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; transition: opacity 0.35s ease; }
  #score.score-hidden { opacity: 0; }

  #boardWrap {
    position: relative;
    width: min(94vw, 68vh, 560px);
    aspect-ratio: 1 / 1;
    /* Reserviert echten Platz im Layout fuer die beiden zusaetzlichen Konturringe (siehe #board
       box-shadow) - sonst wuerden sie ueber H1/Buttons ueberlappen statt sauber Abstand zu halten. */
    margin: 8px;
  }
  #board {
    display: block;
    width: 100%;
    height: 100%;
    border: 4px solid var(--board-border);
    border-radius: 12px;
    touch-action: none;
    /* Zwei weitere Ringe AUSSERHALB der bestehenden gruenen Kontur, per box-shadow (kein
       zusaetzliches HTML-Element noetig): je 4px breit, wie gewuenscht gleich breit wie die gruene
       Kontur - zuerst weiss (direkt aussen an gruen), danach violett ganz aussen. Bei mehreren
       box-shadow-Werten liegt der ZUERST genannte oben, deshalb weiss vor violett listen, sonst
       wuerde violett den weissen Ring komplett verdecken. */
    box-shadow: 0 0 0 4px var(--board-border-outer1), 0 0 0 8px var(--board-border-outer2);
  }

  /* Buttons: bewusst schlicht, wie die uebrigen Overlays - der Stil kommt erst im Woche-2-Abgleich */
  .game-btn {
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    padding: 10px 24px;
    border: none;
    border-radius: 10px;
    background: var(--board-border);
    color: #1f2a1c;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .game-btn:active { filter: brightness(0.9); }
  .mode-btn { padding: 8px 16px; font-size: 1.17rem; flex: 1 1 auto; min-width: 0; }
  /* #startBtn statt .game-btn: ID-Selektor ueberschreibt sicher nur den Start-Button (Faktor 1.3,
     siehe Stilprobe) - #pauseBtn (teilt sich ebenfalls .game-btn, gehoert aber zum laufenden Spiel,
     nicht zum Endbildschirm) bleibt dadurch beim bisherigen 1rem unveraendert. #restartBtn bekommt
     ebenfalls eine eigene ID-Regel, aber erst weiter unten beim Endbildschirm-Block (Faktor 1.3,
     bestaetigte Stilprobe stilprobe-endbildschirme-vergroessert.html, 23.09.2026). */
  #startBtn { font-size: 1.3rem; width: 100%; }

  /* Zentriertes Overlay auf dem Canvas fuer Startbildschirm (ready) und Endbildschirm (over/won).
     pointer-events:none auf dem Container, damit er ausserhalb des Panels nichts blockiert -
     das Panel selbst holt sich pointer-events per Regel unten zurueck. */
  #centerOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #centerOverlay .panel {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: rgba(47, 61, 44, 0.85);
    color: #f6f1e7;
    padding: 16px 22px;
    border-radius: 14px;
    max-width: min(86vw, 380px);
  }
  #overlayStatus, #endTitle { margin: 0; font-weight: 700; font-size: 1.05rem; text-align: center; }
  #endLine1, #endLine2 { margin: 0; font-size: 0.95rem; text-align: center; }
  /* Pause-Panel (Punkt 6): gleiche Titelschrift wie der Game-Over-Titel (1.365rem = 1.05rem x 1.3). */
  #pauseControls { display: none; flex-direction: column; align-items: center; gap: 10px; }
  #pauseTitle { margin: 0; font-weight: 700; font-size: 1.365rem; text-align: center; }
  /* "Eat again!"-Button im Panel: gleiche Groesse wie Retry (#restartBtn, 1.3rem) auf dem Endbildschirm. */
  #resumeBtn { font-size: 1.3rem; }
  /* Highscore-Anzeige (bestaetigte Stilprobe stilprobe-highscore.html, Variante v3): "Highscore"
     in der Score-Zeile oben etwas zurueckgenommen, damit der aktuelle Score die Hauptzahl bleibt;
     Startbildschirm-Zeile im selben kleinen Stil wie #endScore; Rekord-Hinweis in Gold aus der
     bestehenden Palette (COLORS.food.cheeseHi / COLORS.morpho.gold.hi), keine neue Farbe. */
  #score .best { font-weight: 500; opacity: 0.7; }
  /* Punkt-Animation: die Zahl wird kurz gross ('Pop'), wenn sie steigt (Klasse .pop, siehe popNum()).
     transform aendert das Layout nicht - auch bei dreistelligen Zahlen keine Verschiebung. */
  #score .num { display: inline-block; }
  #score .num.pop { animation: scorePop 0.3s ease-out; }
  @keyframes scorePop { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 100% { transform: scale(1); } }
  /* Rekord live: Highscore-Zahl in Gold (dunkleres Gold als .recordInline, weil die Zeile auf dem
     hellen Seitenhintergrund liegt und nicht wie das Panel auf Dunkelgruen). */
  #score .best.record { opacity: 1; }
  #score .best.record .num { color: #a06a10; font-weight: 800; }
  @media (prefers-reduced-motion: reduce) {
    #score .num.pop { animation: none; }
    #score { transition: none; }
  }
  #bestLine { margin: 0; font-size: 1.04rem; opacity: 0.85; text-align: center; }

  /* 'won'-spezifisch (bestaetigter Schmetterling-Endbildschirm, siehe
     stilprobe-schmetterling-canvas.html, finale Bestaetigung "das passt"): Panel sitzt unten statt
     mittig und der Titel ist groesser - damit Gesicht/Koerper des gross auf dem Canvas gezeichneten
     Schmetterlings frei sichtbar bleiben (ueberdeckt wird nur der untere Fluegelbereich). Nur bei
     Phase 'won' aktiv (siehe updateButtons(): centerOverlay.classList.toggle('phase-won', ...)) -
     'ready'/'over' bleiben unveraendert mittig mit dem normalen Titel-Format. */
  /* Panel-Abstand vom unteren Rand 64px -> 16px reduziert UND der Schmetterling in drawButterfly()
     um 40px nach oben verschoben (beides zusammen von Marco bestaetigt, 23.09.2026, Stilprobe
     stilprobe-schmetterling-verzoegerung.html: "Textfeld weiter unten ... Schmetterling etwas
     hoeher"), damit nach dem Einblenden (siehe won-pending/Verzoegerung weiter unten) mehr vom
     Schmetterling frei bleibt statt vom Panel verdeckt zu werden. */
  #centerOverlay.phase-won { align-items: flex-end; padding-bottom: 16px; }
  #centerOverlay.phase-won #endTitle { font-size: 28px; font-weight: 600; }
  /* Schmetterling-Verzoegerung (von Marco bestaetigt, 23.09.2026, Stilprobe wie oben): beim Eintritt
     in die 'won'-Phase bleibt das Panel 1 Sekunde lang unsichtbar (reines JS-Timing, siehe
     updateButtons()/revealWonPanel() weiter unten), damit der Schmetterling zuerst frei sichtbar
     ist, danach blendet das Panel sanft ein. opacity:0 + pointer-events:none nur while "won-pending"
     aktiv ist, damit ein Klick/Tipp waehrend der Wartezeit durch das (unsichtbare) Panel hindurch
     das darunterliegende Spielfeld erreicht (siehe boardWrap-Listener weiter unten, der das
     Einblenden dann sofort auslöst).
     WICHTIG: die transition-Regel ist bewusst von der opacity:0-Regel GETRENNT und an eine eigene
     Klasse "won-fade-armed" gebunden statt direkt an "phase-won" - wuerde die Transition schon beim
     erstmaligen Setzen von "won-pending" aktiv sein, wuerde der Browser auch das anfaengliche
     Verstecken (opacity 1 -> 0 beim Sieg) ueber 0.35s aus-faden statt es sofort umzusetzen (CSS-
     Transitions reagieren auf JEDE Wertaenderung, nicht nur auf die vom Entwickler gemeinte). Die
     JS-Logik (siehe updateButtons()) setzt "won-pending" daher zuerst OHNE "won-fade-armed", erzwingt
     einen Reflow, und aktiviert "won-fade-armed" erst danach - dadurch betrifft die Transition nur
     noch den spaeteren Uebergang beim Einblenden (opacity 0 -> 1), nicht das sofortige Verstecken. */
  #centerOverlay.phase-won.won-fade-armed .panel { transition: opacity 0.35s ease; }
  #centerOverlay.phase-won.won-pending .panel { opacity: 0; pointer-events: none; }

  /* Endbildschirm (Game Over) vergroessert (bestaetigte Stilprobe
     stilprobe-endbildschirme-vergroessert.html, Faktor 1.3, von Marco bestaetigt 23.09.2026) - eigene
     ID-Regeln je Element, da #endTitle/#endLine1/#endLine2/#endScore sonst nur ueber die gemeinsamen
     Basis-Regeln oben (Zeile 103-105) liefen und #restartBtn nur ueber .game-btn. Wichtig: NUR der
     'over'-Zweig wird vergroessert - der 'won'-Zweig (Schmetterling) bleibt bewusst beim bestaetigten
     Original (siehe #centerOverlay.phase-won #endTitle direkt darueber, unveraendert 28px), da Marco
     die Schmetterling-Groesse explizit so bestaetigt hat ("das originale ist gut so"). Die #endTitle-
     Regel hier wirkt trotzdem nur auf die 'over'-Phase, weil #centerOverlay.phase-won #endTitle (zwei
     ID-Selektoren kombiniert) hoehere Spezifitaet hat und daher fuer 'won' unabhaengig von der
     Quellreihenfolge weiterhin gewinnt. */
  #endTitle { font-size: 1.365rem; }
  #endLine1, #endLine2 { font-size: 1.235rem; }
  #restartBtn { font-size: 1.3rem; }

  /* Endbildschirm-Inhalt (Stilprobe stilprobe-endbildschirme-inhalt.html): Farbakzent je Variante +
     Score-Zeile als "Pills". Die Variante steht als data-variant am #centerOverlay (gesetzt in
     applyEndScreenText(), entfernt in updateButtons(), sobald das Panel nicht mehr Endbildschirm
     ist - sonst wuerde der Streifen auch auf Start-/Pause-Panel erscheinen). Der Akzent ist ein
     4-px-Streifen oben im Panel per inset box-shadow (aendert kein Layout) plus Titelfarbe; der
     Schmetterling-Titel bleibt bewusst weiss (28px-Titel unveraendert, nur der Streifen). */
  #centerOverlay[data-variant] .panel { box-shadow: inset 0 4px 0 var(--accent); }
  #centerOverlay[data-variant="wall"]     { --accent: #ffa45c; }
  #centerOverlay[data-variant="self"]     { --accent: #8fe3a8; }
  #centerOverlay[data-variant="villain"]  { --accent: #c9a0ff; }
  #centerOverlay[data-variant="starving"] { --accent: #9dc4e6; }
  #centerOverlay[data-variant="won"]      { --accent: #17c2c9; }
  #centerOverlay[data-variant]:not([data-variant="won"]) #endTitle { color: var(--accent); }
  #endScore { margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; }
  .pill {
    display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap;
    padding: 3px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.12);
    font-size: 1.04rem; line-height: 1.3; font-variant-numeric: tabular-nums;
  }
  .pill .lbl { font-size: 0.8em; opacity: 0.75; }
  .pill .val { font-weight: 700; }
  /* Rekord-Pill in Gold aus der bestehenden Palette (COLORS.morpho.gold.hi = #ffe58f). */
  .pill.record { background: rgba(255, 229, 143, 0.2); color: #ffe58f; font-weight: 700; }
  .pill.record .lbl { font-size: 1em; opacity: 1; }
  @media (max-width: 380px) { .pill { font-size: 0.95rem; padding: 3px 10px; } }
  @media (max-width: 340px) { #endScore { gap: 6px; } .pill { font-size: 0.85rem; padding: 3px 8px; gap: 4px; } }

  /* Startbildschirm horizontal (bestaetigte Stilprobe stilprobe-startbildschirm-horizontal.html,
     Variante A, 23.09.2026): das Panel wird NUR waehrend der Ready-Phase breiter und flacher statt
     schmal/hoch - Endbildschirm (#endControls, .game-btn fuer Retry/Pause) bleibt unveraendert.
     Eigene Klasse "phase-ready" (gleiches Prinzip wie "phase-won" oben), damit die Breiten-/
     Padding-Aenderung sauber auf die Ready-Phase beschraenkt bleibt und nicht ueber die gemeinsame
     .panel-Klasse den Endbildschirm mitveraendert. Breite orientiert sich an #boardWrap
     (min(94vw, 68vh, 560px)), auf 90% davon reduziert - identisch zur Stilprobe. */
  #centerOverlay.phase-ready .panel {
    width: calc(min(94vw, 68vh, 560px) * 0.9);
    max-width: none;
    padding: 20px 24px;
  }

  /* Neu in Paket 4: Startbildschirm-Einstellungen (Modus, Zielwert, Boesewicht). Bewusst als
     eigener Block, damit er sich unabhaengig vom Endbildschirm ein-/ausblenden laesst (siehe
     updateButtons()). #readyControls und #endControls sind seit der horizontalen Stilprobe (siehe
     oben) getrennte Regeln statt einer gemeinsamen - #readyControls ist jetzt eine Zwei-Spalten-Zeile
     (.readyLeft/.readyRight, siehe unten), #endControls bleibt unveraendert die bisherige Spalte. */
  #endControls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #readyControls { display: flex; flex-direction: row; align-items: center; gap: 22px; width: 100%; }
  /* Linke Spalte: Status ("Ready?") + Highscore-Zeile, rechtsbuendig zur Mitte hin linksbuendiger
     Text (siehe #overlayStatus/#bestLine text-align unten). Rechte Spalte: alle Bedienelemente
     kompakt untereinander. min-width:0 auf beiden ist der in der Stilprobe gefundene Bugfix gegen
     das klassische Flexbox-Ueberlaufproblem (Flex-Kinder duerfen sonst nicht unter ihre
     Inhaltsbreite schrumpfen und sprengen den Panel-Rahmen). */
  .readyLeft { flex: 1 1 40%; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .readyRight { flex: 1 1 60%; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 9px; }
  /* #overlayStatus bekommt eine eigene, spezifischere Regel (nach der gemeinsamen Regel mit
     #endTitle oben) fuer Groesse/Ausrichtung, die NUR auf dem Startbildschirm gilt - #endTitle hat
     seine eigene Vergroesserung fuer den Endbildschirm weiter oben (Faktor 1.3, siehe
     "Endbildschirm vergroessert"-Block), bleibt von dieser Regel hier also unberuehrt. Grössenfaktor
     Startbildschirm: von Marco bestaetigt (23.09.2026, Stilprobe Variante A) - alle Texte des Panels
     x1.3, "Ready?" zusaetzlich x1.3 (macht in Summe x1.69 gegenueber dem urspruenglichen 1.05rem =
     1.7745rem). */
  #overlayStatus { font-size: 1.7745rem; text-align: left; }
  #bestLine { text-align: left; }
  /* Punkt 11: Auf sehr schmalen Screens (<= 360 px) ragte "Ready?" (28.4 px) in die rechte Spalte
     (gemessen: 13 px Ueberlappung bei 320 px, 10 px bei 330, 6 px bei 340, 3 px bei 350). Die
     Zwei-Spalten-Anordnung bleibt, nur die Schrift dieser einen Zeile wird gestaffelt kleiner.
     Steht bewusst NACH der Grundregel oben (gleiche Spezifitaet, spaetere Regel gewinnt). Ab
     361 px bleibt alles unveraendert. Highscore-Zeile und Buttons brauchen keine Anpassung
     (kein Ueberlauf gemessen). */
  @media (max-width: 360px) { #overlayStatus { font-size: 1.5rem; } }
  @media (max-width: 340px) { #overlayStatus { font-size: 1.3rem; } }
  #modeSelect { display: flex; gap: 8px; flex-wrap: wrap; }
  #goalInputWrap { display: flex; align-items: center; gap: 6px; font-size: 1.235rem; }
  #goalInputWrap input[type="number"] {
    width: 68px;
    min-width: 0;
    padding: 6px 8px;
    border-radius: 8px;
    border: none;
    font: inherit;
  }
  #goalError { margin: 0; font-size: 1.04rem; color: #ffb4b4; min-height: 1em; text-align: left; }
  #villainLabel { display: flex; align-items: center; gap: 6px; font-size: 1.235rem; cursor: pointer; }

  /* Fester Platz unter dem Feld fuer den Pause/Weiter-Button, damit nichts springt,
     wenn er ein-/ausgeblendet wird. */
  #controls { min-height: 48px; display: flex; align-items: center; justify-content: center; }
  #pauseBtn { display: none; }

  #hint { margin: 0; font-size: 0.85rem; opacity: 0.75; text-align: center; }
  /* Hinweis je nach Geraet: Touch-Geraete (kein Hover, grober Zeiger) sehen den Wisch-Hinweis,
     alle anderen den Tastatur-Hinweis. */
  #hint .hint-touch { display: none; }
  @media (hover: none) and (pointer: coarse) {
    #hint .hint-keys { display: none; }
    #hint .hint-touch { display: inline; }
  }
  /* Entwicklerzeile: vor dem Anlass komplett entfernen */
  #info { margin: 0; font: 12px ui-monospace, Consolas, monospace; opacity: 0.55; text-align: center; }
</style>
</head>
<body>
  <h1 id="gameTitle">The Very Hungry ConcorPillar</h1>
  <p id="score"></p>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="centerOverlay">
      <div class="panel">
        <div id="readyControls">
          <div class="readyLeft">
            <p id="overlayStatus"></p>
            <p id="bestLine"></p>
          </div>
          <div class="readyRight">
            <div id="modeSelect">
              <button type="button" id="modeEndlessBtn" class="game-btn mode-btn">Endless</button>
              <button type="button" id="modeGoalBtn" class="game-btn mode-btn">Goal</button>
            </div>
            <div id="goalInputWrap">
              <label for="goalInput">Target:</label>
              <input type="number" id="goalInput" min="1" max="200" step="1" value="50" enterkeyhint="go">
            </div>
            <p id="goalError"></p>
            <label id="villainLabel"><input type="checkbox" id="villainCheckbox"> Villain</label>
            <button id="startBtn" class="game-btn" type="button">Start</button>
          </div>
        </div>
        <div id="pauseControls">
          <p id="pauseTitle">Take a Break!</p>
          <button id="resumeBtn" class="game-btn" type="button">Eat again!</button>
        </div>
        <div id="endControls">
          <p id="endTitle"></p>
          <p id="endScore"></p>
          <p id="endLine1"></p>
          <p id="endLine2"></p>
          <button id="restartBtn" class="game-btn" type="button">Retry</button>
        </div>
      </div>
    </div>
  </div>
  <div id="controls">
    <button id="pauseBtn" class="game-btn" type="button">Take a Break!</button>
  </div>
  <p id="hint"><span class="hint-keys">Arrow keys / WASD to steer · Space to pause or retry</span><span class="hint-touch">Swipe to steer</span></p>
  <p id="info"></p>

<script>
'use strict';

// ---------------------------------------------------------------
// 1) Konstanten
// ---------------------------------------------------------------
const GRID = 20;               // 20 x 20 Felder
const CELL = 24;               // logische Pixel pro Feld
const BOARD_PX = GRID * CELL;  // 480 x 480 logische Pixel (reines Spielfeld-Raster, unveraendert -
                                // Kollision/Spawn-Logik rechnet weiterhin ausschliesslich hiermit)

// Sicherheitsrand rund um das Spielfeld-Raster (nur fuer's Zeichnen, siehe draw() weiter unten).
// Hintergrund: Boesewicht (VILLAIN_RADIUS_FACTOR) und Futter-Icons (FOOD_ICON_SIZE_FACTOR) sind
// bewusst groesser als eine Zelle und duerfen ueber die Zellgrenze hinausragen (siehe Kommentare
// dort) - stehen sie dabei in einer Rand-Zelle, wurden Hoernchen/Arme bisher an der Canvas-Kante
// hart abgeschnitten (per Definition eines <canvas>: alles ausserhalb der Bitmap-Flaeche wird nicht
// gezeichnet, das laesst sich nicht per CSS umgehen). Per Playwright-Pixelmessung (siehe Chat)
// ragt der Boesewicht in einer Rand-Zelle max. ~22px ueber die Spielfeld-Kante hinaus (Hoernchen
// nach oben) - CANVAS_MARGIN daher grosszuegig auf 1.5 Zellen gesetzt, mit etwas Puffer fuer
// zukuenftige Elemente (z. B. den geplanten Schmetterling).
const CANVAS_MARGIN = CELL * 1.5;    // 36px bei CELL=24
const CANVAS_PX = BOARD_PX + CANVAS_MARGIN * 2;  // Gesamte Zeichenflaeche inkl. Rand (552px)

// Tempo: Startwert, Untergrenze und Beschleunigung pro Futter an einer Stelle.
// Alle drei Werte sind Richtwerte aus dem Konzept und NICHT mit Testpersonen geprueft -
// siehe Testliste. Feinjustierung folgt, sobald ein paar Ungeuebte das Spiel probiert haben.
const START_TICK_MS = 250;     // Dauer eines Schritts beim Spielstart (langsamer als die 150 ms der Woche-1-Demo)
const MIN_TICK_MS = 90;        // schnellste erlaubte Geschwindigkeit (Untergrenze, wird nie unterschritten)
const TICK_MS_STEP = 6;        // um so viel wird ein Schritt pro gefressenem Futter kuerzer

// Mindest-Wischstrecke in echten Pixeln. Die ERSTE Bewegung einer Beruehrung braucht die volle
// Strecke (SWIPE_MIN_PX) - sonst wuerde ein blosses Tippen als Wisch zaehlen. JEDE WEITERE
// Richtungsaenderung, waehrend der Finger noch aufliegt, braucht nur noch SWIPE_CONTINUE_PX -
// das Tipp-Risiko besteht dann nicht mehr, weil schon eine echte Bewegung im Gange ist. Das macht
// schnelle Kehren (z. B. hoch -> links -> runter in einem Zug, ohne loszulassen) deutlich leichter.
const SWIPE_MIN_PX = 18;
const SWIPE_CONTINUE_PX = 9;

// Neu in Paket 4: Zielwert-Obergrenze fuer den Ziel-Modus (offener Punkt aus dem Konzept).
// Bei 1 Punkt/Futter und GRID*GRID=400 Feldern sind rechnerisch max. 395 moeglich (5 Startsegmente
// sind schon belegt). 200 ist bewusst kleiner gewaehlt, damit ein Ziel in vertretbarer Zeit
// erreichbar bleibt - ein Vorschlag von Claude, noch nicht mit Testpersonen abgeglichen.
const MAX_GOAL_TARGET = 200;

// Highscore (lokal pro Geraet/Browser per localStorage, kein zentrales Leaderboard - siehe Konzept).

// 1b) Futter-Icons als eingebettete SVGs (Pizza, Erdbeer-Eis, Bier)
// ---------------------------------------------------------------
// Uebernommen 1:1 aus der bestaetigten Stilprobe (stilprobe-futter-bausteine.md) - bewusst nicht
// neu gebaut. Jede Funktion baut einen SVG-Text, der per data:-URI als <img> geladen wird
// (loadImage) und danach beliebig oft mit drawImage() gezeichnet werden kann, ohne bei jedem
// Frame neu als SVG geparst zu werden.
function svgWrap(defs, body) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">' +
    '<defs>' + defs + '</defs>' + body + '</svg>';
}
function grad(id, hi, lo) {
  return '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="' + hi + '"/><stop offset="1" stop-color="' + lo + '"/></linearGradient>';
}
function circ(cx, cy, r, fill, stroke, sw) {
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"' +
    (stroke ? ' stroke="' + stroke + '" stroke-width="' + sw + '"' : '') + '/>';
}

function pizzaSvg(f) {
  return svgWrap(
    grad('gc', f.cheeseHi, f.cheese) + grad('gr', f.crustHi, f.crust),
    '<path d="M5.5 9 L26.5 9 L16 29 Z" fill="url(#gc)" stroke="' + f.o + '" stroke-width="1.6" stroke-linejoin="round"/>' +
    '<rect x="4" y="5" width="24" height="5.5" rx="2.75" fill="url(#gr)" stroke="' + f.o + '" stroke-width="1.6"/>' +
    circ(12, 15, 2.6, f.pep, f.o, 0.9) +
    circ(19.5, 15.5, 2.6, f.pep, f.o, 0.9) +
    circ(15.7, 21.5, 2.3, f.pep, f.o, 0.9)
  );
}

function iceCreamSvg(f) {
  // Waffel-Karomuster: zwei Scharen diagonaler Linien, per clipPath auf das Kegel-Dreieck begrenzt.
  let hatch = '';
  for (let o = -8; o <= 14; o += 5) {
    hatch += '<line x1="' + (8 + o) + '" y1="14" x2="' + (24 + o) + '" y2="30" stroke="' + f.o + '" stroke-width="0.9" opacity="0.7"/>';
    hatch += '<line x1="' + (24 - o) + '" y1="14" x2="' + (8 - o) + '" y2="30" stroke="' + f.o + '" stroke-width="0.9" opacity="0.7"/>';
  }
  // Wolkenfoermige/gewellte Unterkante der Kugel: 4 kleine Kreise ("Scallops"), NACH dem grossen
  // Kugelkreis gezeichnet, so dass sie sichtbar ueber den Kugelrand reichen/ihn ueberlappen.
  const bumpR = 2.6;
  const bumpY = 14.4;
  const bumpXs = [10.2, 14.1, 17.9, 21.8];
  let scoopBumps = '';
  for (const bx of bumpXs) {
    scoopBumps += circ(bx, bumpY, bumpR, 'url(#gs)', f.o, 1.6);
  }
  return svgWrap(
    grad('gk', f.coneHi, f.cone) + grad('gs', f.scoopHi, f.scoop) +
    '<clipPath id="coneClip"><path d="M10 15 L22 15 L16 30 Z"/></clipPath>',
    '<path d="M10 15 L22 15 L16 30 Z" fill="url(#gk)" stroke="' + f.o + '" stroke-width="1.6" stroke-linejoin="round"/>' +
    '<g clip-path="url(#coneClip)">' + hatch + '</g>' +
    circ(16, 9, 6.5, 'url(#gs)', f.o, 1.6) +
    scoopBumps +
    circ(12.5, 7, 0.9, f.seed) + circ(17.5, 5.5, 0.9, f.seed) + circ(20, 9.5, 0.9, f.seed) +
    circ(13.5, 10.5, 0.9, f.seed) + circ(17, 11.1, 0.9, f.seed) +
    '<ellipse cx="12.5" cy="4.8" rx="2.4" ry="1.4" fill="#ffffff" opacity="0.45" transform="rotate(-25 12.5 4.8)"/>'
  );
}

// Ladefunktion fuer Futter-Icons: baut aus dem SVG-Text eine data:-URI und laedt sie als
// <img>, damit sie beliebig oft mit drawImage() gezeichnet werden kann, ohne bei jedem Frame
// neu geparst zu werden.
function loadImage(svg) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = function () { reject(new Error('Ein Futter-Icon konnte nicht geladen werden.')); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
