<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VeryHungryConcorPillar</title>
<style>
  :root {
    --page-bg: #f6f1e7;
    --text: #2f3d2c;
    --board-border: #8fae6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page-bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 { margin: 0; font-size: 1.4rem; }
  #score { margin: 0; font-size: 1rem; font-weight: 600; }

  #boardWrap {
    position: relative;
    width: min(94vw, 68vh, 560px);
    aspect-ratio: 1 / 1;
  }
  #board {
    display: block;
    width: 100%;
    height: 100%;
    border: 4px solid var(--board-border);
    border-radius: 12px;
    touch-action: none;
  }

  /* Buttons: bewusst schlicht, wie die uebrigen Overlays - der Stil kommt erst im Woche-2-Abgleich */
  .game-btn {
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    padding: 10px 24px;
    border: none;
    border-radius: 10px;
    background: var(--board-border);
    color: #1f2a1c;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .game-btn:active { filter: brightness(0.9); }
  .mode-btn { padding: 8px 16px; font-size: 0.9rem; }

  /* Zentriertes Overlay auf dem Canvas fuer Startbildschirm (ready) und Endbildschirm (over/won).
     pointer-events:none auf dem Container, damit er ausserhalb des Panels nichts blockiert -
     das Panel selbst holt sich pointer-events per Regel unten zurueck. */
  #centerOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #centerOverlay .panel {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: rgba(47, 61, 44, 0.85);
    color: #f6f1e7;
    padding: 16px 22px;
    border-radius: 14px;
    max-width: min(86vw, 380px);
  }
  #overlayStatus, #endStatus { margin: 0; font-weight: 700; font-size: 1.05rem; text-align: center; }

  /* Neu in Paket 4: Startbildschirm-Einstellungen (Modus, Zielwert, Boesewicht). Bewusst als
     eigener Block, damit er sich unabhaengig vom Endbildschirm ein-/ausblenden laesst (siehe
     updateButtons()). */
  #readyControls, #endControls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #modeSelect { display: flex; gap: 8px; }
  #goalInputWrap { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; }
  #goalInputWrap input[type="number"] {
    width: 64px;
    padding: 6px 8px;
    border-radius: 8px;
    border: none;
    font: inherit;
  }
  #goalError { margin: 0; font-size: 0.8rem; color: #ffb4b4; min-height: 1em; text-align: center; }
  #villainLabel { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; cursor: pointer; }

  /* Fester Platz unter dem Feld fuer den Pause/Weiter-Button, damit nichts springt,
     wenn er ein-/ausgeblendet wird. */
  #controls { min-height: 48px; display: flex; align-items: center; justify-content: center; }
  #pauseBtn { display: none; }

  #hint { margin: 0; font-size: 0.85rem; opacity: 0.75; text-align: center; }
  /* Entwicklerzeile: vor dem Anlass komplett entfernen */
  #info { margin: 0; font: 12px ui-monospace, Consolas, monospace; opacity: 0.55; text-align: center; }
</style>
</head>
<body>
  <h1>Very Hungry ConcorPillar</h1>
  <p id="score"></p>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="centerOverlay">
      <div class="panel">
        <div id="readyControls">
          <p id="overlayStatus"></p>
          <div id="modeSelect">
            <button type="button" id="modeEndlessBtn" class="game-btn mode-btn">Endless</button>
            <button type="button" id="modeGoalBtn" class="game-btn mode-btn">Goal</button>
          </div>
          <div id="goalInputWrap">
            <label for="goalInput">Target:</label>
            <input type="number" id="goalInput" min="1" max="200" step="1" value="50">
          </div>
          <p id="goalError"></p>
          <label id="villainLabel"><input type="checkbox" id="villainCheckbox"> Villain</label>
          <button id="startBtn" class="game-btn" type="button">Start</button>
        </div>
        <div id="endControls">
          <p id="endStatus"></p>
          <button id="restartBtn" class="game-btn" type="button">Neustart</button>
        </div>
      </div>
    </div>
  </div>
  <div id="controls">
    <button id="pauseBtn" class="game-btn" type="button">Pause</button>
  </div>
  <p id="hint">Pfeiltasten/WASD oder Wischen steuern · Start/Pause/Neustart per Button oder Leertaste</p>
  <p id="info"></p>

<script>
'use strict';

// ---------------------------------------------------------------
// 1) Konstanten
// ---------------------------------------------------------------
const GRID = 20;               // 20 x 20 Felder
const CELL = 24;               // logische Pixel pro Feld
const BOARD_PX = GRID * CELL;  // 480 x 480 logische Pixel

// Tempo: Startwert, Untergrenze und Beschleunigung pro Futter an einer Stelle.
// Alle drei Werte sind Richtwerte aus dem Konzept und NICHT mit Testpersonen geprueft -
// siehe Testliste. Feinjustierung folgt, sobald ein paar Ungeuebte das Spiel probiert haben.
const START_TICK_MS = 250;     // Dauer eines Schritts beim Spielstart (langsamer als die 150 ms der Woche-1-Demo)
const MIN_TICK_MS = 90;        // schnellste erlaubte Geschwindigkeit (Untergrenze, wird nie unterschritten)
const TICK_MS_STEP = 6;        // um so viel wird ein Schritt pro gefressenem Futter kuerzer

// Mindest-Wischstrecke in echten Pixeln. Die ERSTE Bewegung einer Beruehrung braucht die volle
// Strecke (SWIPE_MIN_PX) - sonst wuerde ein blosses Tippen als Wisch zaehlen. JEDE WEITERE
// Richtungsaenderung, waehrend der Finger noch aufliegt, braucht nur noch SWIPE_CONTINUE_PX -
// das Tipp-Risiko besteht dann nicht mehr, weil schon eine echte Bewegung im Gange ist. Das macht
// schnelle Kehren (z. B. hoch -> links -> runter in einem Zug, ohne loszulassen) deutlich leichter.
const SWIPE_MIN_PX = 18;
const SWIPE_CONTINUE_PX = 9;

// Neu in Paket 4: Zielwert-Obergrenze fuer den Ziel-Modus (offener Punkt aus dem Konzept).
// Bei 1 Punkt/Futter und GRID*GRID=400 Feldern sind rechnerisch max. 395 moeglich (5 Startsegmente
// sind schon belegt). 200 ist bewusst kleiner gewaehlt, damit ein Ziel in vertretbarer Zeit
// erreichbar bleibt - ein Vorschlag von Claude, noch nicht mit Testpersonen abgeglichen.
const MAX_GOAL_TARGET = 200;

// Boesewicht: Erscheinungswahrscheinlichkeit pro Tick, Lebensdauer und Abklingzeit danach.
// Wie bei den Tempo-/Wisch-Werten: Richtwerte, noch nicht mit Testpersonen geprueft.
const VILLAIN_SPAWN_CHANCE = 0.02;   // pro Tick, wenn gerade keiner da ist und keine Abklingzeit laeuft
const VILLAIN_LIFETIME_TICKS = 25;   // so lange bleibt er sichtbar, bevor er von selbst verschwindet
const VILLAIN_COOLDOWN_TICKS = 20;   // Pause nach dem Verschwinden, bevor er erneut erscheinen kann

// Eigene Farbpalette (Raupen-Thema, helles Blattgrün)
const COLORS = {
  boardA: '#e4edcf',
  boardB: '#d9e5bd',
  bodyA: '#6dbf5a',
  bodyB: '#58ab48',
  head: '#3f8f3a',
  eyeWhite: '#ffffff',
  eyePupil: '#1f2a1c',
  morphoBlue: '#1f5fe0',       // reserviert für den Schmetterling am Ende des Ziel-Modus
  villain: '#5b2a86'           // Platzhalter-Farbe fuer den Boesewicht, echtes Design folgt in Woche 2
};

// Finale Futter-Liste aus dem Konzept. Farben sind Platzhalter, echte Icons folgen in Woche 2.
// Spielmechanisch sind alle Sorten gleichwertig (siehe Konzept) - reine visuelle Abwechslung.
const FOOD = [
  { name: 'Lasagne',      color: '#c8562a' },
  { name: 'Ramen',        color: '#e0a53a' },
  { name: 'Pizza',        color: '#d9382e' },
  { name: 'Banane',       color: '#f4d03f' },
  { name: 'Gummibärchen', color: '#8e44ad' },
  { name: 'Erdbeer-Eis',  color: '#f7a8c0' },
  { name: 'Kuchen',       color: '#8b5a2b' },
  { name: 'Aperol',       color: '#ff7f11' },
  { name: 'Bier',         color: '#f0b323' }
];

// Tastenzuordnung: Pfeiltasten und WASD, unabhängig vom Tastaturlayout (e.code statt e.key)
const DIR_KEYS = {
  ArrowUp: { x: 0, y: -1 },  KeyW: { x: 0, y: -1 },
  ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }
};

// ---------------------------------------------------------------
// 2) Zustand (alles, was sich im Spiel ändert, liegt hier)
// ---------------------------------------------------------------
const state = {
  snake: [],                   // Feld-Koordinaten, Index 0 = Kopf
  dir: { x: 1, y: 0 },         // Richtung, die im aktuellen Tick tatsächlich angewendet wird
  nextDir: { x: 1, y: 0 },     // durch Tastendruck/Wisch vorgemerkte Richtung, wird zu Beginn des nächsten Tick übernommen
  tick: 0,                     // Anzahl bisheriger Spielschritte
  score: 0,                    // Anzahl gefressenes Futter
  phase: 'ready',              // 'ready' | 'running' | 'paused' | 'over' | 'won'
  food: null,                  // { x, y, type } - type ist der Index in FOOD
  tickMs: START_TICK_MS,       // aktuelle Geschwindigkeit (sinkt mit dem Score bis MIN_TICK_MS)
  mode: 'endless',              // 'endless' | 'goal' - auf dem Startbildschirm gewaehlt
  goalTarget: null,             // Zielwert im Ziel-Modus (null im Endlos-Modus)
  villainEnabled: false,        // Checkbox auf dem Startbildschirm
  villain: null,                // { x, y, ticksLeft } oder null, wenn gerade keiner da ist
  villainCooldown: 0            // Ticks, bis der Boesewicht wieder erscheinen darf
};

// ---------------------------------------------------------------
// 3) Canvas-Setup (scharfe Darstellung auf Handys mit hoher Pixeldichte)
// ---------------------------------------------------------------
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const infoEl = document.getElementById('info');
const scoreEl = document.getElementById('score');
const centerOverlay = document.getElementById('centerOverlay');
const readyControls = document.getElementById('readyControls');
const endControls = document.getElementById('endControls');
const overlayStatus = document.getElementById('overlayStatus');
const endStatus = document.getElementById('endStatus');
const modeEndlessBtn = document.getElementById('modeEndlessBtn');
const modeGoalBtn = document.getElementById('modeGoalBtn');
const goalInputWrap = document.getElementById('goalInputWrap');
const goalInput = document.getElementById('goalInput');
const goalError = document.getElementById('goalError');
const villainCheckbox = document.getElementById('villainCheckbox');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');

function setupCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = BOARD_PX * dpr;   // setzt die Zeichenfläche zurück ...
  canvas.height = BOARD_PX * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);  // ... daher Skalierung danach setzen
}

// ---------------------------------------------------------------
// 4) Spiellogik (pro Tick genau ein Schritt)
// ---------------------------------------------------------------

function isOpposite(a, b) {
  return a.x === -b.x && a.y === -b.y;
}

// Gemeinsame Richtungseingabe fuer Tastatur UND Swipe (Abschnitt 7 ruft beide Wege hierher).
// Prüft die 180-Grad-Sperre immer gegen die tatsächlich aktive Richtung (state.dir), nie gegen
// eine bereits vorgemerkte state.nextDir - so kann ein zweiter, schneller Steuerbefehl vor dem
// nächsten Tick keine Wende "durchschmuggeln", die in der Summe 180 Grad ergibt.
function handleDirectionInput(dir) {
  if (state.phase === 'over' || state.phase === 'won' || state.phase === 'paused') return;
  if (isOpposite(dir, state.dir)) return;
  state.nextDir = dir;
  if (state.phase === 'ready') {
    state.phase = 'running';
    startLoop();
  }
}

// "extra" (optional): zusaetzliche, momentan belegte Zellen, die neben der Raupe ebenfalls
// gemieden werden sollen (z. B. das Futter beim Boesewicht-Spawn, oder umgekehrt). Neu in Paket 4 -
// vorher gab es nur die Raupe als Einschraenkung.
function randomFreeCell(extra) {
  let cell;
  do {
    cell = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (
    state.snake.some(function (s) { return s.x === cell.x && s.y === cell.y; }) ||
    (extra && extra.some(function (c) { return c.x === cell.x && c.y === cell.y; }))
  );
  return cell;
}

function spawnFood() {
  const extra = state.villain ? [state.villain] : undefined;
  const cell = randomFreeCell(extra);
  state.food = { x: cell.x, y: cell.y, type: Math.floor(Math.random() * FOOD.length) };
}

function gameOver() {
  state.phase = 'over';
  stopLoop();
}

// Neu in Paket 4: Ziel-Modus erfolgreich beendet (Zielwert erreicht). Eigener Endzustand statt
// gameOver(), da es kein Verlieren ist - eigener Text/Button-Beschriftung in updateButtons().
function winGame() {
  state.phase = 'won';
  stopLoop();
}

// Boesewicht: erscheint gelegentlich auf einem freien Feld, steht dort still und verschwindet nach
// VILLAIN_LIFETIME_TICKS Ticks von selbst wieder. Danach eine Abklingzeit (VILLAIN_COOLDOWN_TICKS),
// bevor er erneut erscheinen kann - sonst koennte er theoretisch sofort wieder auftauchen. Wird pro
// Tick aus update() aufgerufen, bevor die Kollision fuer diesen Tick geprueft wird.
function updateVillain() {
  if (!state.villainEnabled) return;

  if (state.villain) {
    state.villain.ticksLeft--;
    if (state.villain.ticksLeft <= 0) {
      state.villain = null;
      state.villainCooldown = VILLAIN_COOLDOWN_TICKS;
    }
    return;
  }

  if (state.villainCooldown > 0) {
    state.villainCooldown--;
    return;
  }

  if (Math.random() < VILLAIN_SPAWN_CHANCE) {
    const extra = state.food ? [state.food] : undefined;
    const cell = randomFreeCell(extra);
    state.villain = { x: cell.x, y: cell.y, ticksLeft: VILLAIN_LIFETIME_TICKS };
  }
}

// Nach jedem gefressenen Futter neu berechnen. Aendert sich die Geschwindigkeit tatsaechlich
// und laeuft der Loop gerade, wird er neu gestartet (stopLoop() dann startLoop()) - nie
// laeuft ein zweiter Timer parallel zum ersten.
function applyGrowthSpeedup() {
  const newTickMs = Math.max(MIN_TICK_MS, START_TICK_MS - state.score * TICK_MS_STEP);
  if (newTickMs === state.tickMs) return;
  state.tickMs = newTickMs;
  if (loopActive) {
    stopLoop();
    startLoop();
  }
}

function update() {
  state.dir = state.nextDir;   // vorgemerkte Richtung genau einmal pro Tick übernehmen
  updateVillain();             // Spawn/Despawn zuerst, damit die Kollisionspruefung unten den
                                // fuer DIESEN Tick gueltigen Boesewicht-Zustand verwendet

  const head = state.snake[0];
  const next = { x: head.x + state.dir.x, y: head.y + state.dir.y };

  if (next.x < 0 || next.x >= GRID || next.y < 0 || next.y >= GRID) {
    gameOver();
    return;
  }

  if (state.villainEnabled && state.villain && next.x === state.villain.x && next.y === state.villain.y) {
    gameOver();
    return;
  }

  const willGrow = !!state.food && next.x === state.food.x && next.y === state.food.y;

  // Kollisionsregel Schwanzende: Wächst die Raupe in diesem Schritt nicht, rückt der Schwanz
  // nach - das aktuell letzte Feld wird frei und ein Kopf dorthin ist erlaubt. Deshalb wird das
  // letzte Segment nur dann mitgeprüft, wenn die Raupe wächst (Schwanz bleibt liegen).
  const bodyToCheck = willGrow ? state.snake : state.snake.slice(0, -1);
  if (bodyToCheck.some(function (seg) { return seg.x === next.x && seg.y === next.y; })) {
    gameOver();
    return;
  }

  state.snake.unshift(next);
  if (willGrow) {
    state.score++;
    if (state.mode === 'goal' && state.goalTarget !== null && state.score >= state.goalTarget) {
      winGame();
      return;
    }
    spawnFood();
    applyGrowthSpeedup();
  } else {
    state.snake.pop();
  }
  state.tick++;
}

// ---------------------------------------------------------------
// 5) Zeichnen
// ---------------------------------------------------------------

function drawBoard() {
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? COLORS.boardA : COLORS.boardB;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }
}

function drawFood() {
  if (!state.food) return;
  const food = FOOD[state.food.type];
  const cx = state.food.x * CELL + CELL / 2;
  const cy = state.food.y * CELL + CELL / 2;
  ctx.fillStyle = food.color;
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * 0.34, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';   // kleiner Glanzpunkt
  ctx.beginPath();
  ctx.arc(cx - CELL * 0.11, cy - CELL * 0.11, CELL * 0.08, 0, Math.PI * 2);
  ctx.fill();
}

// Platzhalter-Darstellung fuer den Boesewicht (einfacher dunkler Kreis mit zwei Augen) - echtes
// Design folgt im Woche-2-Stilabgleich, genau wie bei Raupe und Futter.
function drawVillain() {
  if (!state.villainEnabled || !state.villain) return;
  const v = state.villain;
  const cx = v.x * CELL + CELL / 2;
  const cy = v.y * CELL + CELL / 2;
  ctx.fillStyle = COLORS.villain;
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * 0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx - CELL * 0.15, cy - CELL * 0.08, CELL * 0.09, 0, Math.PI * 2);
  ctx.arc(cx + CELL * 0.15, cy - CELL * 0.08, CELL * 0.09, 0, Math.PI * 2);
  ctx.fill();
}

function drawSnake() {
  // Vom Schwanz zum Kopf zeichnen, damit der Kopf zuoberst liegt
  for (let i = state.snake.length - 1; i >= 0; i--) {
    const s = state.snake[i];
    const cx = s.x * CELL + CELL / 2;
    const cy = s.y * CELL + CELL / 2;
    ctx.fillStyle = i === 0 ? COLORS.head : (i % 2 === 0 ? COLORS.bodyA : COLORS.bodyB);
    ctx.beginPath();
    ctx.arc(cx, cy, i === 0 ? CELL * 0.48 : CELL * 0.44, 0, Math.PI * 2);
    ctx.fill();
  }

  // Augen am Kopf, in Bewegungsrichtung versetzt
  const h = state.snake[0];
  const hx = h.x * CELL + CELL / 2;
  const hy = h.y * CELL + CELL / 2;
  const d = state.dir;
  const px = -d.y, py = d.x;   // Senkrechte zur Blickrichtung
  for (const side of [-1, 1]) {
    const ex = hx + d.x * CELL * 0.16 + px * side * CELL * 0.2;
    const ey = hy + d.y * CELL * 0.16 + py * side * CELL * 0.2;
    ctx.fillStyle = COLORS.eyeWhite;
    ctx.beginPath();
    ctx.arc(ex, ey, CELL * 0.13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.eyePupil;
    ctx.beginPath();
    ctx.arc(ex + d.x * CELL * 0.04, ey + d.y * CELL * 0.04, CELL * 0.065, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCenteredText(text) {
  ctx.save();
  ctx.fillStyle = 'rgba(47, 61, 44, 0.75)';
  ctx.fillRect(0, BOARD_PX / 2 - 26, BOARD_PX, 52);
  ctx.fillStyle = '#f6f1e7';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, BOARD_PX / 2, BOARD_PX / 2);
  ctx.restore();
}

// Sichtbarer Hinweis auf dem Spielfeld selbst. Nur noch fuer "Pause" - bei "ready"/"over"/"won"
// steht der Text zusammen mit dem jeweiligen Button im HTML-Panel (siehe updateButtons()), damit
// sich nicht zwei unterschiedlich breite Elemente (Canvas-Text + Button) gegenseitig ueberlagern.
function drawOverlay() {
  if (state.phase === 'paused') {
    drawCenteredText('Pause');
  }
}

function draw() {
  drawBoard();
  drawFood();
  drawVillain();
  drawSnake();
  drawOverlay();
}

// ---------------------------------------------------------------
// 6) Game-Loop
// ---------------------------------------------------------------
// Statt setInterval(step, state.tickMs) (feste Rate, die der Browser nur "ungefaehr" einhaelt -
// je nach Auslastung des Tabs kommt ein Tick mal ein paar Millisekunden zu spaet, was sich als
// gelegentliches kurzes Ruckeln bemerkbar macht) verwenden wir einen SELBSTKORRIGIERENDEN
// setTimeout-Loop: er merkt sich den Zeitpunkt, zu dem der naechste Tick EIGENTLICH faellig waere
// (expectedTickTime), und zieht eine etwaige Verspaetung (drift) von der naechsten Wartezeit ab.
// So bleibt die Raupe im Mittel exakt beim eingestellten Tempo, auch wenn einzelne Ticks durch
// kurze Aussetzer (z. B. Tab kurz im Hintergrund beschaeftigt) etwas zu spaet kommen - sie holt
// die verlorene Zeit beim naechsten Tick wieder auf, statt den Fehler aufzusummieren. Bewusst
// weiterhin EIN einfacher Timer (kein requestAnimationFrame) - das Konzept will hier bewusst das
// einfachere Modell "ein Tick = ein Zeitgeber", nur eben mit Ausgleich statt blindem Vertrauen in
// die Timer-Genauigkeit.
let loopActive = false;
let timeoutId = null;
let expectedTickTime = 0;   // Zeitpunkt (performance.now()), zu dem der naechste Tick faellig ist

function updateScore() {
  scoreEl.textContent = 'Punkte: ' + state.score;
}

function updateInfo() {
  const modeLabel = state.mode === 'goal' ? ('Goal ' + (state.goalTarget !== null ? state.goalTarget : '?')) : 'Endless';
  infoEl.textContent =
    'Phase: ' + state.phase + ' · Tick ' + state.tick + ' · ' + state.tickMs + ' ms/Schritt · Punkte: ' + state.score +
    ' · Mode: ' + modeLabel + (state.villainEnabled ? ' · Villain' : '');
}

// Zeigt an, welcher Modus aktuell gewaehlt ist (nur auf dem Startbildschirm relevant), und blendet
// das Zielwert-Feld nur im Ziel-Modus ein. Bewusst per style statt classList umgesetzt (einfacher,
// keine zusaetzliche CSS-Klasse noetig).
function updateModeButtons() {
  const isGoal = state.mode === 'goal';
  modeEndlessBtn.style.opacity = isGoal ? '0.55' : '1';
  modeGoalBtn.style.opacity = isGoal ? '1' : '0.55';
  goalInputWrap.style.display = isGoal ? 'flex' : 'none';
}

function setMode(mode) {
  state.mode = mode;
  goalError.textContent = '';
  updateModeButtons();
}

// Zeigt/versteckt Start- bzw. Endbildschirm-Bereich je nach Spielphase, und setzt die jeweiligen
// Status-Texte/Button-Beschriftungen. Wird ueberall dort aufgerufen, wo sich die Phase aendern
// kann (siehe startLoop/stopLoop/step/resetGame unten).
function updateButtons() {
  const phase = state.phase;
  const showCenter = phase === 'ready' || phase === 'over' || phase === 'won';
  centerOverlay.style.display = showCenter ? 'flex' : 'none';
  readyControls.style.display = phase === 'ready' ? 'flex' : 'none';
  endControls.style.display = (phase === 'over' || phase === 'won') ? 'flex' : 'none';

  if (phase === 'ready') {
    overlayStatus.textContent = 'Bereit?';
    updateModeButtons();
  } else if (phase === 'over') {
    endStatus.textContent = 'Game Over · ' + state.score + ' Punkte';
    restartBtn.textContent = 'Neustart';
  } else if (phase === 'won') {
    endStatus.textContent = 'Goal reached! Score: ' + state.score;
    restartBtn.textContent = 'Restart';
  }

  const showPause = phase === 'running' || phase === 'paused';
  pauseBtn.style.display = showPause ? 'inline-block' : 'none';
  pauseBtn.textContent = phase === 'paused' ? 'Weiter' : 'Pause';
}

function step() {
  update();
  draw();
  updateScore();
  updateInfo();
  updateButtons();
}

// Fuehrt genau einen Tick aus und plant danach - falls der Loop noch laeuft - den naechsten,
// mit einer Wartezeit, die eine etwaige Verspaetung des VORHERIGEN Ticks schon ausgleicht.
function runTick() {
  expectedTickTime += state.tickMs;
  step();
  if (loopActive) scheduleNextTick();
}

function scheduleNextTick() {
  const drift = performance.now() - expectedTickTime;   // > 0, wenn wir bereits im Verzug sind
  const delay = Math.max(0, state.tickMs - drift);
  timeoutId = setTimeout(runTick, delay);
}

function startLoop() {
  if (loopActive) return;
  loopActive = true;
  expectedTickTime = performance.now();
  scheduleNextTick();
  updateInfo();
  updateButtons();
}

function stopLoop() {
  if (!loopActive) return;
  loopActive = false;
  clearTimeout(timeoutId);
  timeoutId = null;
  updateInfo();
  updateButtons();
}

function togglePause() {
  if (state.phase === 'running') {
    state.phase = 'paused';
    stopLoop();
    draw();
  } else if (state.phase === 'paused') {
    state.phase = 'running';
    startLoop();
  }
}

// ---------------------------------------------------------------
// 7) Ereignisse (Tastatur + Swipe + Buttons - alle rufen dieselben Funktionen auf)
// ---------------------------------------------------------------
document.addEventListener('keydown', function (e) {
  const dir = DIR_KEYS[e.code];
  const isSpace = e.code === 'Space';
  if (!dir && !isSpace) return;

  e.preventDefault();     // verhindert Scrollen der Seite, auch bei Pfeiltasten
  if (e.repeat) return;   // gehaltene Taste soll nicht mehrfach auslösen

  if (dir) {
    handleDirectionInput(dir);
  } else if (state.phase === 'over' || state.phase === 'won') {
    resetGame();
  } else if (state.phase !== 'ready') {
    togglePause();
  }
});

// Modus-Auswahl: nur auf dem Startbildschirm relevant (waehrend eines laufenden Spiels sind die
// Buttons ohnehin versteckt, siehe updateButtons()).
modeEndlessBtn.addEventListener('click', function () { setMode('endless'); });
modeGoalBtn.addEventListener('click', function () { setMode('goal'); });

// Start-, Neustart- und Pause-Button: dieselben Funktionen wie Tastatur/Swipe, nur ein anderer
// Ausloeser. "Start" liest zusaetzlich die auf dem Startbildschirm gewaehlten Einstellungen
// (Modus, Zielwert, Boesewicht) und uebernimmt sie erst jetzt in den state - bis zum Klick auf
// Start kann also noch alles geaendert werden, ohne ein laufendes Spiel zu beeinflussen.
startBtn.addEventListener('click', function () {
  if (state.phase !== 'ready') return;

  if (state.mode === 'goal') {
    const raw = parseInt(goalInput.value, 10);
    if (!Number.isInteger(raw) || raw < 1 || raw > MAX_GOAL_TARGET) {
      goalError.textContent = 'Please enter a whole number between 1 and ' + MAX_GOAL_TARGET + '.';
      return;
    }
    goalError.textContent = '';
    state.goalTarget = raw;
  } else {
    state.goalTarget = null;
  }
  state.villainEnabled = !!villainCheckbox.checked;

  handleDirectionInput(state.dir);
});
restartBtn.addEventListener('click', function () {
  if (state.phase === 'over' || state.phase === 'won') resetGame();
});
pauseBtn.addEventListener('click', function () {
  togglePause();
});

// Swipe-Steuerung: Die Richtung wird schon WAEHREND der Bewegung erkannt (touchmove), nicht erst
// beim Loslassen (touchend). Bei hohem Tempo bleibt sonst kaum Zeit zwischen Tick und Reaktion.
// Nach jeder erkannten Richtung wird der Referenzpunkt zurueckgesetzt, damit sich innerhalb
// derselben Beruehrung (ohne loszulassen) noch weitere Richtungswechsel erkennen lassen.
let touchRef = null;          // wird nach jedem erkannten Wisch aktualisiert
let sawSwipeThisTouch = false;

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  touchRef = { x: t.clientX, y: t.clientY };
  sawSwipeThisTouch = false;
}, { passive: false });

canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();   // verhindert Scrollen/Ziehen der Seite waehrend des Wischens
  if (!touchRef || e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - touchRef.x;
  const dy = t.clientY - touchRef.y;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  const threshold = sawSwipeThisTouch ? SWIPE_CONTINUE_PX : SWIPE_MIN_PX;
  if (Math.max(absDx, absDy) < threshold) return;   // noch keine ausreichende Bewegung

  const dir = absDx > absDy
    ? { x: dx > 0 ? 1 : -1, y: 0 }
    : { x: 0, y: dy > 0 ? 1 : -1 };
  handleDirectionInput(dir);
  sawSwipeThisTouch = true;
  touchRef = { x: t.clientX, y: t.clientY };   // ab hier neu messen
}, { passive: false });

canvas.addEventListener('touchend', function (e) {
  e.preventDefault();
  touchRef = null;
  sawSwipeThisTouch = false;
}, { passive: false });

// Tab im Hintergrund oder Bildschirm gesperrt: anhalten, nicht automatisch weiterlaufen.
// Die Phase wird jetzt mitgesetzt (nicht nur der Timer gestoppt), sonst würde eine Eingabe
// nach dem Zurückkommen sofort weiterlaufen, ohne dass "Pause" sichtbar war.
document.addEventListener('visibilitychange', function () {
  if (document.hidden && state.phase === 'running') {
    state.phase = 'paused';
    stopLoop();
  }
});

window.addEventListener('resize', function () {
  setupCanvas();   // Pixeldichte kann sich beim Zoomen ändern
  draw();
});

// ---------------------------------------------------------------
// 8) Start
// ---------------------------------------------------------------
function resetGame() {
  stopLoop();
  state.snake = [
    { x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }, { x: 5, y: 10 }
  ];
  state.dir = { x: 1, y: 0 };
  state.nextDir = { x: 1, y: 0 };
  state.tick = 0;
  state.score = 0;
  state.phase = 'ready';
  state.food = null;
  state.tickMs = START_TICK_MS;
  state.villain = null;
  state.villainCooldown = 0;
  // state.mode/goalTarget/villainEnabled bewusst NICHT zurueckgesetzt: das sind die auf dem
  // Startbildschirm gewaehlten Einstellungen, die beim naechsten Klick auf Start ohnehin frisch
  // aus den Bedienelementen (goalInput/villainCheckbox) uebernommen werden (siehe oben).
  spawnFood();
  draw();
  updateScore();
  updateInfo();
  updateButtons();
}

function init() {
  setupCanvas();
  resetGame();
}

init();
</script>
</body>
</html>
