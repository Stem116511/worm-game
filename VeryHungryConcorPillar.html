<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Very Hungry ConcorPillar</title>
<style>
  :root {
    --page-bg: #f6f1e7;
    --text: #2f3d2c;
    --board-border: #8fae6b;
    /* Zwei zusaetzliche Konturringe ganz aussen um den Rand (Wunsch: Rand soll gut sichtbar sein) -
       gleiche Breite wie die bestehende gruene Kontur (4px). Violett bewusst identisch mit dem
       Boesewicht-Koerper (COLORS.villain.body.base = #7c3fb0 im Script weiter unten) gewaehlt, statt
       eine neue Farbe zu erfinden - sag Bescheid, falls dir ein anderer Ton lieber waere.       */
    --board-border-outer1: #ffffff;
    --board-border-outer2: #7c3fb0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page-bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 { margin: 0; font-size: 1.4rem; }
  #score { margin: 0; font-size: 1rem; font-weight: 600; }

  #boardWrap {
    position: relative;
    width: min(94vw, 68vh, 560px);
    aspect-ratio: 1 / 1;
    /* Reserviert echten Platz im Layout fuer die beiden zusaetzlichen Konturringe (siehe #board
       box-shadow) - sonst wuerden sie ueber H1/Buttons ueberlappen statt sauber Abstand zu halten. */
    margin: 8px;
  }
  #board {
    display: block;
    width: 100%;
    height: 100%;
    border: 4px solid var(--board-border);
    border-radius: 12px;
    touch-action: none;
    /* Zwei weitere Ringe AUSSERHALB der bestehenden gruenen Kontur, per box-shadow (kein
       zusaetzliches HTML-Element noetig): je 4px breit, wie gewuenscht gleich breit wie die gruene
       Kontur - zuerst weiss (direkt aussen an gruen), danach violett ganz aussen. Bei mehreren
       box-shadow-Werten liegt der ZUERST genannte oben, deshalb weiss vor violett listen, sonst
       wuerde violett den weissen Ring komplett verdecken. */
    box-shadow: 0 0 0 4px var(--board-border-outer1), 0 0 0 8px var(--board-border-outer2);
  }

  /* Buttons: bewusst schlicht, wie die uebrigen Overlays - der Stil kommt erst im Woche-2-Abgleich */
  .game-btn {
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    padding: 10px 24px;
    border: none;
    border-radius: 10px;
    background: var(--board-border);
    color: #1f2a1c;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .game-btn:active { filter: brightness(0.9); }
  .mode-btn { padding: 8px 16px; font-size: 0.9rem; }

  /* Zentriertes Overlay auf dem Canvas fuer Startbildschirm (ready) und Endbildschirm (over/won).
     pointer-events:none auf dem Container, damit er ausserhalb des Panels nichts blockiert -
     das Panel selbst holt sich pointer-events per Regel unten zurueck. */
  #centerOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #centerOverlay .panel {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: rgba(47, 61, 44, 0.85);
    color: #f6f1e7;
    padding: 16px 22px;
    border-radius: 14px;
    max-width: min(86vw, 380px);
  }
  #overlayStatus, #endTitle { margin: 0; font-weight: 700; font-size: 1.05rem; text-align: center; }
  #endLine1, #endLine2 { margin: 0; font-size: 0.95rem; text-align: center; }
  #endScore { margin: 0; font-size: 0.8rem; opacity: 0.85; text-align: center; }

  /* Neu in Paket 4: Startbildschirm-Einstellungen (Modus, Zielwert, Boesewicht). Bewusst als
     eigener Block, damit er sich unabhaengig vom Endbildschirm ein-/ausblenden laesst (siehe
     updateButtons()). */
  #readyControls, #endControls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #modeSelect { display: flex; gap: 8px; }
  #goalInputWrap { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; }
  #goalInputWrap input[type="number"] {
    width: 64px;
    padding: 6px 8px;
    border-radius: 8px;
    border: none;
    font: inherit;
  }
  #goalError { margin: 0; font-size: 0.8rem; color: #ffb4b4; min-height: 1em; text-align: center; }
  #villainLabel { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; cursor: pointer; }

  /* Fester Platz unter dem Feld fuer den Pause/Weiter-Button, damit nichts springt,
     wenn er ein-/ausgeblendet wird. */
  #controls { min-height: 48px; display: flex; align-items: center; justify-content: center; }
  #pauseBtn { display: none; }

  #hint { margin: 0; font-size: 0.85rem; opacity: 0.75; text-align: center; }
  /* Entwicklerzeile: vor dem Anlass komplett entfernen */
  #info { margin: 0; font: 12px ui-monospace, Consolas, monospace; opacity: 0.55; text-align: center; }
</style>
</head>
<body>
  <h1>The Very Hungry ConcorPillar</h1>
  <p id="score"></p>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="centerOverlay">
      <div class="panel">
        <div id="readyControls">
          <p id="overlayStatus"></p>
          <div id="modeSelect">
            <button type="button" id="modeEndlessBtn" class="game-btn mode-btn">Endless</button>
            <button type="button" id="modeGoalBtn" class="game-btn mode-btn">Goal</button>
          </div>
          <div id="goalInputWrap">
            <label for="goalInput">Target:</label>
            <input type="number" id="goalInput" min="1" max="200" step="1" value="50">
          </div>
          <p id="goalError"></p>
          <label id="villainLabel"><input type="checkbox" id="villainCheckbox"> Villain</label>
          <button id="startBtn" class="game-btn" type="button">Start</button>
        </div>
        <div id="endControls">
          <p id="endTitle"></p>
          <p id="endLine1"></p>
          <p id="endLine2"></p>
          <p id="endScore"></p>
          <button id="restartBtn" class="game-btn" type="button">Retry</button>
        </div>
      </div>
    </div>
  </div>
  <div id="controls">
    <button id="pauseBtn" class="game-btn" type="button">Take a Break!</button>
  </div>
  <p id="hint">Pfeiltasten/WASD oder Wischen steuern · Start/Pause/Neustart per Button oder Leertaste</p>
  <p id="info"></p>

<script>
'use strict';

// ---------------------------------------------------------------
// 1) Konstanten
// ---------------------------------------------------------------
const GRID = 20;               // 20 x 20 Felder
const CELL = 24;               // logische Pixel pro Feld
const BOARD_PX = GRID * CELL;  // 480 x 480 logische Pixel (reines Spielfeld-Raster, unveraendert -
                                // Kollision/Spawn-Logik rechnet weiterhin ausschliesslich hiermit)

// Sicherheitsrand rund um das Spielfeld-Raster (nur fuer's Zeichnen, siehe draw() weiter unten).
// Hintergrund: Boesewicht (VILLAIN_RADIUS_FACTOR) und Futter-Icons (FOOD_ICON_SIZE_FACTOR) sind
// bewusst groesser als eine Zelle und duerfen ueber die Zellgrenze hinausragen (siehe Kommentare
// dort) - stehen sie dabei in einer Rand-Zelle, wurden Hoernchen/Arme bisher an der Canvas-Kante
// hart abgeschnitten (per Definition eines <canvas>: alles ausserhalb der Bitmap-Flaeche wird nicht
// gezeichnet, das laesst sich nicht per CSS umgehen). Per Playwright-Pixelmessung (siehe Chat)
// ragt der Boesewicht in einer Rand-Zelle max. ~22px ueber die Spielfeld-Kante hinaus (Hoernchen
// nach oben) - CANVAS_MARGIN daher grosszuegig auf 1.5 Zellen gesetzt, mit etwas Puffer fuer
// zukuenftige Elemente (z. B. den geplanten Schmetterling).
const CANVAS_MARGIN = CELL * 1.5;    // 36px bei CELL=24
const CANVAS_PX = BOARD_PX + CANVAS_MARGIN * 2;  // Gesamte Zeichenflaeche inkl. Rand (552px)

// Tempo: Startwert, Untergrenze und Beschleunigung pro Futter an einer Stelle.
// Alle drei Werte sind Richtwerte aus dem Konzept und NICHT mit Testpersonen geprueft -
// siehe Testliste. Feinjustierung folgt, sobald ein paar Ungeuebte das Spiel probiert haben.
const START_TICK_MS = 250;     // Dauer eines Schritts beim Spielstart (langsamer als die 150 ms der Woche-1-Demo)
const MIN_TICK_MS = 90;        // schnellste erlaubte Geschwindigkeit (Untergrenze, wird nie unterschritten)
const TICK_MS_STEP = 6;        // um so viel wird ein Schritt pro gefressenem Futter kuerzer

// Mindest-Wischstrecke in echten Pixeln. Die ERSTE Bewegung einer Beruehrung braucht die volle
// Strecke (SWIPE_MIN_PX) - sonst wuerde ein blosses Tippen als Wisch zaehlen. JEDE WEITERE
// Richtungsaenderung, waehrend der Finger noch aufliegt, braucht nur noch SWIPE_CONTINUE_PX -
// das Tipp-Risiko besteht dann nicht mehr, weil schon eine echte Bewegung im Gange ist. Das macht
// schnelle Kehren (z. B. hoch -> links -> runter in einem Zug, ohne loszulassen) deutlich leichter.
const SWIPE_MIN_PX = 18;
const SWIPE_CONTINUE_PX = 9;

// Neu in Paket 4: Zielwert-Obergrenze fuer den Ziel-Modus (offener Punkt aus dem Konzept).
// Bei 1 Punkt/Futter und GRID*GRID=400 Feldern sind rechnerisch max. 395 moeglich (5 Startsegmente
// sind schon belegt). 200 ist bewusst kleiner gewaehlt, damit ein Ziel in vertretbarer Zeit
// erreichbar bleibt - ein Vorschlag von Claude, noch nicht mit Testpersonen abgeglichen.
const MAX_GOAL_TARGET = 200;

// Boesewicht: Erscheinungswahrscheinlichkeit pro Tick, Lebensdauer und Abklingzeit danach.
// Wie bei den Tempo-/Wisch-Werten: Richtwerte, noch nicht mit Testpersonen geprueft.
const VILLAIN_SPAWN_CHANCE = 0.02;   // pro Tick, wenn gerade keiner da ist und keine Abklingzeit laeuft
const VILLAIN_LIFETIME_TICKS = 25;   // so lange bleibt er sichtbar, bevor er von selbst verschwindet
const VILLAIN_COOLDOWN_TICKS = 20;   // Pause nach dem Verschwinden, bevor er erneut erscheinen kann

// Radius der Koerperglieder relativ zu CELL, aus der Stilprobe uebernommen (siehe
// stilprobe-raupe-bestaetigt.md). Bewusst groesser als CELL/2, damit sich benachbarte Glieder
// ueberlappen und keine Luecken zwischen ihnen entstehen (siehe Konzept, Abschnitt "Gewuenschter
// Stil"). Der Kopf ist zusaetzlich etwas groesser (+0.06).
const SNAKE_RADIUS_FACTOR = 0.56;

// Radius-Faktor des Boesewicht-Koerpers relativ zu CELL - aus der bestaetigten Stilprobe
// uebernommen (siehe stilprobe-villain.html, per SendUserFile an Marco geliefert). Iterativ auf
// Wunsch zweimal vergroessert (0.46 -> 0.6 -> 0.75), damit die Figur neben Raupenkopf
// (SNAKE_RADIUS_FACTOR + 0.06 = 0.62) und den Futter-Icons (FOOD_ICON_SIZE_FACTOR 1.75) nicht zu
// klein wirkt. Betrifft NUR die Zeichengroesse, nicht die Kollisionserkennung (siehe update():
// die prueft weiterhin exakte Gitter-Zellen-Gleichheit, unabhaengig vom Zeichenradius) - wie bei
// den Futter-Icons ist die sichtbare Figur bewusst groesser als ihr Kollisionsfeld.
const VILLAIN_RADIUS_FACTOR = 0.75;

// Farbpalette: Board-Hintergrund unveraendert, Raupen-Farben aus der von Marco bestaetigten
// Stilprobe uebernommen (siehe stilprobe-raupe-bestaetigt.md) - ersetzt die bisherigen
// Platzhalter-Flaechenfarben (bodyA/bodyB/head als einzelne Hex-Werte) durch Farbverlaufs-Objekte
// {hi, base, lo}, die bodyFill() fuer die Kugel-Wirkung braucht. food-Unterobjekt aus
// stilprobe-futter-bausteine.md, fuer die drei bereits gestalteten Futter-Icons (Pizza, Eis, Bier).
// villain-Unterobjekt (neu): aus der bestaetigten Boesewicht-Stilprobe (stilprobe-villain.html) -
// ersetzt den bisherigen einzelnen Platzhalter-Hex-Wert. outline/hornOutline/toothOutline/
// swordOutline der Stilprobe waren dort alle identisch ('#2a1033') und wurden deshalb hier zu
// einem gemeinsamen villain.outline zusammengefasst (kleine bewusste Vereinfachung beim Uebertrag,
// keine optische Aenderung). appleOutline/stem/leaf der Stilprobe entsprachen exakt den bereits
// vorhandenen food.o/food.meatball/food.basil-Werten - deshalb beim Uebertrag direkt auf food.*
// verwiesen statt sie nochmals zu duplizieren (siehe drawVillainApple() weiter unten).
const COLORS = {
  boardA: '#e4edcf',
  boardB: '#d9e5bd',
  // Farbe des neuen Sicherheitsrands (CANVAS_MARGIN) rund um das Karo-Raster - identisch mit der
  // Seiten-Hintergrundfarbe (CSS-Variable --page-bg), damit der Rand optisch mit der Seite
  // verschmilzt statt als zusaetzlicher sichtbarer Rahmen aufzufallen. Feinschliff (z. B. ein
  // sanfter Farbverlauf zum Karo hin) bewusst zurueckgestellt, siehe Reflexion im Chat.
  canvasMargin: '#f6f1e7',
  shadow: 'rgba(47, 61, 44, 0.28)',
  outline: '#2f5f2c',            // gruene Kontur der Koerperglieder (nicht Kopf/Fuehler-Spitzen)
  bands: [
    { hi: '#a9e290', base: '#6dbf5a', lo: '#3f8f3a' },
    { hi: '#94d47b', base: '#58ab48', lo: '#358030' }
  ],
  head: { hi: '#ff9c86', base: '#e6432f', lo: '#a8241c' },
  redOutline: '#33090a',         // sehr dunkles Rot: Kontur von Kopf, Kopf-Dreieck und Fuehler-Kugeln
  antenna: { stroke: '#1a1a1a', tip: { hi: '#c2453a', base: '#8f1d16', lo: '#5c0f0a' } },
  eyeWhite: '#ffffff',
  eyePupil: '#1f2a1c',
  lash: '#000000',
  cheek: 'rgba(226, 84, 138, 0.8)',
  dot: 'rgba(255, 255, 255, 0.6)',
  morphoBlue: '#1f5fe0',         // reserviert für den Schmetterling am Ende des Ziel-Modus
  villain: {
    body: { hi: '#c9a6ff', base: '#7c3fb0', lo: '#43195e' },
    outline: '#2a1033',
    horn: { hi: '#9a6fd6', base: '#5b2a86', lo: '#301048' },
    brow: '#1a0e22',
    tooth: '#fff8ec',
    apple: { hi: '#ff8a75', base: '#e2402b', lo: '#8f1d16' },
    swordMetal: { hi: '#f2eef8', base: '#b9b2cc', lo: '#635c78' },
    swordHilt: '#4a2a16'
  },
  food: {
    o: '#4a2a16',
    crustHi: '#f0c878', crust: '#d49a3a',
    cheeseHi: '#ffe58f', cheese: '#f3c44e',
    pep: '#c9302a',
    coneHi: '#ecc383', cone: '#c98f45',
    scoopHi: '#ffd6e4', scoop: '#f4a3bf', seed: '#d94f7d',
    beerHi: '#ffdc6b', beer: '#ee9f1a',
    foam: '#fffaf0', foamLo: '#efe2c4',
    // Spaghetti
    plateHi: '#fffdf7', plate: '#e6ddc4',
    sauceHi: '#e2624a', sauce: '#b23a26',
    pastaHi: '#ffe17a', pasta: '#d99a2e',
    meatballHi: '#8a5a3c', meatball: '#5c3820',
    basil: '#4b7a3a',
    // Aperol
    aperolHi: '#ffb066', aperol: '#f2701a',
    orangeFlesh: '#ffcf7a', orangePith: '#e8832a',
    // Sushi
    riceHi: '#fffdf6', rice: '#efe6cc',
    noriHi: '#3d5136', nori2: '#1f2e1a',
    fillingHi: '#ff9d84', filling: '#e8735a',
    // Ramen
    bowlHi: '#8a3a2e', bowl: '#5c1f18',
    brothHi: '#ffdca0', broth: '#e8a23a',
    noodle: '#f7e2a0',
    eggWhite: '#fffdf5', eggYolk: '#f5a623',
    nori: '#2f4a2a', onion: '#5fae4a',
    // Banane
    bananaHi: '#fff3a0', banana: '#f4cf3c', bananaTip: '#8a6a2a',
    // Gummibaerchen
    gummyHi: '#ff9d8a', gummy: '#e2432f'
  },
  // Wiesen-Deko im Sicherheitsrand (CANVAS_MARGIN, siehe unten) - aus der bestaetigten Stilprobe
  // stilprobe-rahmen-pflanzen.html uebernommen. Eigene, von COLORS.bands (Raupe) ENTKOPPELTE
  // Gruentoene, damit ein spaeteres Nachjustieren der Wiese nicht versehentlich die Raupe
  // mitveraendert. Bewusst gedaempft/pastellig gehalten (mehrere Iterationen mit Marco), damit die
  // Wiese als ruhiger Rahmen wirkt statt Aufmerksamkeit vom Spielfeld abzuziehen - Kontur deshalb
  // auch etwas weicher (olivgruen) statt des kraeftigen COLORS.outline.
  meadow: {
    outline: '#5c6a4f',
    greens: [
      { hi: '#e6f2cf', base: '#c6dea1', lo: '#98bd77' },
      { hi: '#daedbf', base: '#b8d597', lo: '#8cb56c' }
    ],
    strawHi: '#ece0bf', straw: '#d3c294', strawLo: '#ab9b6c',
    cloverHi: '#ddedd8', clover: '#b3d0ad', cloverLo: '#87ae81',
    petalHi: '#f3dde3', petal: '#dcb9c4', petalLo: '#b98f9c',
    dotFlowerCol: '#fbf8ee', dotFlowerCenter: '#e6d3a3',
    starHi: '#f0e8c8', star: '#d9c896', starLo: '#b3a26e',
    bellHi: '#dde1ee', bell: '#b3bbdb', bellLo: '#8a92b8'
  }
};

// Finale Futter-Liste aus dem Konzept. Alle neun Sorten haben jetzt ein bestaetigtes SVG-Icon
// (Feld "art", siehe stilprobe-futter-bausteine.md) - "color" bleibt als reiner Notfall-Fallback
// stehen (siehe drawFood(): greift nur, wenn foodImages[art] aus irgendeinem Grund fehlt). Lasagne
// wurde in der Stilprobe durch Spaghetti ersetzt (Marco: "das ist einfacher zu zeichnen").
// Spielmechanisch sind alle Sorten weiterhin gleichwertig (siehe Konzept) - reine visuelle
// Abwechslung.
const FOOD = [
  { name: 'Spaghetti',    color: '#d99a2e', art: 'spaghetti' },
  { name: 'Ramen',        color: '#e0a53a', art: 'ramen' },
  { name: 'Pizza',        color: '#d9382e', art: 'pizza' },
  { name: 'Banane',       color: '#f4d03f', art: 'banana' },
  { name: 'Gummibärchen', color: '#e2432f', art: 'gummyBear' },
  { name: 'Erdbeer-Eis',  color: '#f7a8c0', art: 'iceCream' },
  { name: 'Sushi',        color: '#e8735a', art: 'sushi' },
  { name: 'Aperol',       color: '#f2701a', art: 'aperol' },
  { name: 'Bier',         color: '#f0b323', art: 'beer' }
];

// Tastenzuordnung: Pfeiltasten und WASD, unabhängig vom Tastaturlayout (e.code statt e.key)
const DIR_KEYS = {
  ArrowUp: { x: 0, y: -1 },  KeyW: { x: 0, y: -1 },
  ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }
};

// ---------------------------------------------------------------
// 1b) Futter-Icons als eingebettete SVGs (Pizza, Erdbeer-Eis, Bier)
// ---------------------------------------------------------------
// Uebernommen 1:1 aus der bestaetigten Stilprobe (stilprobe-futter-bausteine.md) - bewusst nicht
// neu gebaut. Jede Funktion baut einen SVG-Text, der per data:-URI als <img> geladen wird
// (loadImage) und danach beliebig oft mit drawImage() gezeichnet werden kann, ohne bei jedem
// Frame neu als SVG geparst zu werden.
function svgWrap(defs, body) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">' +
    '<defs>' + defs + '</defs>' + body + '</svg>';
}
function grad(id, hi, lo) {
  return '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="' + hi + '"/><stop offset="1" stop-color="' + lo + '"/></linearGradient>';
}
function circ(cx, cy, r, fill, stroke, sw) {
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"' +
    (stroke ? ' stroke="' + stroke + '" stroke-width="' + sw + '"' : '') + '/>';
}

function pizzaSvg(f) {
  return svgWrap(
    grad('gc', f.cheeseHi, f.cheese) + grad('gr', f.crustHi, f.crust),
    '<path d="M5.5 9 L26.5 9 L16 29 Z" fill="url(#gc)" stroke="' + f.o + '" stroke-width="1.6" stroke-linejoin="round"/>' +
    '<rect x="4" y="5" width="24" height="5.5" rx="2.75" fill="url(#gr)" stroke="' + f.o + '" stroke-width="1.6"/>' +
    circ(12, 15, 2.6, f.pep, f.o, 0.9) +
    circ(19.5, 15.5, 2.6, f.pep, f.o, 0.9) +
    circ(15.7, 21.5, 2.3, f.pep, f.o, 0.9)
  );
}

function iceCreamSvg(f) {
  // Waffel-Karomuster: zwei Scharen diagonaler Linien, per clipPath auf das Kegel-Dreieck begrenzt.
  let hatch = '';
  for (let o = -8; o <= 14; o += 5) {
    hatch += '<line x1="' + (8 + o) + '" y1="14" x2="' + (24 + o) + '" y2="30" stroke="' + f.o + '" stroke-width="0.9" opacity="0.7"/>';
    hatch += '<line x1="' + (24 - o) + '" y1="14" x2="' + (8 - o) + '" y2="30" stroke="' + f.o + '" stroke-width="0.9" opacity="0.7"/>';
  }
  // Wolkenfoermige/gewellte Unterkante der Kugel: 4 kleine Kreise ("Scallops"), NACH dem grossen
  // Kugelkreis gezeichnet, so dass sie sichtbar ueber den Kugelrand reichen/ihn ueberlappen.
  const bumpR = 2.6;
  const bumpY = 14.4;
  const bumpXs = [10.2, 14.1, 17.9, 21.8];
  let scoopBumps = '';
  for (const bx of bumpXs) {
    scoopBumps += circ(bx, bumpY, bumpR, 'url(#gs)', f.o, 1.6);
  }
  return svgWrap(
    grad('gk', f.coneHi, f.cone) + grad('gs', f.scoopHi, f.scoop) +
    '<clipPath id="coneClip"><path d="M10 15 L22 15 L16 30 Z"/></clipPath>',

// Baut alle Futter-Icons einmal beim Start und legt sie unter ihrem "art"-Schluessel ab
// (siehe FOOD-Liste oben und drawFood() weiter unten). Muss abgewartet werden, bevor das erste
// Bild gezeichnet wird - siehe init() ganz am Ende der Datei.
const FOOD_ART_BUILDERS = {
  pizza: pizzaSvg, iceCream: iceCreamSvg, beer: beerSvg,
  spaghetti: spaghettiSvg, aperol: aperolSvg, sushi: sushiSvg,
  ramen: ramenSvg, banana: bananaSvg, gummyBear: gummyBearSvg
};
let foodImages = {};

function loadImage(svg) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = function () { reject(new Error('Ein Futter-Icon konnte nicht geladen werden.')); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

function preloadFoodImages() {
  const keys = Object.keys(FOOD_ART_BUILDERS);
  return Promise.all(keys.map(function (key) {
    return loadImage(FOOD_ART_BUILDERS[key](COLORS.food)).then(function (img) {
      foodImages[key] = img;
    });
  }));
}

// ---------------------------------------------------------------
// 2) Zustand (alles, was sich im Spiel ändert, liegt hier)
// ---------------------------------------------------------------
const state = {
  snake: [],                   // Feld-Koordinaten, Index 0 = Kopf
  dir: { x: 1, y: 0 },         // Richtung, die im aktuellen Tick tatsächlich angewendet wird
  nextDir: { x: 1, y: 0 },     // durch Tastendruck/Wisch vorgemerkte Richtung, wird zu Beginn des nächsten Tick übernommen
  tick: 0,                     // Anzahl bisheriger Spielschritte
  score: 0,                    // Anzahl gefressenes Futter
  phase: 'ready',              // 'ready' | 'running' | 'paused' | 'over' | 'won'
  food: null,                  // { x, y, type } - type ist der Index in FOOD
  tickMs: START_TICK_MS,       // aktuelle Geschwindigkeit (sinkt mit dem Score bis MIN_TICK_MS)
  mode: 'endless',              // 'endless' | 'goal' - auf dem Startbildschirm gewaehlt
  goalTarget: null,             // Zielwert im Ziel-Modus (null im Endlos-Modus)
  villainEnabled: false,        // Checkbox auf dem Startbildschirm
  villain: null,                // { x, y, ticksLeft } oder null, wenn gerade keiner da ist
  villainCooldown: 0,           // Ticks, bis der Boesewicht wieder erscheinen darf
  overReason: null              // 'wall' | 'self' | 'villain' - warum gameOver() ausgeloest wurde,
                                 // bestimmt den Text auf dem Endbildschirm (siehe updateButtons())
