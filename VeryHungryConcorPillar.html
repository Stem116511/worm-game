// ---------------------------------------------------------------
// 4) Spiellogik (pro Tick genau ein Schritt)
// ---------------------------------------------------------------

function isOpposite(a, b) {
  return a.x === -b.x && a.y === -b.y;
}

// Gemeinsame Richtungseingabe fuer Tastatur UND Swipe (Abschnitt 7 ruft beide Wege hierher).
// Prüft die 180-Grad-Sperre immer gegen die tatsächlich aktive Richtung (state.dir), nie gegen
// eine bereits vorgemerkte state.nextDir - so kann ein zweiter, schneller Steuerbefehl vor dem
// nächsten Tick keine Wende "durchschmuggeln", die in der Summe 180 Grad ergibt.
function handleDirectionInput(dir) {
  if (state.phase === 'over' || state.phase === 'won' || state.phase === 'paused') return;
  if (isOpposite(dir, state.dir)) return;
  state.nextDir = dir;
  if (state.phase === 'ready') {
    state.phase = 'running';
    startLoop();
  }
}

// "extra" (optional): zusaetzliche, momentan belegte Zellen, die neben der Raupe ebenfalls
// gemieden werden sollen (z. B. das Futter beim Boesewicht-Spawn, oder umgekehrt). Neu in Paket 4 -
// vorher gab es nur die Raupe als Einschraenkung.
function randomFreeCell(extra) {
  let cell;
  do {
    cell = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (
    state.snake.some(function (s) { return s.x === cell.x && s.y === cell.y; }) ||
    (extra && extra.some(function (c) { return c.x === cell.x && c.y === cell.y; }))
  );
  return cell;
}

function spawnFood() {
  const extra = state.villain ? [state.villain] : undefined;
  const cell = randomFreeCell(extra);
  state.food = { x: cell.x, y: cell.y, type: Math.floor(Math.random() * FOOD.length) };
}

// "reason" haelt fest, WORAN die Raupe gestorben ist ('wall' | 'self' | 'villain') - der
// Endbildschirm (siehe updateButtons()) zeigt je nach Ursache einen anderen Text.
function gameOver(reason) {
  state.phase = 'over';
  state.overReason = reason;
  stopLoop();
}

// Neu in Paket 4: Ziel-Modus erfolgreich beendet (Zielwert erreicht). Eigener Endzustand statt
// gameOver(), da es kein Verlieren ist - eigener Text/Button-Beschriftung in updateButtons().
function winGame() {
  state.phase = 'won';
  stopLoop();
}

// Boesewicht: erscheint gelegentlich auf einem freien Feld, steht dort still und verschwindet nach
// VILLAIN_LIFETIME_TICKS Ticks von selbst wieder. Danach eine Abklingzeit (VILLAIN_COOLDOWN_TICKS),
// bevor er erneut erscheinen kann - sonst koennte er theoretisch sofort wieder auftauchen. Wird pro
// Tick aus update() aufgerufen, bevor die Kollision fuer diesen Tick geprueft wird.
function updateVillain() {
  if (!state.villainEnabled) return;

  if (state.villain) {
    state.villain.ticksLeft--;
    if (state.villain.ticksLeft <= 0) {
      state.villain = null;
      state.villainCooldown = VILLAIN_COOLDOWN_TICKS;
    }
    return;
  }

  if (state.villainCooldown > 0) {
    state.villainCooldown--;
    return;
  }

  if (Math.random() < VILLAIN_SPAWN_CHANCE) {
    const extra = state.food ? [state.food] : undefined;
    const cell = randomFreeCell(extra);
    state.villain = { x: cell.x, y: cell.y, ticksLeft: VILLAIN_LIFETIME_TICKS };
  }
}

// Nach jedem gefressenen Futter neu berechnen. Aendert sich die Geschwindigkeit tatsaechlich
// und laeuft der Loop gerade, wird er neu gestartet (stopLoop() dann startLoop()) - nie
// laeuft ein zweiter Timer parallel zum ersten.
function applyGrowthSpeedup() {
  const newTickMs = Math.max(MIN_TICK_MS, START_TICK_MS - state.score * TICK_MS_STEP);
  if (newTickMs === state.tickMs) return;
  state.tickMs = newTickMs;
  if (loopActive) {
    stopLoop();
    startLoop();
  }
}

function update() {
  state.dir = state.nextDir;   // vorgemerkte Richtung genau einmal pro Tick übernehmen
  updateVillain();             // Spawn/Despawn zuerst, damit die Kollisionspruefung unten den
                                // fuer DIESEN Tick gueltigen Boesewicht-Zustand verwendet

  const head = state.snake[0];
  const next = { x: head.x + state.dir.x, y: head.y + state.dir.y };

  if (next.x < 0 || next.x >= GRID || next.y < 0 || next.y >= GRID) {
    gameOver('wall');
    return;
  }

  if (state.villainEnabled && state.villain && next.x === state.villain.x && next.y === state.villain.y) {
    gameOver('villain');
    return;
  }

  const willGrow = !!state.food && next.x === state.food.x && next.y === state.food.y;

  // Kollisionsregel Schwanzende: Wächst die Raupe in diesem Schritt nicht, rückt der Schwanz
  // nach - das aktuell letzte Feld wird frei und ein Kopf dorthin ist erlaubt. Deshalb wird das
  // letzte Segment nur dann mitgeprüft, wenn die Raupe wächst (Schwanz bleibt liegen).
  const bodyToCheck = willGrow ? state.snake : state.snake.slice(0, -1);
  if (bodyToCheck.some(function (seg) { return seg.x === next.x && seg.y === next.y; })) {
    gameOver('self');
    return;
  }

  state.snake.unshift(next);
  if (willGrow) {
    state.score++;
    if (state.mode === 'goal' && state.goalTarget !== null && state.score >= state.goalTarget) {
      winGame();
      return;
    }
    spawnFood();
    applyGrowthSpeedup();
  } else {
    state.snake.pop();
  }
  state.tick++;
}

// ---------------------------------------------------------------
// 5) Zeichnen
// ---------------------------------------------------------------

function drawBoard() {
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? COLORS.boardA : COLORS.boardB;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }
}

// Futter-Symbole duerfen bewusst deutlich groesser als ein Feld sein (Wunsch von Marco: der
// Standort auf dem Feld bleibt klar - die Raupe zielt weiterhin exakt auf die Feld-Mitte (cx, cy)
// - aber der gezeichnete Gegenstand selbst darf sichtbar ueber die Feldgrenze hinausragen, damit
// er auf dem Handy-Bildschirm besser erkennbar ist. Nach erster Rueckmeldung ("noch grösser")
// nochmals vergroessert). FOOD_ICON_SIZE_FACTOR gilt fuer die fertigen SVG-Icons,
// FOOD_PLACEHOLDER_RADIUS_FACTOR fuer die noch unfertigen Kreis-Platzhalter.
const FOOD_ICON_SIZE_FACTOR = 1.75;
const FOOD_PLACEHOLDER_RADIUS_FACTOR = 0.62;

function drawFood() {
  if (!state.food) return;
  const food = FOOD[state.food.type];
  const cx = state.food.x * CELL + CELL / 2;
  const cy = state.food.y * CELL + CELL / 2;
  const img = food.art ? foodImages[food.art] : null;

  // Bereits gestaltete Sorten (Pizza/Eis/Bier): fertiges SVG-Icon mit Schatten darunter.
  if (img) {
    ctx.fillStyle = COLORS.shadow;
    ctx.beginPath();
    ctx.ellipse(cx, cy + CELL * 0.62, CELL * 0.5, CELL * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
    const size = CELL * FOOD_ICON_SIZE_FACTOR;
    ctx.drawImage(img, cx - size / 2, cy - size / 2 - CELL * 0.07, size, size);
    return;
  }

  // Noch nicht gestaltete Sorten: unveraenderter Platzhalter (einfarbiger Kreis + Glanzpunkt),
  // bis sie in einer spaeteren Stilprobe-Runde ein eigenes Icon bekommen.
  ctx.fillStyle = food.color;
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * FOOD_PLACEHOLDER_RADIUS_FACTOR, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';   // kleiner Glanzpunkt
  ctx.beginPath();
  ctx.arc(cx - CELL * 0.2, cy - CELL * 0.2, CELL * 0.15, 0, Math.PI * 2);
  ctx.fill();
}

// Radialer Farbverlauf (hell oben links, dunkler zum Rand) fuer die Kugel-Wirkung der
// Koerperglieder, des Kopfs und der Fuehler-Spitzen - aus der bestaetigten Stilprobe uebernommen.
// Wird jetzt auch vom Boesewicht-Design (drawVillain() und Helfer weiter unten) wiederverwendet.
function bodyFill(cx, cy, r, col) {
  const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.08, cx, cy, r);
  g.addColorStop(0, col.hi);
  g.addColorStop(0.55, col.base);
  g.addColorStop(1, col.lo);
  return g;
}

// ---------------------------------------------------------------
// 5b) Boesewicht: eigenstaendiges Design (aus der bestaetigten Stilprobe stilprobe-villain.html
// uebernommen, siehe COLORS.villain oben) - ersetzt den bisherigen Platzhalter (einfacher
// dunkler Kreis mit zwei weissen Augen).
// ---------------------------------------------------------------

// Ein Hoernchen: schmaler, spitz zulaufender Verlaufs-Keil, der knapp an der Koerper-Oberflaeche
// ansetzt und sich leicht nach aussen biegt. "side" -1/1 = links/rechts, "lenFactor" erlaubt
// bewusste Asymmetrie (rechtes Horn etwas laenger/schiefer fuer einen frecheren statt
// symmetrisch-braven Eindruck).
function drawVillainHorn(cx, cy, r, side, lenFactor) {
  const baseX = cx + side * r * 0.4, baseY = cy - r * 0.75;
  const midX = cx + side * r * 0.68, midY = cy - r * (1.05 * lenFactor);
  const tipX = cx + side * r * 0.34, tipY = cy - r * (1.55 * lenFactor);
  const halfW = r * 0.15;

  const dx = midX - baseX, dy = midY - baseY;
  const dlen = Math.hypot(dx, dy) || 1;
  const px = -dy / dlen, py = dx / dlen;

  ctx.beginPath();
  ctx.moveTo(baseX - px * halfW, baseY - py * halfW);
  ctx.quadraticCurveTo(midX - px * halfW * 0.5, midY - py * halfW * 0.5, tipX, tipY);
  ctx.quadraticCurveTo(midX + px * halfW * 0.5, midY + py * halfW * 0.5, baseX + px * halfW, baseY + py * halfW);
  ctx.closePath();
  ctx.fillStyle = bodyFill(midX, midY, r * 0.55, COLORS.villain.horn);
  ctx.fill();
  ctx.lineWidth = Math.max(1.1, r * 0.055);
  ctx.strokeStyle = COLORS.villain.outline;
  ctx.stroke();
}

// Schraege Augenbraue: kurzer, dicker Strich mit rundem Ende - traegt zusammen mit dem
// unterschiedlichen "squint" der Augen (siehe drawVillainEye()) zum listigen Ausdruck bei.
function drawVillainBrow(cx, cy, r, side, tiltDeg) {
  const ex = cx + side * r * 0.36, ey = cy - r * 0.14;
  const len = r * 0.32;
  const rad = (tiltDeg * side) * Math.PI / 180;
  const dx = Math.cos(rad) * side, dy = -Math.abs(Math.sin(rad)) - 0.15;
  const dlen = Math.hypot(dx, dy) || 1;
  const ux = dx / dlen, uy = dy / dlen;

  ctx.strokeStyle = COLORS.villain.brow;
  ctx.lineWidth = Math.max(1.6, r * 0.085);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ex - ux * len * 0.5, ey - uy * len * 0.5);
  ctx.lineTo(ex + ux * len * 0.5, ey + uy * len * 0.5);
  ctx.stroke();
}

// Ein Auge: weisser Kreis + dunkle Pupille (nutzt die bereits vorhandenen COLORS.eyeWhite/
// eyePupil der Raupe mit). Unterschiedliche "squint"-Werte pro Seite (rechtes Auge etwas
// schmaler) tragen zusammen mit der schiefen Braue zum listigen Ausdruck bei.
function drawVillainEye(cx, cy, r, side, squint) {
  const ex = cx + side * r * 0.36, ey = cy + r * 0.02;
  const eyeRx = r * (side === 1 ? 0.16 : 0.19);
  const eyeRy = eyeRx * (1 - squint);

  ctx.fillStyle = COLORS.eyeWhite;
  ctx.beginPath();
  ctx.ellipse(ex, ey, eyeRx, eyeRy, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = COLORS.eyePupil;
  ctx.beginPath();
  ctx.ellipse(ex + side * eyeRx * 0.15, ey, eyeRx * 0.52, eyeRy * 0.68, 0, 0, Math.PI * 2);
  ctx.fill();
}

// Schiefes Grinsen: eine Seite hoeher gezogen als die andere, dort zwei kleine spitze
// Zaehnchen - wirkt frech/schelmisch statt bedrohlich.
function drawVillainGrin(cx, cy, r) {
  const y0 = cy + r * 0.42;
  const leftX = cx - r * 0.34, rightX = cx + r * 0.4;
  const dipY = y0 + r * 0.08;
  const highY = y0 - r * 0.1;

  ctx.strokeStyle = COLORS.eyePupil;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1.3, r * 0.07);
  ctx.beginPath();
  ctx.moveTo(leftX, y0);
  ctx.quadraticCurveTo(cx, dipY, rightX, highY);
  ctx.stroke();

  const toothW = r * 0.09, toothH = r * 0.13;
  function tooth(tx, ty) {
    ctx.beginPath();
    ctx.moveTo(tx - toothW, ty);
    ctx.lineTo(tx + toothW, ty);
    ctx.lineTo(tx, ty + toothH);
    ctx.closePath();
    ctx.fillStyle = COLORS.villain.tooth;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = COLORS.villain.outline;
    ctx.stroke();
  }
  tooth(rightX - r * 0.16, highY + r * 0.03);
  tooth(rightX - r * 0.32, highY + r * 0.07);
}

// Arm mit Hand (links), haelt einen Apfel als Lockmittel vor den Koerper (Bezug zum
// Endbildschirm-Text "It was a trap! There was no food!"). Wird NACH der Koerper-Kugel
// gezeichnet (siehe drawVillain() unten) - liegt also sichtbar vorne. Gibt die Handposition
// zurueck, damit drawVillainApple() den Apfel exakt darueber platzieren kann.
function drawVillainArm(cx, cy, r) {
  const baseX = cx - r * 0.78, baseY = cy + r * 0.32;
  const handX = cx - r * 1.32, handY = cy + r * 0.34;
  const halfW = r * 0.16;

  const dx = handX - baseX, dy = handY - baseY;
  const dlen = Math.hypot(dx, dy) || 1;
  const px = -dy / dlen, py = dx / dlen;
  const midX = (baseX + handX) / 2, midY = (baseY + handY) / 2 - r * 0.1;

  ctx.beginPath();
  ctx.moveTo(baseX - px * halfW, baseY - py * halfW);
  ctx.quadraticCurveTo(midX - px * halfW * 0.9, midY - py * halfW * 0.9, handX - px * halfW * 0.6, handY - py * halfW * 0.6);
  ctx.lineTo(handX + px * halfW * 0.6, handY + py * halfW * 0.6);
  ctx.quadraticCurveTo(midX + px * halfW * 0.9, midY + py * halfW * 0.9, baseX + px * halfW, baseY + py * halfW);
  ctx.closePath();
  ctx.fillStyle = bodyFill(midX, midY, r * 0.5, COLORS.villain.body);
  ctx.fill();
  ctx.lineWidth = Math.max(1.1, r * 0.06);
  ctx.strokeStyle = COLORS.villain.outline;
  ctx.stroke();

  const handR = r * 0.24;
  ctx.beginPath();
  ctx.arc(handX, handY, handR, 0, Math.PI * 2);
  ctx.fillStyle = bodyFill(handX, handY, handR, COLORS.villain.body);
  ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.strokeStyle = COLORS.villain.outline;
  ctx.stroke();

  return { x: handX, y: handY };
}

// Apfel-Lockmittel: kleine rote Verlaufs-Kugel, Stiel, Blatt, Glanzpunkt - ueberlappt leicht die
// Hand, damit es aussieht, als wuerde er ihn dem Betrachter entgegenstrecken. Stiel/Blatt-Kontur
// nutzen bewusst die bereits vorhandenen COLORS.food.o/meatball/basil mit (identische Hex-Werte
// wie in der Stilprobe, siehe Kommentar bei COLORS oben) statt sie zu duplizieren.
function drawVillainApple(hand, r) {
  const appleR = r * 0.28;
  const ax = hand.x - r * 0.02, ay = hand.y - r * 0.34;

  ctx.beginPath();
  ctx.arc(ax, ay, appleR, 0, Math.PI * 2);
  ctx.fillStyle = bodyFill(ax, ay, appleR, COLORS.villain.apple);
  ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.strokeStyle = COLORS.food.o;
  ctx.stroke();

  ctx.strokeStyle = COLORS.food.meatball;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1, r * 0.045);
  ctx.beginPath();
  ctx.moveTo(ax, ay - appleR * 0.92);
  ctx.lineTo(ax + appleR * 0.22, ay - appleR * 1.55);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(ax + appleR * 0.55, ay - appleR * 1.35, appleR * 0.4, appleR * 0.2, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = COLORS.food.basil;
  ctx.fill();
  ctx.lineWidth = 0.8;
  ctx.strokeStyle = COLORS.food.o;
  ctx.stroke();

  ctx.fillStyle = COLORS.dot;
  ctx.beginPath();
  ctx.arc(ax - appleR * 0.32, ay - appleR * 0.32, appleR * 0.28, 0, Math.PI * 2);
  ctx.fill();
}

// Schwert, gehalten von der Hand des zweiten Arms: Griff (dunkles Holz), kleine Querstrebe
// (Stichblatt), spitz zulaufende Klinge mit Metall-Verlauf, kleiner Knauf am Griffende. Die
// Ausrichtung ist bewusst FEST senkrecht (nach oben), unabhaengig von der Armrichtung (Wunsch:
// "Dolch vertikal aufrichten" statt liegend in Verlaengerung des Arms) - der Arm reicht
// weiterhin normal nach rechts, nur das Schwert selbst steht aufrecht in der Hand.
function drawVillainSword(handX, handY, r) {
  const ux = 0, uy = -1;
  const px = -uy, py = ux;
  const hiltLen = r * 0.22;
  const gripEndX = handX + ux * hiltLen, gripEndY = handY + uy * hiltLen;

  ctx.strokeStyle = COLORS.villain.swordHilt;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(2, r * 0.09);
  ctx.beginPath();
  ctx.moveTo(handX, handY);
  ctx.lineTo(gripEndX, gripEndY);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(handX - ux * r * 0.06, handY - uy * r * 0.06, r * 0.09, 0, Math.PI * 2);
  ctx.fillStyle = COLORS.villain.swordHilt;
  ctx.fill();

  const guardHalf = r * 0.26;
  ctx.strokeStyle = COLORS.villain.outline;
  ctx.lineWidth = Math.max(1.6, r * 0.06);
  ctx.beginPath();
  ctx.moveTo(gripEndX - px * guardHalf, gripEndY - py * guardHalf);
  ctx.lineTo(gripEndX + px * guardHalf, gripEndY + py * guardHalf);
  ctx.stroke();

  const bladeLen = r * 1.05, bladeHalfW = r * 0.11;
  const tipX = gripEndX + ux * bladeLen, tipY = gripEndY + uy * bladeLen;
  ctx.beginPath();
  ctx.moveTo(gripEndX - px * bladeHalfW, gripEndY - py * bladeHalfW);
  ctx.lineTo(tipX, tipY);
  ctx.lineTo(gripEndX + px * bladeHalfW, gripEndY + py * bladeHalfW);
  ctx.closePath();
  ctx.fillStyle = bodyFill((gripEndX + tipX) / 2, (gripEndY + tipY) / 2, bladeLen * 0.4, COLORS.villain.swordMetal);
  ctx.fill();
  ctx.lineWidth = Math.max(1.1, r * 0.045);
  ctx.strokeStyle = COLORS.villain.outline;
  ctx.stroke();
}

// Zweiter Arm (rechte Seite, Gegenstueck zum Apfel-Arm links), haelt das Schwert. Ganz normal
// nach rechts ausgestreckt (gleiche Grundgeometrie wie der Apfel-Arm, nur gespiegelt) - der
// raeumliche "weiter hinten"-Eindruck entsteht NICHT durch eine andere Armhaltung, sondern
// dadurch, dass diese Funktion (anders als drawVillainArm/drawVillainApple) VOR der
// Koerper-Kugel aufgerufen wird (siehe drawVillain() unten): der Armansatz liegt innerhalb des
// Koerper-Radius und wird von der Kugel ueberdeckt, waehrend Hand und Schwert deutlich
// ausserhalb liegen und damit sichtbar bleiben - genau wie bei den Hoernchen, nur seitlich
// statt oben.
function drawVillainSwordArm(cx, cy, r) {
  const side = 1;
  const baseX = cx + side * r * 0.78, baseY = cy + r * 0.32;
  const handX = cx + side * r * 1.32, handY = cy + r * 0.34;
  const halfW = r * 0.16;

  const dx = handX - baseX, dy = handY - baseY;
  const dlen = Math.hypot(dx, dy) || 1;
  const px = -dy / dlen, py = dx / dlen;
  const midX = (baseX + handX) / 2, midY = (baseY + handY) / 2 - r * 0.1;

  ctx.beginPath();
  ctx.moveTo(baseX - px * halfW, baseY - py * halfW);
  ctx.quadraticCurveTo(midX - px * halfW * 0.9, midY - py * halfW * 0.9, handX - px * halfW * 0.6, handY - py * halfW * 0.6);
  ctx.lineTo(handX + px * halfW * 0.6, handY + py * halfW * 0.6);
  ctx.quadraticCurveTo(midX + px * halfW * 0.9, midY + py * halfW * 0.9, baseX + px * halfW, baseY + py * halfW);
  ctx.closePath();
  ctx.fillStyle = bodyFill(midX, midY, r * 0.5, COLORS.villain.body);
  ctx.fill();
  ctx.lineWidth = Math.max(1.1, r * 0.06);
  ctx.strokeStyle = COLORS.villain.outline;
  ctx.stroke();

  const handR = r * 0.24;
  ctx.beginPath();
  ctx.arc(handX, handY, handR, 0, Math.PI * 2);
  ctx.fillStyle = bodyFill(handX, handY, handR, COLORS.villain.body);
  ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.strokeStyle = COLORS.villain.outline;
  ctx.stroke();

  drawVillainSword(handX, handY, r);
}

// Gesamter Boesewicht (ersetzt den bisherigen Platzhalter): Schatten, Hoernchen + Schwert-Arm
// (zuerst, damit die Koerper-Kugel danach ihre jeweilige Basis ueberdeckt - gleiches Prinzip wie
// die Fuehler der Raupe), dann die Koerper-Kugel selbst mit Verlauf + Kontur, Glanzpunkt,
// Gesicht, zuletzt Apfel-Arm (liegt dadurch sicher vorne, auch dort wo er den Koerperrand
// ueberlappt - bewusster Kontrast zum Schwert-Arm, der stattdessen hinter der Kugel liegt).
function drawVillain() {
  if (!state.villainEnabled || !state.villain) return;
  const v = state.villain;
  const cx = v.x * CELL + CELL / 2;
  const cy = v.y * CELL + CELL / 2;
  const r = CELL * VILLAIN_RADIUS_FACTOR;

  ctx.fillStyle = COLORS.shadow;
  ctx.beginPath();
  ctx.ellipse(cx + 1, cy + r * 0.86, r * 0.85, r * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();

  drawVillainHorn(cx, cy, r, -1, 0.95);
  drawVillainHorn(cx, cy, r, 1, 1.18);
  drawVillainSwordArm(cx, cy, r);

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = bodyFill(cx, cy, r, COLORS.villain.body);
  ctx.fill();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = COLORS.villain.outline;
  ctx.stroke();

  ctx.fillStyle = COLORS.dot;
  ctx.beginPath();
  ctx.arc(cx - r * 0.38, cy - r * 0.4, r * 0.17, 0, Math.PI * 2);
  ctx.fill();

  drawVillainBrow(cx, cy, r, -1, 18);
  drawVillainBrow(cx, cy, r, 1, 34);
  drawVillainEye(cx, cy, r, -1, 0.05);
  drawVillainEye(cx, cy, r, 1, 0.3);
  drawVillainGrin(cx, cy, r);

  const hand = drawVillainArm(cx, cy, r);
  drawVillainApple(hand, r);
}

// ---------------------------------------------------------------
// 5c) Wiese im Sicherheitsrand (aus der bestaetigten Stilprobe stilprobe-rahmen-pflanzen.html
// uebernommen, siehe COLORS.meadow oben). Ersetzt den bisher schlichten einfarbigen Rand
// (COLORS.canvasMargin) durch eine dichte, ueberlappende Wiesen-Deko aus 4 Grashalm- und 4
// Blueten-Typen. WICHTIG zur Performance: diese ~1000+ ueberlappenden Formen werden NICHT jeden
// Tick neu berechnet (das waere bei 4-6 Zeichen-Operationen pro Buschel ein spuerbarer Mehraufwand
// auf jedem Tick, gerade auf Handys) - stattdessen einmalig beim Laden auf eine unsichtbare
// Offscreen-Canvas (meadowCache) vorgerendert, und draw() zeichnet davon pro Tick nur noch ein
// einziges fertiges Bild (ctx.drawImage), genau wie ein Foto statt es jedes Mal neu zu malen. Die
// Wiese ist deterministisch (fester Pseudozufalls-Seed, siehe mulberry32) - deshalb ist ein
// einmaliges Vorrendern ueberhaupt moeglich, sie sieht nie zweimal unterschiedlich aus.
//
// Abweichung von der sonstigen Codebasis: die Helfer-Funktionen hier bekommen bewusst "ctx" als
// Parameter uebergeben (anders als z. B. bodyFill() oder die Boesewicht-Funktionen, die die globale
// ctx-Konstante direkt nutzen) - noetig, weil sie sowohl auf die echte Spiel-Canvas als auch auf die
// unsichtbare Offscreen-Canvas zeichnen koennen muessen.
// ---------------------------------------------------------------

// Kleiner deterministischer Pseudozufallsgenerator (Mulberry32) - liefert bei gleichem "seed" IMMER
// dieselbe Zahlenfolge. Damit sieht die Wiese bei jedem draw()/Neuladen exakt gleich aus (kein
// "Flackern" durch echten Zufall).
function meadowRandom(seed) {
  let a = seed;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Gleiche Verlaufstechnik wie bodyFill(), nur mit explizitem ctx-Parameter (siehe Abweichung oben).
function meadowBodyFill(mctx, cx, cy, r, col) {
  const g = mctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.08, cx, cy, r);
  g.addColorStop(0, col.hi);
  g.addColorStop(0.55, col.base);
  g.addColorStop(1, col.lo);
  return g;
}

// Ein einzelner Grashalm: schmaler, spitz zulaufender Verlaufs-Keil - gleiche Technik wie die
// Boesewicht-Hoernchen (tapered wedge).
function drawMeadowBlade(mctx, baseX, baseY, angleDeg, len, halfWFactor, col) {
  const rad = angleDeg * Math.PI / 180;
  const ux = Math.sin(rad), uy = -Math.cos(rad);
  const px = -uy, py = ux;
  const tipX = baseX + ux * len, tipY = baseY + uy * len;
  const bendX = baseX + ux * len * 0.55 + px * len * 0.18, bendY = baseY + uy * len * 0.55 + py * len * 0.18;
  const halfW = len * halfWFactor;

  mctx.beginPath();
  mctx.moveTo(baseX - px * halfW, baseY - py * halfW);
  mctx.quadraticCurveTo(bendX - px * halfW * 0.4, bendY - py * halfW * 0.4, tipX, tipY);
  mctx.quadraticCurveTo(bendX + px * halfW * 0.4, bendY + py * halfW * 0.4, baseX + px * halfW, baseY + py * halfW);
  mctx.closePath();
  mctx.fillStyle = meadowBodyFill(mctx, bendX, bendY, len * 0.5, col);
  mctx.fill();
  // Konturbreite relativ zur tatsaechlichen Halmbreite (halfW), NICHT absolut - sonst wuerde die
  // Kontur bei duennen Halm-Typen das gesamte Fuellfarben-Verlauf verdecken.
  mctx.lineWidth = Math.max(0.6, halfW * 0.4);
  mctx.strokeStyle = COLORS.meadow.outline;
  mctx.stroke();
}

// Halm-Typ 1: kompakter Faecher, 4-5 Halme
// "baseAngle" (Grad, 0 = senkrecht nach oben) erlaubt es, die Wuchsrichtung des GANZEN Buendels zu
// drehen - genutzt fuer die Seitenstreifen (links/rechts), deren Gras statt nach oben seitlich INS
// Spielfeld hineinwachsen soll (siehe drawMeadowStrip/buildMeadowCache weiter unten).
function drawMeadowGrassTuft1(mctx, cx, cy, scale, seed, baseAngle) {
  const rnd = meadowRandom(seed);
  const count = 4 + Math.floor(rnd() * 2);
  const spread = 55;
  const lean = (baseAngle || 0) + (rnd() - 0.5) * 20;
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const angle = lean - spread / 2 + t * spread + (rnd() - 0.5) * 8;
    const len = (12 + rnd() * 7) * scale;
    drawMeadowBlade(mctx, cx, cy, angle, len, 0.09, COLORS.meadow.greens[i % 2]);
  }
}

// Halm-Typ 2: duenne, hoehere Einzelhalme (2-3 Stueck)
function drawMeadowGrassTuft2(mctx, cx, cy, scale, seed, baseAngle) {
  const rnd = meadowRandom(seed);
  const count = 2 + Math.floor(rnd() * 2);
  const lean = (baseAngle || 0) + (rnd() - 0.5) * 26;
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const angle = lean - 34 + t * 68 + (rnd() - 0.5) * 10;
    const len = (16 + rnd() * 8) * scale;
    drawMeadowBlade(mctx, cx, cy, angle, len, 0.05, COLORS.meadow.greens[(i + 1) % 2]);
  }
}

// Halm-Typ 3: kleines Kleeblatt-Buendel (3 runde Blaettchen) statt spitzer Halme
function drawMeadowGrassTuft3(mctx, cx, cy, scale, seed, baseAngle) {
  const rnd = meadowRandom(seed);
  const stemLen = 6 * scale;
  const lean = (baseAngle || 0) * Math.PI / 180 + (rnd() - 0.5) * Math.PI * 0.3;
  const sx = cx + Math.sin(lean) * stemLen, sy = cy - Math.cos(lean) * stemLen;
  mctx.strokeStyle = COLORS.meadow.outline;
  mctx.lineWidth = Math.max(0.7, 1 * scale);
  mctx.beginPath();
  mctx.moveTo(cx, cy);
  mctx.lineTo(sx, sy);
  mctx.stroke();
  const leafR = 5.2 * scale;
  for (let i = 0; i < 3; i++) {
    const a = lean + (i - 1) * (Math.PI * 2 / 3.4);
    const lx = sx + Math.sin(a) * leafR * 0.9, ly = sy - Math.cos(a) * leafR * 0.9;
    mctx.beginPath();
    mctx.ellipse(lx, ly, leafR * 0.62, leafR * 0.48, a, 0, Math.PI * 2);
    mctx.fillStyle = meadowBodyFill(mctx, lx, ly, leafR * 0.6, { hi: COLORS.meadow.cloverHi, base: COLORS.meadow.clover, lo: COLORS.meadow.cloverLo });
    mctx.fill();
    mctx.lineWidth = Math.max(0.6, 0.8 * scale);
    mctx.strokeStyle = COLORS.meadow.outline;
    mctx.stroke();
  }
}

// Halm-Typ 4: 2-3 lange, leicht ueberhaengende "trockene" Halme (gelblich) - Farbabwechslung, wie
// man sie auf echten Wiesen zwischen dem Gruen sieht.
function drawMeadowGrassTuft4(mctx, cx, cy, scale, seed, baseAngle) {
  const rnd = meadowRandom(seed);
  const count = 2 + Math.floor(rnd() * 2);
  const lean = (baseAngle || 0) + (rnd() - 0.5) * 30;
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const angle = lean - 20 + t * 40 + (rnd() - 0.5) * 8;
    const len = (18 + rnd() * 9) * scale;
    drawMeadowBlade(mctx, cx, cy, angle, len, 0.045, { hi: COLORS.meadow.strawHi, base: COLORS.meadow.straw, lo: COLORS.meadow.strawLo });
  }
}

const MEADOW_GRASS_VARIANTS = [drawMeadowGrassTuft1, drawMeadowGrassTuft2, drawMeadowGrassTuft3, drawMeadowGrassTuft4];

// Bluete-Typ 1: 5 ovale Bluetenblaetter
function drawMeadowFlower1(mctx, cx, cy, scale) {
  const petalR = 4.2 * scale;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const px = cx + Math.cos(a) * petalR * 0.95, py = cy + Math.sin(a) * petalR * 0.95;
    mctx.beginPath();
    mctx.ellipse(px, py, petalR * 0.62, petalR * 0.42, a, 0, Math.PI * 2);
    mctx.fillStyle = meadowBodyFill(mctx, px, py, petalR * 0.6, { hi: COLORS.meadow.petalHi, base: COLORS.meadow.petal, lo: COLORS.meadow.petalLo });
    mctx.fill();
    mctx.lineWidth = Math.max(0.5, 0.8 * scale);
    mctx.strokeStyle = COLORS.meadow.outline;
    mctx.stroke();
  }
  mctx.beginPath();
  mctx.arc(cx, cy, petalR * 0.42, 0, Math.PI * 2);
  mctx.fillStyle = COLORS.meadow.dotFlowerCenter;
  mctx.fill();
  mctx.lineWidth = Math.max(0.5, 0.7 * scale);
  mctx.strokeStyle = COLORS.meadow.outline;
  mctx.stroke();
}

// Bluete-Typ 2: kleine Tupfen-Bluete (3-4 winzige helle Punkte)
function drawMeadowFlower2(mctx, cx, cy, scale, seed) {
  const rnd = meadowRandom(seed);
  const n = 3 + Math.floor(rnd() * 2);
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2;
    const d = 3.2 * scale * rnd();
    const dx = cx + Math.cos(a) * d, dy = cy + Math.sin(a) * d;
    const r = 1.6 * scale;
    mctx.beginPath();
    mctx.arc(dx, dy, r, 0, Math.PI * 2);
    mctx.fillStyle = COLORS.meadow.dotFlowerCol;
    mctx.fill();
    mctx.lineWidth = Math.max(0.4, 0.6 * scale);
    mctx.strokeStyle = COLORS.meadow.outline;
    mctx.stroke();
  }
}

// Bluete-Typ 3: kleine Sternbluete (Butterblumen-Look)
function drawMeadowFlower3(mctx, cx, cy, scale) {
  const outerR = 4.6 * scale, innerR = 1.6 * scale;
  mctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const r = i % 2 === 0 ? outerR : innerR;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i === 0) mctx.moveTo(x, y); else mctx.lineTo(x, y);
  }
  mctx.closePath();
  mctx.fillStyle = meadowBodyFill(mctx, cx, cy, outerR, { hi: COLORS.meadow.starHi, base: COLORS.meadow.star, lo: COLORS.meadow.starLo });
  mctx.fill();
  mctx.lineWidth = Math.max(0.5, 0.8 * scale);
  mctx.strokeStyle = COLORS.meadow.outline;
  mctx.stroke();
  mctx.beginPath();
  mctx.arc(cx, cy, innerR * 0.85, 0, Math.PI * 2);
  mctx.fillStyle = COLORS.meadow.dotFlowerCenter;
  mctx.fill();
}

// Bluete-Typ 4: kleine haengende Glockenbluete an duennem Stiel (blau-violett)
function drawMeadowFlower4(mctx, cx, cy, scale, angleDeg) {
  const rad = (angleDeg || 0) * Math.PI / 180;
  const ux = Math.sin(rad), uy = -Math.cos(rad);
  const stemLen = 7 * scale;
  const bx = cx + ux * stemLen, by = cy + uy * stemLen;
  mctx.strokeStyle = COLORS.meadow.outline;
  mctx.lineWidth = Math.max(0.6, 0.9 * scale);
  mctx.beginPath();
  mctx.moveTo(cx, cy);
  mctx.lineTo(bx, by);
  mctx.stroke();
  const bellR = 3 * scale;
  mctx.beginPath();
  mctx.moveTo(bx - bellR, by);
  mctx.quadraticCurveTo(bx - bellR * 1.1, by + bellR * 1.4, bx, by + bellR * 1.7);
  mctx.quadraticCurveTo(bx + bellR * 1.1, by + bellR * 1.4, bx + bellR, by);
  mctx.quadraticCurveTo(bx, by - bellR * 0.4, bx - bellR, by);
  mctx.closePath();
  mctx.fillStyle = meadowBodyFill(mctx, bx, by + bellR * 0.6, bellR * 1.3, { hi: COLORS.meadow.bellHi, base: COLORS.meadow.bell, lo: COLORS.meadow.bellLo });
  mctx.fill();
  mctx.lineWidth = Math.max(0.5, 0.7 * scale);
  mctx.strokeStyle = COLORS.meadow.outline;
  mctx.stroke();
}

const MEADOW_FLOWER_VARIANTS = [
  function (mctx, cx, cy, scale, seed) { drawMeadowFlower1(mctx, cx, cy, scale); },
  function (mctx, cx, cy, scale, seed) { drawMeadowFlower2(mctx, cx, cy, scale, seed); },
  function (mctx, cx, cy, scale, seed) { drawMeadowFlower3(mctx, cx, cy, scale); },
  function (mctx, cx, cy, scale, seed) { drawMeadowFlower4(mctx, cx, cy, scale, seed % 360); }
];

// Fuellt ein rechteckiges Rand-Stueck mit einem Raster aus gemischten Grashalm-Typen + vereinzelten
// Blueten. Wie beim Tiefensortier-Prinzip im Rest des Spiels (siehe draw()/drawables weiter unten:
// "weiter unten = naeher am Betrachter = wird zuletzt/obenauf gezeichnet"): die reine
// Rasterreihenfolge wuerde das bei dichter, ueberlappender Bepflanzung durch den Zufalls-Jitter
// nicht zuverlaessig einhalten - deshalb werden erst ALLE Positionen gesammelt, nach der
// tatsaechlichen y-Position sortiert und ERST DANN gezeichnet.
// "baseAngle" (Grad, 0 = nach oben) wird an jeden Grashalm-Buschel weitergereicht (siehe
// drawMeadowGrassTuft1-4) - damit kann ein ganzer Streifen in eine gemeinsame Grundrichtung wachsen
// (z. B. "nach rechts, ins Spielfeld hinein" fuer den linken Rand). Default 0 = wie bisher nach oben.
function drawMeadowStrip(mctx, x0, y0, w, h, seedBase, spacing, scaleMin, scaleMax, flowerChance, baseAngle) {
  const cols = Math.max(1, Math.round(w / spacing));
  const rows = Math.max(1, Math.round(h / spacing));
  const padding = 5;
  const cellW = w / cols, cellH = h / rows;
  const items = [];
  for (let ry = 0; ry < rows; ry++) {
    for (let rx = 0; rx < cols; rx++) {
      const seed = seedBase + ry * 977 + rx * 131 + 7;
      const rnd = meadowRandom(seed);
      let cx = x0 + (rx + 0.5) * cellW + (rnd() - 0.5) * cellW * 0.8;
      let cy = y0 + (ry + 0.5) * cellH + (rnd() - 0.5) * cellH * 0.8;
      cx = Math.min(Math.max(cx, x0 + padding), x0 + w - padding);
      cy = Math.min(Math.max(cy, y0 + padding), y0 + h - padding);
      const scale = scaleMin + rnd() * (scaleMax - scaleMin);
      const variant = MEADOW_GRASS_VARIANTS[Math.floor(rnd() * MEADOW_GRASS_VARIANTS.length)];
      items.push({ y: cy, draw: function () { variant(mctx, cx, cy, scale, seed, baseAngle); } });
      if (rnd() < flowerChance) {
        const fvariant = MEADOW_FLOWER_VARIANTS[Math.floor(rnd() * MEADOW_FLOWER_VARIANTS.length)];
        const fx = cx + (rnd() - 0.5) * 5, fy = cy + (rnd() - 0.5) * 5, fscale = 0.7 + rnd() * 0.4;
        items.push({ y: fy, draw: function () { fvariant(mctx, fx, fy, fscale, seed); } });
      }
    }
  }
  items.sort(function (a, b) { return a.y - b.y; });
  for (const item of items) item.draw();
}

// Wie weit die Wiese unten/links/rechts sichtbar ins Spielfeld hineinreichen darf (Wunsch von
// Marco: "unten und auf der Seite grafisch in den Spielbereich reichen"). Bewusst NICHT oben (dort
// bleibt der Rand wie bisher klar getrennt) und bewusst als eigene Konstante, falls Marco die Tiefe
// noch anpassen moechte.
const MEADOW_FIELD_OVERLAP = 22;

// Baut die komplette Wiese EINMALIG auf eine unsichtbare Offscreen-Canvas in logischer Aufloesung
// (CANVAS_PX x CANVAS_PX, OHNE dpr-Multiplikation - beim spaeteren ctx.drawImage() aus dem bereits
// per ctx.setTransform() skalierten Haupt-Context wird sie automatisch korrekt auf die tatsaechliche
// Geraete-Pixeldichte hochskaliert, siehe setupCanvas()).
//
// WICHTIG: der Hintergrund wird NUR in den 4 Randstreifen selbst beige gefuellt, NICHT im
// mittleren (Spielfeld-grossen) Bereich - der bleibt transparent. Grund: unten/links/rechts duerfen
// Halme absichtlich ueber die Randstreifen-Grenze hinaus INS Spielfeld hineinwachsen (siehe
// baseAngle unten). draw() zeichnet spaeter das Karo (drawBoard()) zuerst voll deckend, und kopiert
// DANACH nur noch einen schmalen Ueberlappungs-Streifen (MEADOW_FIELD_OVERLAP) aus genau diesem
// Cache-Bild erneut obendrauf - waere der mittlere Bereich hier schon beige gefuellt, wuerde dieser
// zweite Kopiervorgang das Karo-Muster dort faelschlich uebermalen statt nur die Halme sichtbar zu
// machen (da dann auch die leeren, "grashalmlosen" Pixel dieses Bereichs beige waeren statt
// durchsichtig).
function buildMeadowCache() {
  const mcanvas = document.createElement('canvas');
  mcanvas.width = CANVAS_PX;
  mcanvas.height = CANVAS_PX;
  const mctx = mcanvas.getContext('2d');
  mctx.fillStyle = COLORS.canvasMargin;
  mctx.fillRect(0, 0, CANVAS_PX, CANVAS_MARGIN);                                    // oben
  mctx.fillRect(0, CANVAS_PX - CANVAS_MARGIN, CANVAS_PX, CANVAS_MARGIN);            // unten
  mctx.fillRect(0, CANVAS_MARGIN, CANVAS_MARGIN, BOARD_PX);                          // links
  mctx.fillRect(CANVAS_PX - CANVAS_MARGIN, CANVAS_MARGIN, CANVAS_MARGIN, BOARD_PX);  // rechts

  const spacing = 8, scaleMin = 0.75, scaleMax = 1.15, flowerChance = 0.16;
  // oben: waechst wie bisher nach oben (baseAngle 0 = WEG vom Spielfeld, absichtlich KEIN Hineinragen)
  drawMeadowStrip(mctx, 0, 0, CANVAS_PX, CANVAS_MARGIN, 1000, spacing, scaleMin, scaleMax, flowerChance, 0);
  // unten: waechst ebenfalls "nach oben" (baseAngle 0) - das bedeutet hier automatisch INS Spielfeld
  // hinein, weil das Feld ueber diesem Streifen liegt.
  drawMeadowStrip(mctx, 0, CANVAS_PX - CANVAS_MARGIN, CANVAS_PX, CANVAS_MARGIN, 2000, spacing, scaleMin, scaleMax, flowerChance, 0);
  // links: baseAngle 90 = nach rechts gedreht, also INS Spielfeld hinein (das rechts von diesem Streifen liegt)
  drawMeadowStrip(mctx, 0, CANVAS_MARGIN, CANVAS_MARGIN, BOARD_PX, 3000, spacing, scaleMin, scaleMax, flowerChance, 90);
  // rechts: baseAngle -90 = nach links gedreht, also INS Spielfeld hinein
  drawMeadowStrip(mctx, CANVAS_PX - CANVAS_MARGIN, CANVAS_MARGIN, CANVAS_MARGIN, BOARD_PX, 4000, spacing, scaleMin, scaleMax, flowerChance, -90);
  return mcanvas;
}

const meadowCache = buildMeadowCache();

// Dreieckiger Verbinder pro Segment (inkl. Kopf), zeigt zur jeweils naechsten/schwanzwaertigen
// Kugel - schliesst die Luecke zwischen zwei benachbarten Kreisen. Haengt nur von der Lage der
// Nachbar-Segmente in "path" ab, nicht von der aktuellen Blickrichtung - funktioniert dadurch
// unveraendert bei jeder Kurve, die die Raupe waehrend des Spiels nimmt.
function drawSegmentSpike(path, i, radiusFactor, fillColor) {
  const cur = path[i];
  const isLast = i === path.length - 1;
  const ref = isLast ? path[i - 1] : path[i + 1];
  let dx = isLast ? cur.x - ref.x : ref.x - cur.x;
  let dy = isLast ? cur.y - ref.y : ref.y - cur.y;
  const dlen = Math.hypot(dx, dy) || 1;
  dx /= dlen; dy /= dlen;
  const px = -dy, py = dx;

  const r = (i === 0 ? radiusFactor + 0.06 : radiusFactor) * CELL;
  const cx = cur.x * CELL + CELL / 2, cy = cur.y * CELL + CELL / 2;
  const baseCx = cx + dx * r * 0.6, baseCy = cy + dy * r * 0.6;
  const halfWidth = r * 0.4;
  const tipX = cx + dx * r * 1.3, tipY = cy + dy * r * 1.3;

  ctx.beginPath();
  ctx.moveTo(baseCx - px * halfWidth, baseCy - py * halfWidth);
  ctx.lineTo(tipX, tipY);
  ctx.lineTo(baseCx + px * halfWidth, baseCy + py * halfWidth);
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = i === 0 ? COLORS.redOutline : COLORS.outline;
  ctx.stroke();
}

// Fuehler (schwarzer Stiel, dunkelrote Verlaufs-Spitze), hinter den Augen angesetzt. "side" ist
// -1 (oberer Fuehler) oder 1 (unterer Fuehler), relativ zur aktuellen Blickrichtung "dir" - im
// Unterschied zur Stilprobe (dort war die Raupe immer nach rechts ausgerichtet) muss hier jede
// Position ueber "dir" UND die dazu senkrechte Achse (px, py) berechnet werden, weil die Raupe im
// echten Spiel in alle vier Richtungen unterwegs sein kann.
function drawAntenna(hx, hy, r, side, dir) {
  const px = -dir.y, py = dir.x;
  const baseX = hx - dir.x * r * 0.05 + px * side * r * 0.65;
  const baseY = hy - dir.y * r * 0.05 + py * side * r * 0.65;
  const tipX = hx + dir.x * r * 0.52 + px * side * r * 1.0;
  const tipY = hy + dir.y * r * 0.52 + py * side * r * 1.0;

  const eyeX = hx + dir.x * CELL * 0.16 + px * side * CELL * 0.2;
  const eyeY = hy + dir.y * CELL * 0.16 + py * side * CELL * 0.2;
  const midX = (baseX + tipX) / 2, midY = (baseY + tipY) / 2;
  let awayX = midX - eyeX, awayY = midY - eyeY;
  const awayLen = Math.hypot(awayX, awayY) || 1;
  awayX /= awayLen; awayY /= awayLen;
  const ctrlX = midX + awayX * r * 0.5;
  const ctrlY = midY + awayY * r * 0.5;

  ctx.strokeStyle = COLORS.antenna.stroke;
  ctx.lineWidth = Math.max(1.6, r * 0.14);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
  ctx.stroke();

  const tipR = r * 0.14;
  ctx.fillStyle = bodyFill(tipX, tipY, tipR, COLORS.antenna.tip);
  ctx.strokeStyle = COLORS.redOutline;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(tipX, tipY, tipR, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

// Baeckchen: je ein kleines dunkelrosa Oval zwischen Augenmittelpunkt und dem naeherliegenden
// Mundende, auf gleicher Achse quer zur Blickrichtung wie die Augen. Der Abstand der beiden
// Baeckchen zueinander wird verdoppelt (Wunsch aus der Stilprobe), aber NUR entlang dieser
// Quer-Achse - die Komponente in Blickrichtung bleibt unveraendert. In der Stilprobe (Blick immer
// nach rechts) war das einfach "cy staerker skalieren"; hier wird deshalb zuerst in
// Blickrichtungs-/Quer-Komponente zerlegt, die Quer-Komponente verdoppelt und wieder
// zusammengesetzt - damit es bei jeder der vier moeglichen Blickrichtungen gleich aussieht.
function drawCheeks(hx, hy, headR, dir) {
  const px = -dir.y, py = dir.x;
  const mx = hx + dir.x * headR * 0.86, my = hy + dir.y * headR * 0.86;
  const mHalf = headR * 0.14;
  const rx = headR * 0.065, ry = headR * 0.16;

  ctx.fillStyle = COLORS.cheek;
  for (const side of [-1, 1]) {
    const ex = hx + dir.x * CELL * 0.16 + px * side * CELL * 0.2;
    const ey = hy + dir.y * CELL * 0.16 + py * side * CELL * 0.2;
    const mex = mx + px * side * mHalf, mey = my + py * side * mHalf;
    const cx0 = ex + 0.65 * (mex - ex);
    const cy0 = ey + 0.65 * (mey - ey);

    const relX = cx0 - hx, relY = cy0 - hy;
    const forwardComp = relX * dir.x + relY * dir.y;
    const sideComp = relX * px + relY * py;
    const cx = hx + dir.x * forwardComp + px * (sideComp * 2.0);
    const cy = hy + dir.y * forwardComp + py * (sideComp * 2.0);

    ctx.beginPath();
    // Die Ellipse selbst wird mitgedreht: rx (kurze Achse) zeigt in Blickrichtung, ry (lange
    // Achse) quer dazu - dafuer wird sie um den Winkel der aktuellen Blickrichtung rotiert. Bei
    // Blick nach rechts (Winkel 0) ergibt das exakt dieselbe Ausrichtung wie in der Stilprobe
    // (lange Achse vertikal); bei den anderen drei Richtungen dreht sie sich entsprechend mit.
    const rotation = Math.atan2(dir.y, dir.x);
    ctx.ellipse(cx, cy, rx, ry, rotation, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Mund: ein kurzer, duenner Bogen (leichtes Laecheln), vorne an der Kopfspitze, mittig zwischen
// den beiden Augen.
function drawMouth(hx, hy, r, dir) {
  const mx = hx + dir.x * r * 0.86;
  const my = hy + dir.y * r * 0.86;
  const halfLen = r * 0.14;
  const bulge = r * 0.05;
  const px = -dir.y, py = dir.x;
  const x1 = mx - px * halfLen, y1 = my - py * halfLen;
  const x2 = mx + px * halfLen, y2 = my + py * halfLen;
  const cx = mx + dir.x * bulge, cy = my + dir.y * bulge;

  ctx.strokeStyle = COLORS.eyePupil;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(cx, cy, x2, y2);
  ctx.stroke();
}

// Zeichnet GENAU EIN Raupenglied (Schatten, Dreieck-Verbinder, Kugel, Glanzpunkt) - beim Kopf
// (i===0) zusaetzlich alle Kopf-Verzierungen (Fuehler, Baeckchen, Augen, Mund), da diese fest am
// Kopf haengen und immer zusammen mit ihm auf derselben "Tiefen-Ebene" liegen sollen. Bewusst als
// einzelne, in sich abgeschlossene Funktion (statt wie frueher zwei separate Durchgaenge über alle
// Glieder) - siehe draw()/drawSnakeSegment weiter unten: nur so lassen sich Futter und Boesewicht
// zeilenweise dazwischen einsortieren (raeumliches "weiter unten = weiter vorne"-Gefuehl).
function drawSnakeSegment(i) {
  const path = state.snake;
  const d = state.dir;
  const s = path[i];
  const cx = s.x * CELL + CELL / 2;
  const cy = s.y * CELL + CELL / 2;
  const r = (i === 0 ? SNAKE_RADIUS_FACTOR + 0.06 : SNAKE_RADIUS_FACTOR) * CELL;

  // Schatten
  ctx.fillStyle = COLORS.shadow;
  ctx.beginPath();
  ctx.ellipse(cx + 1, cy + r * 0.72, r * 0.95, r * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Dreieck-Verbindungsstueck zum Nachbarglied, dann die Kugel selbst darueber (Farbverlauf via
  // bodyFill), dann ein kleiner Glanzpunkt.
  const col = i === 0 ? COLORS.head : COLORS.bands[i % 2];
  drawSegmentSpike(path, i, SNAKE_RADIUS_FACTOR, col.base);
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = bodyFill(cx, cy, r, col);
  ctx.fill();
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = i === 0 ? COLORS.redOutline : COLORS.outline;
  ctx.stroke();
  ctx.fillStyle = COLORS.dot;
  ctx.beginPath();
  ctx.arc(cx - r * 0.35, cy - r * 0.38, r * 0.2, 0, Math.PI * 2);
  ctx.fill();

  if (i !== 0) return;

  // Kopf-Verzierungen (nur beim Kopf, i===0): Fuehler zuerst (hinter den Augen), dann Baeckchen,
  // dann Augen mit Wimpern-Linie, dann Mund.
  drawAntenna(cx, cy, r, -1, d);
  drawAntenna(cx, cy, r, 1, d);
  drawCheeks(cx, cy, r, d);

  // Augen: weisser Kreis + Pupille, dazu eine feine schwarze Wimpern-Linie auf der Haelfte des
  // Augenrands, die von der Pupille abgewandt ist. In der Stilprobe (Blick fix nach rechts) liess
  // sich das als feste Bogen-Winkel (-90 Grad bis 90 Grad) schreiben; weil die Pupille hier bei
  // jeder Blickrichtung in eine andere Richtung verschoben ist, wird die Bogen-Mitte stattdessen
  // aus der jeweils aktuellen Gegenrichtung (-dir) berechnet - das ergibt bei Blick nach rechts
  // exakt denselben Bogen wie in der Stilprobe, funktioniert aber auch bei den anderen drei
  // Richtungen.
  const px = -d.y, py = d.x;
  for (const side of [-1, 1]) {
    const ex = cx + d.x * CELL * 0.16 + px * side * CELL * 0.2;
    const ey = cy + d.y * CELL * 0.16 + py * side * CELL * 0.2;
    const eyeR = CELL * 0.13;
    ctx.fillStyle = COLORS.eyeWhite;
    ctx.beginPath();
    ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.eyePupil;
    ctx.beginPath();
    ctx.arc(ex + d.x * CELL * 0.04, ey + d.y * CELL * 0.04, CELL * 0.085, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = COLORS.lash;
    ctx.lineWidth = Math.max(0.8, eyeR * 0.1);
    ctx.beginPath();
    const centerAngle = Math.atan2(-d.y, -d.x);
    ctx.arc(ex, ey, eyeR, centerAngle - Math.PI / 2, centerAngle + Math.PI / 2);
    ctx.stroke();
  }

  // Mund: feiner, kurzer Strich vorne am Kopf, mittig zwischen den Augen
  drawMouth(cx, cy, r, d);
}

function drawCenteredText(text) {
  ctx.save();
  ctx.fillStyle = 'rgba(47, 61, 44, 0.75)';
  ctx.fillRect(0, BOARD_PX / 2 - 26, BOARD_PX, 52);
  ctx.fillStyle = '#f6f1e7';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, BOARD_PX / 2, BOARD_PX / 2);
  ctx.restore();
}

// Sichtbarer Hinweis auf dem Spielfeld selbst. Nur noch fuer "Pause" - bei "ready"/"over"/"won"
// steht der Text zusammen mit dem jeweiligen Button im HTML-Panel (siehe updateButtons()), damit
// sich nicht zwei unterschiedlich breite Elemente (Canvas-Text + Button) gegenseitig ueberlagern.
function drawOverlay() {
  if (state.phase === 'paused') {
    drawCenteredText('Take a Break!');
  }
}

// Raeumliches Tiefengefuehl (Wunsch von Marco): ein Objekt, das WEITER UNTEN im Feld steht (groesserer
// y-Wert = naeher am Betrachter gedacht), wird ueber ein Objekt gezeichnet, das weiter oben steht -
// unabhaengig davon, ob es sich um ein Raupenglied, Futter oder den Boesewicht handelt. Dafuer werden
// alle sichtbaren Objekte in eine gemeinsame Liste gesammelt, nach ihrer Feld-Zeile (y) aufsteigend
// sortiert (kleines y zuerst = "weiter hinten"/wird zuerst gezeichnet, grosses y zuletzt = "weiter
// vorne"/wird zuletzt gezeichnet und liegt damit oben) und erst dann der Reihe nach gezeichnet.
// Frueher wurden Futter/Boesewicht immer VOR der ganzen Raupe gezeichnet, wodurch die Raupe selbst
// beim Vorbeifahren an einem tiefer stehenden Futter-Symbol faelschlich darueber lag.
// Futter/Boesewicht werden VOR den Raupengliedern in die Liste eingefuegt, die Raupenglieder
// selbst vom Schwanz zum Kopf (wie zuvor). Das ist wichtig fuer die Stabilitaet von Array.sort():
// bei GLEICHER Zeile bleibt die Einfuege-Reihenfolge erhalten, d. h. bei einem Gleichstand
// gewinnt IMMER die Raupe (wird zuletzt / obenauf gezeichnet) - so wie Marco es wollte: "wenn
// das Essen und der Kopf auf dem selben Feld sind, dann ist der Kopf wichtiger, das Essen wird ja
// gegessen und verschwindet". Unter den Raupengliedern selbst sorgt dieselbe Stabilitaet dafuer,
// dass bei GLEICHER Zeile (waagrechte Nachbarglieder) die Kopf-naeheren Glieder weiterhin wie
// bisher ueber den schwanz-naeheren liegen.
function draw() {
  // Zuerst die GESAMTE Zeichenflaeche inkl. Rand loeschen/neu zeichnen (nicht nur das Karo-Raster) -
  // sonst wuerden Boesewicht-/Futter-Teile, die letzten Tick in den Rand hineinragten, dort als Spur
  // liegen bleiben, da drawBoard() nur die GRID*CELL-Flaeche neu zeichnet. Statt eines einfarbigen
  // fillRect() wird hier die vorgerenderte Wiese (meadowCache, siehe Abschnitt "5c) Wiese" weiter
  // oben) als fertiges Bild hineinkopiert - ein einzelner drawImage()-Aufruf statt jeden Tick erneut
  // hunderte ueberlappende Grashalme/Blueten zu berechnen.
  ctx.drawImage(meadowCache, 0, 0);

  // Rest der Zeichenroutine bleibt unveraendert und rechnet weiterhin mit Koordinaten von 0 bis
  // BOARD_PX (Zellgrenzen etc.) - der Rand wird stattdessen per Verschiebung des Koordinatenursprungs
  // "aussen herum" gelegt, damit Elemente, die ueber die Feldkante hinausragen (Boesewicht-Hoernchen,
  // Futter-Icons in Randzellen), in diesen Rand hinein statt hart abgeschnitten gezeichnet werden.
  ctx.save();
  ctx.translate(CANVAS_MARGIN, CANVAS_MARGIN);

  drawBoard();

  // Wiese darf unten/links/rechts sichtbar ins Spielfeld hineinreichen (Wunsch von Marco) - drawBoard()
  // hat das Karo gerade VOLL deckend darueber gezeichnet, deshalb hier den entsprechenden Ausschnitt
  // aus meadowCache (der im Spielfeld-Bereich ausserhalb der eigentlichen Randstreifen transparent
  // ist, siehe buildMeadowCache()-Kommentar) noch einmal obendrauf kopieren. Quelle und Ziel sind
  // exakt derselbe Bildausschnitt, nur um CANVAS_MARGIN verschoben (da wir hier bereits im per
  // translate() verschobenen Koordinatensystem sind, meadowCache aber in den urspruenglichen,
  // unverschobenen Canvas-Koordinaten aufgebaut wurde). Die Boesewicht-/Futter-/Raupen-Objekte werden
  // ERST DANACH gezeichnet (siehe drawables unten) - liegen also IMMER ueber der hineinragenden
  // Wiese, auch wenn beide in derselben Feld-Zeile stehen (das war Marcos Vorrang-Wunsch).
  const mo = MEADOW_FIELD_OVERLAP;
  // unten:
  ctx.drawImage(meadowCache,
    0, CANVAS_MARGIN + BOARD_PX - mo, CANVAS_PX, CANVAS_MARGIN + mo,
    -CANVAS_MARGIN, BOARD_PX - mo, CANVAS_PX, CANVAS_MARGIN + mo);
  // links:
  ctx.drawImage(meadowCache,
    0, 0, CANVAS_MARGIN + mo, CANVAS_PX,
    -CANVAS_MARGIN, -CANVAS_MARGIN, CANVAS_MARGIN + mo, CANVAS_PX);
  // rechts:
  ctx.drawImage(meadowCache,
    CANVAS_MARGIN + BOARD_PX - mo, 0, CANVAS_MARGIN + mo, CANVAS_PX,
    BOARD_PX - mo, -CANVAS_MARGIN, CANVAS_MARGIN + mo, CANVAS_PX);

  const drawables = [];
  if (state.villainEnabled && state.villain) {
    drawables.push({ y: state.villain.y, draw: drawVillain });
  }
  if (state.food) {
    drawables.push({ y: state.food.y, draw: drawFood });
  }
  for (let i = state.snake.length - 1; i >= 0; i--) {
    drawables.push({ y: state.snake[i].y, draw: drawSnakeSegment.bind(null, i) });
  }
  drawables.sort(function (a, b) { return a.y - b.y; });
  for (const item of drawables) item.draw();

  drawOverlay();
  ctx.restore();
}

// ---------------------------------------------------------------
// 6) Game-Loop
// ---------------------------------------------------------------
// Statt setInterval(step, state.tickMs) (feste Rate, die der Browser nur "ungefaehr" einhaelt -
// je nach Auslastung des Tabs kommt ein Tick mal ein paar Millisekunden zu spaet, was sich als
// gelegentliches kurzes Ruckeln bemerkbar macht) verwenden wir einen SELBSTKORRIGIERENDEN
// setTimeout-Loop: er merkt sich den Zeitpunkt, zu dem der naechste Tick EIGENTLICH faellig waere
// (expectedTickTime), und zieht eine etwaige Verspaetung (drift) von der naechsten Wartezeit ab.
// So bleibt die Raupe im Mittel exakt beim eingestellten Tempo, auch wenn einzelne Ticks durch
// kurze Aussetzer (z. B. Tab kurz im Hintergrund beschaeftigt) etwas zu spaet kommen - sie holt
// die verlorene Zeit beim naechsten Tick wieder auf, statt den Fehler aufzusummieren. Bewusst
// weiterhin EIN einfacher Timer (kein requestAnimationFrame) - das Konzept will hier bewusst das
// einfachere Modell "ein Tick = ein Zeitgeber", nur eben mit Ausgleich statt blindem Vertrauen in
// die Timer-Genauigkeit.
let loopActive = false;
let timeoutId = null;
let expectedTickTime = 0;   // Zeitpunkt (performance.now()), zu dem der naechste Tick faellig ist

function updateScore() {
  scoreEl.textContent = 'Score: ' + state.score;
}

function updateInfo() {
  const modeLabel = state.mode === 'goal' ? ('Goal ' + (state.goalTarget !== null ? state.goalTarget : '?')) : 'Endless';
  infoEl.textContent =
    'Phase: ' + state.phase + ' · Tick ' + state.tick + ' · ' + state.tickMs + ' ms/Schritt · Punkte: ' + state.score +
    ' · Mode: ' + modeLabel + (state.villainEnabled ? ' · Villain' : '') +
    (state.overReason ? ' · Reason: ' + state.overReason : '');
}

// Zeigt an, welcher Modus aktuell gewaehlt ist (nur auf dem Startbildschirm relevant), und blendet
// das Zielwert-Feld nur im Ziel-Modus ein. Bewusst per style statt classList umgesetzt (einfacher,
// keine zusaetzliche CSS-Klasse noetig).
function updateModeButtons() {
  const isGoal = state.mode === 'goal';
  modeEndlessBtn.style.opacity = isGoal ? '0.55' : '1';
  modeGoalBtn.style.opacity = isGoal ? '1' : '0.55';
  goalInputWrap.style.display = isGoal ? 'flex' : 'none';
}

function setMode(mode) {
  state.mode = mode;
  goalError.textContent = '';
  updateModeButtons();
}

// Setzt Text UND Sichtbarkeit einer Endbildschirm-Zeile in einem Schritt: eine leere Zeile wird
// komplett ausgeblendet (nicht nur textlos), damit der flex-gap zwischen den Zeilen keine
// unschoene Luecke fuer eine ungenutzte Zeile freihaelt.
function setEndLine(el, text) {
  if (text) {
    el.textContent = text;
    el.style.display = 'block';
  } else {
    el.textContent = '';
    el.style.display = 'none';
  }
}

// Waehlt den passenden Text fuer den Endbildschirm - abhaengig davon, ob das Ziel erreicht wurde
// oder woran die Raupe gestorben ist (siehe state.overReason). Mit Marco abgestimmt (20.09.2026):
// - Ziel erreicht: "Look, I am a beautiful butterfly!" (Platzhalter-Text bis zum echten
//   Schmetterling-Bildschirm), plus Punktzahl kleiner darunter.
// - Tod durch den Boesewicht: eigene Text-Variante ("It was a trap! / There was no food!"),
//   UNABHAENGIG von der Punktzahl - auch bei 0 Punkten hat diese Variante Vorrang vor der
//   "Nichts gegessen"-Variante unten (bestaetigt 20.09.2026).
// - Kein Boesewicht-Tod, aber 0 Punkte: eigene "Nichts gegessen"-Variante ohne separate
//   Punktzahl-Zeile (waere redundant zu "Nothing eaten").
// - Kein Boesewicht-Tod, mindestens 1 Punkt: normale "still hungry"-Variante mit Punktzahl.
function applyEndScreenText() {
  if (state.phase === 'won') {
    setEndLine(endTitle, 'Look, I am a beautiful butterfly!');
    setEndLine(endLine1, '');
    setEndLine(endLine2, '');
    setEndLine(endScore, 'Score: ' + state.score);
    return;
  }

  setEndLine(endTitle, 'Game Over');
  if (state.overReason === 'villain') {
    setEndLine(endLine1, 'It was a trap!');
    setEndLine(endLine2, 'There was no food!');
    setEndLine(endScore, 'Score: ' + state.score);
  } else if (state.score === 0) {
    setEndLine(endLine1, 'ConcorPillar is starving!');
    setEndLine(endLine2, 'Nothing eaten');
    setEndLine(endScore, '');
  } else {
    setEndLine(endLine1, 'ConcorPillar is still hungry!');
    setEndLine(endLine2, '');
    setEndLine(endScore, 'Score: ' + state.score);
  }
}

// Zeigt/versteckt Start- bzw. Endbildschirm-Bereich je nach Spielphase, und setzt die jeweiligen
// Status-Texte/Button-Beschriftungen. Wird ueberall dort aufgerufen, wo sich die Phase aendern
// kann (siehe startLoop/stopLoop/step/resetGame unten).
function updateButtons() {
  const phase = state.phase;
  const showCenter = phase === 'ready' || phase === 'over' || phase === 'won';
  centerOverlay.style.display = showCenter ? 'flex' : 'none';
  readyControls.style.display = phase === 'ready' ? 'flex' : 'none';
  endControls.style.display = (phase === 'over' || phase === 'won') ? 'flex' : 'none';

  if (phase === 'ready') {
    overlayStatus.textContent = 'Ready?';
    updateModeButtons();
  } else if (phase === 'over' || phase === 'won') {
    restartBtn.textContent = 'Retry';
    applyEndScreenText();
  }

  const showPause = phase === 'running' || phase === 'paused';
  pauseBtn.style.display = showPause ? 'inline-block' : 'none';
  pauseBtn.textContent = phase === 'paused' ? 'Eat More!' : 'Take a Break!';
}

function step() {
  update();
  draw();
  updateScore();
  updateInfo();
  updateButtons();
}

// Fuehrt genau einen Tick aus und plant danach - falls der Loop noch laeuft - den naechsten,
// mit einer Wartezeit, die eine etwaige Verspaetung des VORHERIGEN Ticks schon ausgleicht.
function runTick() {
  expectedTickTime += state.tickMs;
  step();
  if (loopActive) scheduleNextTick();
}

function scheduleNextTick() {
  const drift = performance.now() - expectedTickTime;   // > 0, wenn wir bereits im Verzug sind
  const delay = Math.max(0, state.tickMs - drift);
  timeoutId = setTimeout(runTick, delay);
}

function startLoop() {
  if (loopActive) return;
  loopActive = true;
  expectedTickTime = performance.now();
  scheduleNextTick();
  updateInfo();
  updateButtons();
}

function stopLoop() {
  if (!loopActive) return;
  loopActive = false;
  clearTimeout(timeoutId);
  timeoutId = null;
  updateInfo();
  updateButtons();
}

function togglePause() {
  if (state.phase === 'running') {
    state.phase = 'paused';
    stopLoop();
    draw();
  } else if (state.phase === 'paused') {
    state.phase = 'running';
    startLoop();
  }
}

// ---------------------------------------------------------------
// 7) Ereignisse (Tastatur + Swipe + Buttons - alle rufen dieselben Funktionen auf)
// ---------------------------------------------------------------
document.addEventListener('keydown', function (e) {
  const dir = DIR_KEYS[e.code];
  const isSpace = e.code === 'Space';
  if (!dir && !isSpace) return;

  e.preventDefault();     // verhindert Scrollen der Seite, auch bei Pfeiltasten
  if (e.repeat) return;   // gehaltene Taste soll nicht mehrfach auslösen

  if (dir) {
    handleDirectionInput(dir);
  } else if (state.phase === 'over' || state.phase === 'won') {
    resetGame();
  } else if (state.phase !== 'ready') {
    togglePause();
  }
});

// Modus-Auswahl: nur auf dem Startbildschirm relevant (waehrend eines laufenden Spiels sind die
// Buttons ohnehin versteckt, siehe updateButtons()).
modeEndlessBtn.addEventListener('click', function () { setMode('endless'); });
modeGoalBtn.addEventListener('click', function () { setMode('goal'); });

// Start-, Neustart- und Pause-Button: dieselben Funktionen wie Tastatur/Swipe, nur ein anderer
// Ausloeser. "Start" liest zusaetzlich die auf dem Startbildschirm gewaehlten Einstellungen
// (Modus, Zielwert, Boesewicht) und uebernimmt sie erst jetzt in den state - bis zum Klick auf
// Start kann also noch alles geaendert werden, ohne ein laufendes Spiel zu beeinflussen.
startBtn.addEventListener('click', function () {
  if (state.phase !== 'ready') return;

  if (state.mode === 'goal') {
    const raw = parseInt(goalInput.value, 10);
    if (!Number.isInteger(raw) || raw < 1 || raw > MAX_GOAL_TARGET) {
      goalError.textContent = 'Please enter a whole number between 1 and ' + MAX_GOAL_TARGET + '.';
      return;
    }
    goalError.textContent = '';
    state.goalTarget = raw;
  } else {
    state.goalTarget = null;
  }
  state.villainEnabled = !!villainCheckbox.checked;

  handleDirectionInput(state.dir);
});
restartBtn.addEventListener('click', function () {
  if (state.phase === 'over' || state.phase === 'won') resetGame();
});
pauseBtn.addEventListener('click', function () {
  togglePause();
});

// Swipe-Steuerung: Die Richtung wird schon WAEHREND der Bewegung erkannt (touchmove), nicht erst
// beim Loslassen (touchend). Bei hohem Tempo bleibt sonst kaum Zeit zwischen Tick und Reaktion.
// Nach jeder erkannten Richtung wird der Referenzpunkt zurueckgesetzt, damit sich innerhalb
// derselben Beruehrung (ohne loszulassen) noch weitere Richtungswechsel erkennen lassen.
let touchRef = null;          // wird nach jedem erkannten Wisch aktualisiert
let sawSwipeThisTouch = false;

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  touchRef = { x: t.clientX, y: t.clientY };
  sawSwipeThisTouch = false;
}, { passive: false });

canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();   // verhindert Scrollen/Ziehen der Seite waehrend des Wischens
  if (!touchRef || e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - touchRef.x;
  const dy = t.clientY - touchRef.y;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  const threshold = sawSwipeThisTouch ? SWIPE_CONTINUE_PX : SWIPE_MIN_PX;
  if (Math.max(absDx, absDy) < threshold) return;   // noch keine ausreichende Bewegung

  const dir = absDx > absDy
    ? { x: dx > 0 ? 1 : -1, y: 0 }
    : { x: 0, y: dy > 0 ? 1 : -1 };
  handleDirectionInput(dir);
  sawSwipeThisTouch = true;
  touchRef = { x: t.clientX, y: t.clientY };   // ab hier neu messen
}, { passive: false });

canvas.addEventListener('touchend', function (e) {
  e.preventDefault();
  touchRef = null;
  sawSwipeThisTouch = false;
}, { passive: false });

// Tab im Hintergrund oder Bildschirm gesperrt: anhalten, nicht automatisch weiterlaufen.
// Die Phase wird jetzt mitgesetzt (nicht nur der Timer gestoppt), sonst würde eine Eingabe
// nach dem Zurückkommen sofort weiterlaufen, ohne dass "Pause" sichtbar war.
document.addEventListener('visibilitychange', function () {
  if (document.hidden && state.phase === 'running') {
    state.phase = 'paused';
    stopLoop();
  }
});

window.addEventListener('resize', function () {
  setupCanvas();   // Pixeldichte kann sich beim Zoomen ändern
  draw();
});

// ---------------------------------------------------------------
// 8) Start
// ---------------------------------------------------------------
function resetGame() {
  stopLoop();
  state.snake = [
    { x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }, { x: 5, y: 10 }
  ];
  state.dir = { x: 1, y: 0 };
  state.nextDir = { x: 1, y: 0 };
  state.tick = 0;
  state.score = 0;
  state.phase = 'ready';
  state.food = null;
  state.tickMs = START_TICK_MS;
  state.villain = null;
  state.villainCooldown = 0;
  state.overReason = null;
  // state.mode/goalTarget/villainEnabled bewusst NICHT zurueckgesetzt: das sind die auf dem
  // Startbildschirm gewaehlten Einstellungen, die beim naechsten Klick auf Start ohnehin frisch
  // aus den Bedienelementen (goalInput/villainCheckbox) uebernommen werden (siehe oben).
  spawnFood();
  draw();
  updateScore();
  updateInfo();
  updateButtons();
}

// init() wartet jetzt zuerst auf preloadFoodImages() (die drei Futter-SVGs werden aus data:-URIs
// geladen), bevor resetGame() zum ersten Mal zeichnet - sonst waere beim allerersten Frame
// moeglicherweise noch kein Bild bereit, falls zufaellig Pizza/Eis/Bier als erstes Futter gewaehlt
// wird. Bei data:-URIs (keine Netzwerk-Anfrage) ist das in der Praxis nahezu sofort fertig, ein
// kurzer Ladezustand ist aber nicht sichtbar dargestellt (kein Spinner) - bewusste, unkritische
// Vereinfachung, da kein Warten spuerbar sein sollte.
async function init() {
  setupCanvas();
  try {
    await preloadFoodImages();
  } catch (e) {
    infoEl.textContent = 'Fehler beim Laden der Futter-Icons: ' + e.message;
  }
  resetGame();
}

init();
</script>
